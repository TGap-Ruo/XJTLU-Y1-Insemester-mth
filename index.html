<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTH026 · Complete Question Bank &amp; Smart Quiz</title>
<link rel="stylesheet" href="katex/katex.min.css">
<style>
:root{
  --ink:#101827; --ink2:#3a4759; --ink3:#6c7b90; --ink4:#96a3b4;
  --line:#e3e9f1; --line2:#eef3f8; --bg:#f4f7fb; --paper:#fff;
  --pri:#16406e; --pri2:#2c6ba8; --pri3:#eaf1fa;
  --green:#1d6b47; --green-bg:#edf8f1; --green-line:#bfe2cd;
  --red:#a8352a; --red-bg:#fdf1ef; --red-line:#f0cdc7;
  --amber:#98621a; --amber-bg:#fdf7ec; --gold:#c8922e;
  --sh:0 1px 2px rgba(16,32,56,.05),0 10px 26px -14px rgba(16,32,56,.18);
  --sh2:0 2px 6px rgba(16,32,56,.07),0 22px 48px -20px rgba(16,32,56,.24);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,"PingFang SC",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.hide{display:none!important}

/* topbar */
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:58px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap;min-width:0;flex:0 0 auto}
.brand .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#16406e,#2c6ba8);
  color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.03em}
.brand small{display:block;font-size:10.5px;color:var(--ink3);font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  overflow:hidden;text-overflow:ellipsis;max-width:100%}
.brand>div:last-child{min-width:0;overflow:hidden}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
  border-radius:100px;padding:5px 11px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;transition:.16s;white-space:nowrap}
.btn.pri{background:var(--pri);color:#fff;box-shadow:0 1px 2px rgba(22,64,110,.3)}
.btn.pri:hover{background:#12365e}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink2)}
.btn.ghost:hover{border-color:#c9d5e3;background:#fafcfe}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* the bar carries a lot of chrome; drop the least important chips first */
@media(max-width:1300px){#cStreak{display:none}}
@media(max-width:1080px){.brand small{display:none}}
@media(max-width:1010px){#cAns,#cAcc{display:none}}
@media(max-width:860px){.top .wrap{gap:8px}.brand>div{font-size:13.5px}}
@media(max-width:560px){#acctName{display:none}#btnAcct{padding:9px 11px}
  .brand>div{display:none}.top .wrap{gap:6px}
  .top .btn.ghost{font-size:13px;padding:8px 11px}}
@media(max-width:520px){#btnReset,.brand{display:none}}

/* hero */
.hero{margin:26px 0 20px;background:linear-gradient(130deg,#12325a,#1e5289 60%,#2e6fae);
  border-radius:20px;padding:30px 32px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh2)}
.hero:after{content:"";position:absolute;inset:0;opacity:.35;pointer-events:none;
  background:radial-gradient(700px 260px at 88% -10%,rgba(255,214,140,.5),transparent 70%)}
.hero>*{position:relative;z-index:1}
.hero h1{margin:0 0 6px;font-size:26px;letter-spacing:-.01em}
.hero p{margin:0;color:#cfe0f2;font-size:14px;max-width:58ch}
.hero .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hero .btn.light{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff}
.hero .btn.light:hover{background:rgba(255,255,255,.22)}
.hero .btn.white{background:#fff;color:var(--pri)}

/* grids */
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:820px){.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px;box-shadow:var(--sh)}
.card.click{cursor:pointer;transition:.16s}
.card.click:hover{border-color:#bcd2e8;transform:translateY(-1px);box-shadow:var(--sh2)}
.card h3{margin:0 0 4px;font-size:15px}
.card .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pri2);font-weight:700}
.card p{margin:6px 0 0;font-size:13px;color:var(--ink3);line-height:1.55}
.stat{font-size:26px;font-weight:700;letter-spacing:-.02em}
.stat small{font-size:12px;font-weight:500;color:var(--ink3);margin-left:4px}

/* section list */
.sec-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2)}
.sec-row:last-child{border:0}
.sec-id{font-size:11px;font-weight:700;color:#fff;background:var(--pri2);border-radius:5px;
  padding:1px 7px;min-width:38px;text-align:center}
.sec-t{flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{width:112px;height:7px;border-radius:100px;background:#eef2f7;overflow:hidden;flex:0 0 auto}
.bar i{display:block;height:100%;background:var(--pri2);border-radius:100px;transition:.3s}
.bar i.ok{background:#2f9e6b}.bar i.warn{background:#e0a33a}.bar i.bad{background:#cf5b4a}
.sec-n{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;width:96px;text-align:right;flex:0 0 auto}
.sec-n .miss{color:var(--red);font-weight:700;font-size:11px;margin-left:3px}

/* bilingual labels: English stays primary, Chinese rides along in grey */
.zhx,.tz{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:11.5px;font-weight:500;letter-spacing:0;color:var(--ink4)}
.sec-t .tz{margin-left:6px;font-size:11.5px}
.k .zhx{margin-left:5px;text-transform:none;letter-spacing:0;font-size:11px}
.btn .zhx{margin-left:4px;font-size:11px;opacity:.7;color:inherit}
@media(max-width:1320px){.navz{display:none}}
.hero .zh{color:#bdd3ea;font-size:13px;margin-top:8px;max-width:58ch;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.hero .zh b{color:#fff}

/* engine status strip */
.eng{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
  border-left:3px solid var(--pri2);border-radius:12px;padding:10px 15px;margin:0 0 18px;font-size:12.5px;
  color:var(--ink2);box-shadow:var(--sh)}
.eng b{color:var(--ink);font-variant-numeric:tabular-nums}
.eng .sep{color:var(--line);font-size:14px}
.eng .zhx{font-size:11.5px}
.eng .lnk{font-size:12px;color:var(--pri2);text-decoration:underline;text-underline-offset:2px}
.why{display:flex;align-items:flex-start;gap:8px;background:#f7fafd;border:1px dashed #cfdcea;
  border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:12.5px;color:var(--ink2);line-height:1.5}
.why .tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--pri2);font-weight:700;flex:0 0 auto}
@media(max-width:640px){
  .sec-t{white-space:normal;line-height:1.45;font-size:13px}
  .sec-t .tz{display:inline;margin-left:5px;font-size:11px}
  .sec-n{width:74px;font-size:11.5px}
  .bar{width:76px}
  .sec-row{padding:10px 0}
}

/* quiz */
.qwrap{max-width:760px;margin:22px auto 60px;min-height:calc(100vh - 190px);display:flex;flex-direction:column;justify-content:center}
.qwrap>*{flex:0 0 auto}
.qcard{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh2);overflow:hidden}
.qhead{display:flex;align-items:center;gap:10px;padding:12px 18px;background:#f7fafd;border-bottom:1px solid var(--line)}
.qno{font-size:12px;font-weight:700;color:#fff;background:var(--pri2);border-radius:6px;padding:2px 9px;flex:0 0 auto}
.qsec{font-size:12px;color:var(--ink3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qprog{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto;white-space:nowrap}
@media(max-width:760px){.qprog .track{display:none}}
.qprog .track{width:96px;height:6px;background:#e7edf4;border-radius:100px;overflow:hidden}
.qprog .track i{display:block;height:100%;background:linear-gradient(90deg,#2c6ba8,#3f86c9);border-radius:100px}
.qbody{padding:16px 18px 6px}
.qimg{display:block;width:100%;height:auto;border-radius:8px}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px 18px 6px}
@media(max-width:560px){.opts{grid-template-columns:repeat(3,1fr)}}
.opt{border:1.5px solid var(--line);border-radius:11px;padding:12px 0;font-size:17px;font-weight:700;
  color:var(--ink2);background:#fff;transition:.14s;text-align:center;font-variant-numeric:tabular-nums}
.opt:hover:not(:disabled){border-color:#a9c6e4;background:#f7fbff;color:var(--pri)}
.opt.sel{border-color:var(--pri2);background:var(--pri3);color:var(--pri)}
.opt.ok{border-color:#4aa87c;background:var(--green-bg);color:var(--green)}
.opt.bad{border-color:#d2776a;background:var(--red-bg);color:var(--red)}
.opt:disabled{cursor:default}

/* reference */
.tabs{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 15px;
  font-size:13px;cursor:pointer;color:var(--ink2);font-family:inherit}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.ref-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 18px 16px;
  margin-bottom:12px;box-shadow:var(--sh);break-inside:avoid}
.ref-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px;
  padding-bottom:9px;border-bottom:1px solid var(--line2)}
.ref-id{font-size:12px;font-weight:800;color:#fff;background:var(--pri2);padding:2px 8px;
  border-radius:6px;letter-spacing:.03em}
.ref-en{font-size:15.5px;font-weight:700;color:var(--ink)}
.ref-zh{font-size:13px;color:var(--ink3)}
.ref-k{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink4);
  margin:0 0 3px;font-weight:700}
.ref-focus{font-size:14px;margin:0 0 11px;color:var(--ink2)}
.ref-steps{margin:0 0 11px;padding-left:20px;font-size:13.8px;line-height:1.9;color:var(--ink)}
.ref-steps li{margin:1px 0}
.ref-note{font-size:13.4px;color:var(--ink2);background:var(--pri3);border-radius:10px;
  padding:9px 12px;margin:0 0 10px}
.ref-trap{font-size:13px;color:var(--red);background:var(--red-bg);
  border-left:3px solid var(--red);border-radius:0 8px 8px 0;padding:8px 12px}
.ref-trap b{color:var(--red)}
.sec-hd{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px;padding-bottom:6px;
  border-bottom:2px solid var(--pri)}
.sec-hd .n{font-size:12px;color:#fff;background:var(--pri);padding:2px 8px;border-radius:6px;font-weight:700}
.sec-hd .t{font-size:16px;font-weight:700}
.sec-hd .s{font-size:12.5px;color:var(--ink3)}
.fbox{display:grid;grid-template-columns:1fr;gap:0}
@media(max-width:700px){.fbox{grid-template-columns:1fr}}
.frow{display:flex;gap:14px;justify-content:space-between;border-bottom:1px dotted var(--line);
  padding:6px 0;font-size:14px;align-items:baseline}
.frow>span:last-child{color:var(--ink3);text-align:right}
.gl{width:100%;border-collapse:collapse;font-size:13.5px}
.gl td{padding:7px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
.gl td:nth-child(1){font-weight:700;width:32%}
.gl td:nth-child(2){color:var(--ink2);width:24%}
.gl td:nth-child(3){color:var(--ink3)}

/* feedback */
.fb{margin:12px 18px 18px;border-radius:12px;border:1px solid var(--line);overflow:hidden}
.fb.ok{border-color:var(--green-line);background:var(--green-bg)}
.fb.bad{border-color:var(--red-line);background:var(--red-bg)}
.fb .h{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:700;font-size:14px}
.fb.ok .h{color:var(--green)}.fb.bad .h{color:var(--red)}
.fb .h .tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.6);
  border-radius:100px;padding:1px 8px;font-weight:700}
.sol{padding:0 14px 15px}
.sol .col{font-size:14px;line-height:1.68;color:var(--ink2)}
.sol .col .lb{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink4);
  font-weight:700;margin-bottom:4px}
.sol .col+.col{margin-top:12px;padding-top:11px;border-top:1px dashed rgba(16,40,70,.16)}
.sol .zh{color:var(--ink);font-size:14px}
.sol .zh .lb{color:var(--ink3)}
.katex{font-size:1.02em}

/* results */
.res{max-width:760px;margin:22px auto 60px}
.bigscore{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.muted{color:var(--ink3);font-size:13px}
.pill{display:inline-block;font-size:12px;background:#f2f6fb;border:1px solid var(--line);
  border-radius:100px;padding:2px 10px;color:var(--ink2);margin:0 6px 6px 0}
.filter{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.filter button{font-size:13px;padding:6px 13px;border-radius:100px;border:1px solid var(--line);
  background:#fff;color:var(--ink2)}
.filter button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
/* unified item index */
.idxsearch{margin:2px 0 10px}
.idxsearch input{width:100%;max-width:440px;font:inherit;font-size:13.5px;padding:9px 13px;
  border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:none}
.idxsearch input:focus{border-color:#a9c6e4;box-shadow:0 0 0 3px rgba(44,107,168,.10)}
.idxmeta{font-size:12px;color:var(--ink3);margin:0 0 10px;font-variant-numeric:tabular-nums}
.idxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:7px;
  max-height:58vh;overflow:auto;padding:2px}
.idx-b{display:flex;flex-direction:column;align-items:flex-start;position:relative;border:1px solid var(--line);
  background:#fff;border-radius:9px;padding:6px 9px;font-variant-numeric:tabular-nums;transition:.14s}
.idx-b b{font-size:13px;font-weight:700;color:var(--ink2);line-height:1.3}
.idx-b i{font-size:10px;color:var(--ink4);font-style:normal;line-height:1.2}
.idx-b u{position:absolute;right:7px;top:5px;font-size:10px;text-decoration:none}
.idx-b.p b{color:#8a5a12}
.idx-b:hover{border-color:#a9c6e4;background:#f7fbff}
.idx-b.ok{border-color:var(--green-line);background:var(--green-bg)}
.idx-b.ok u{color:var(--green)}
.idx-b.bad{border-color:var(--red-line);background:var(--red-bg)}
.idx-b.bad u{color:var(--red)}

/* account */
.dot{width:7px;height:7px;border-radius:50%;background:#c3ccd8;display:inline-block;flex:0 0 auto}
.dot.on{background:#2f9e6b}.dot.err{background:#cf5b4a}
.modal{position:fixed;inset:0;background:rgba(12,22,36,.42);display:none;z-index:80;
  align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:18px;box-shadow:var(--sh2);width:100%;max-width:404px;padding:22px 24px 20px;
  max-height:88vh;overflow:auto}
.mhd{display:flex;align-items:flex-start;gap:10px}
.mhd h3{margin:0;font-size:17px}
.mhd .x{margin-left:auto;font-size:14px;color:var(--ink3);padding:2px 7px;border-radius:8px;line-height:1.4}
.mhd .x:hover{background:#f2f6fb}
.mtabs{display:flex;gap:8px;margin:14px 0 14px}
.mtabs button{flex:1;padding:8px 0;font-size:13.5px;border-radius:9px;border:1px solid var(--line);
  background:#fff;color:var(--ink2)}
.mtabs button.on{background:var(--pri3);border-color:#bcd2e8;color:var(--pri);font-weight:700}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:12px;color:var(--ink3);margin-bottom:4px;font-weight:600}
.fld input{width:100%;font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line);
  border-radius:9px;outline:none;background:#fff;color:var(--ink)}
.fld input:focus{border-color:#a9c6e4;box-shadow:0 0 0 3px rgba(44,107,168,.10)}
.merr{font-size:12.5px;color:var(--red);background:var(--red-bg);border-radius:8px;padding:7px 11px;margin:0 0 11px}
.mnote{font-size:12px;color:var(--ink3);margin:12px 0 0;line-height:1.6}
.who{display:flex;align-items:center;gap:12px;margin:14px 0 16px}
.who .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#16406e,#2c6ba8);
  color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex:0 0 auto}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:rgba(16,24,39,.92);color:#fff;padding:10px 18px;border-radius:100px;font-size:13.5px;
  opacity:0;transition:.24s;z-index:99;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* star / favourites */
.star{flex:0 0 auto;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;
  font-size:18px;line-height:1;color:var(--ink4);border:1px solid var(--line);border-radius:9px;
  background:#fff;padding:0;transition:.14s}
.star:hover{border-color:var(--gold);color:var(--gold);background:#fffaf0}
.star.on{color:var(--gold);border-color:#e6cf9c;background:#fff8e8}
.qhead>.star{margin-left:auto}
.qhead>.star+.qprog{margin-left:8px}
.btn.ic{padding:9px 12px;font-size:15px;flex:0 0 auto}
.btn.ic .zhx{font-size:11px;margin-left:4px}
@media(max-width:1320px){#btnFav .zhx{display:none}}
@media(max-width:560px){.btn.ic{padding:8px 9px;font-size:14px}#btnFav{padding:8px 9px}}

/* preview + favourites board */
.pv-hd2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:24px 0 4px}
.pv-hd2 h2{margin:0;font-size:22px}
.pv-sub{color:var(--ink3);font-size:13px;margin:0 0 14px}
.pv-tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.pv-grid{max-height:180px}
.pv-count{font-size:12px;color:var(--ink3);margin:0 0 8px;font-variant-numeric:tabular-nums}
.pv-cards{display:grid;grid-template-columns:1fr;gap:14px;margin:14px 0}
.pv-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);
  overflow:hidden;scroll-margin-top:78px}
.pv-card.hl{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,146,46,.28),var(--sh2)}
.pv-hd{display:flex;align-items:center;gap:9px;padding:10px 14px;background:#f7fafd;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.pv-hd .qno{flex:0 0 auto}
.qno.pq{background:#9a6a1c}
.pv-sec{font-size:12.5px;color:var(--ink2);min-width:0;flex:1 1 auto;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.pv-done{font-size:11.5px;color:var(--ink4);flex:0 0 auto;white-space:nowrap}
.pv-done.ok{color:var(--green)}.pv-done.bad{color:var(--red)}
.pv-img{padding:12px 14px 2px}
.pv-img img{display:block;width:100%;height:auto;border-radius:8px}
.pv-ans{margin:10px 14px 0;background:var(--green-bg);border:1px solid var(--green-line);
  border-radius:10px;padding:9px 13px;font-size:14px;color:var(--green);font-weight:700}
.pv-ans b{font-size:16px}
.pv-note{margin:10px 14px 0;font-size:12px;color:var(--amber);background:var(--amber-bg);
  border-radius:9px;padding:7px 11px}
.pv-aimg,.pv-simg{margin:10px 14px 0}
.pv-aimg img{display:block;max-width:100%;max-height:74px;width:auto;height:auto;border-radius:6px}

<script>const DATA = {"items":[{"id":1,"s":"1.1","c":0,"a":"E","en":"A log needs a strictly positive argument: $-x^{2}-3x+28&gt;0\\iff x^{2}+3x-28&lt;0\\iff(x+7)(x-4)&lt;0$, so $-7&lt;x&lt;4$. Both ends are excluded because the argument is $0$ there, hence $(-7,4)$.","zh":"真数须严格大于 $0$：两边乘 $-1$ 反转不等号，得 $(x+7)(x-4)&lt;0$，解集 $-7&lt;x&lt;4$。端点处真数为 $0$，一律取不到，故为开区间 $(-7,4)$。","focus":"The argument of a logarithm must be strictly positive; solve the resulting polynomial or rational inequality.","trap":"Writing ≥ 0 instead of &gt; 0; keeping the roots inside the interval."},{"id":2,"s":"1.1","c":0,"a":"B","en":"Factor the argument: $x^{2}+2x-15=(x+5)(x-3)&gt;0$. An upward parabola is positive outside its roots, so $x&lt;-5$ or $x&gt;3$.","zh":"真数因式分解 $(x+5)(x-3)&gt;0$。开口向上的抛物线在两根外侧为正，故取外侧区间，端点不含。","focus":"The argument of a logarithm must be strictly positive; solve the resulting polynomial or rational inequality.","trap":"Writing ≥ 0 instead of &gt; 0; keeping the roots inside the interval."},{"id":3,"s":"1.1","c":0,"a":"C","en":"$-x^{2}-10x-16&gt;0\\iff x^{2}+10x+16&lt;0\\iff(x+8)(x+2)&lt;0$, giving $-8&lt;x&lt;-2$.","zh":"乘 $-1$ 得 $x^{2}+10x+16&lt;0$，即 $(x+8)(x+2)&lt;0$。开口向上取内侧，得 $(-8,-2)$。","focus":"The argument of a logarithm must be strictly positive; solve the resulting polynomial or rational inequality.","trap":"Writing ≥ 0 instead of &gt; 0; keeping the roots inside the interval."},{"id":4,"s":"1.1","c":0,"a":"D","en":"$-x^{2}-2x+8&gt;0\\iff(x+4)(x-2)&lt;0$, so $-4&lt;x&lt;2$.","zh":"化为 $(x+4)(x-2)&lt;0$，开口向上取两根之间，得 $(-4,2)$。","focus":"The argument of a logarithm must be strictly positive; solve the resulting polynomial or rational inequality.","trap":"Writing ≥ 0 instead of &gt; 0; keeping the roots inside the interval."},{"id":5,"s":"1.1","c":0,"a":"D","en":"$-x^{2}-7x-6&gt;0\\iff(x+6)(x+1)&lt;0$, so $-6&lt;x&lt;-1$.","zh":"化为 $(x+6)(x+1)&lt;0$，取两根之间，得 $(-6,-1)$。","focus":"The argument of a logarithm must be strictly positive; solve the resulting polynomial or rational inequality.","trap":"Writing ≥ 0 instead of &gt; 0; keeping the roots inside the interval."},{"id":6,"s":"1.1","c":0,"a":"D","en":"A quotient is positive when numerator and denominator share a sign. Zeros are $x=-5$ and $x=-\\tfrac34$; testing $x=0$ gives $\\tfrac{5}{3}&gt;0$, so the sign is $+$ outside the interval and the domain is $(-\\infty,-5)\\cup(-\\tfrac34,\\infty)$.","zh":"分式为正等价于分子分母同号。临界点 $x=-5$ 与 $x=-\\tfrac34$，取 $x=0$ 检验得 $\\tfrac53&gt;0$，说明两根外侧为正，故定义域为 $(-\\infty,-5)\\cup(-\\tfrac34,\\infty)$。","focus":"The argument of a logarithm must be strictly positive; solve the resulting polynomial or rational inequality.","trap":"Writing ≥ 0 instead of &gt; 0; keeping the roots inside the interval."},{"id":7,"s":"1.1","c":0,"a":"B","en":"Zeros of numerator and denominator are $x=-\\tfrac53$ and $x=-5$. Testing $x=-2$ gives $\\tfrac{1}{3}&gt;0$, so the sign is $+$ only between the roots: $(-5,-\\tfrac53)$. The source answer key labels this item \\\"none of these\\\", which is an error in that key.","zh":"分子零点 $x=-\\tfrac53$，分母零点 $x=-5$。取 $x=-2$ 检验得 $\\tfrac13&gt;0$，说明正号只在两根之间，故为 $(-5,-\\tfrac53)$。原题库答案标为\\\"以上都不对\\\"，属原答案笔误。","focus":"The argument of a logarithm must be strictly positive; solve the resulting polynomial or rational inequality.","trap":"Writing ≥ 0 instead of &gt; 0; keeping the roots inside the interval."},{"id":8,"s":"1.1","c":0,"a":"E","en":"Zeros are $x=-\\tfrac54$ and $x=-5$. At $x=-2$ the quotient is $\\tfrac{3}{3}=1&gt;0$, so the positive region is between the roots: $(-5,-\\tfrac54)$.","zh":"两根为 $x=-\\tfrac54$ 与 $x=-5$。取 $x=-2$ 得 $\\tfrac33=1&gt;0$，正号区间夹在两根之间，故为 $(-5,-\\tfrac54)$。","focus":"The argument of a logarithm must be strictly positive; solve the resulting polynomial or rational inequality.","trap":"Writing ≥ 0 instead of &gt; 0; keeping the roots inside the interval."},{"id":9,"s":"1.1","c":0,"a":"A","en":"Zeros are $x=-6$ and $x=\\tfrac54$. At $x=0$ the quotient is $\\tfrac{-6}{-5}&gt;0$, so the domain is the open interval $(-6,\\tfrac54)$. The source key again says \\\"none of these\\\", which is a key error.","zh":"两根为 $x=-6$ 与 $x=\\tfrac54$。取 $x=0$ 得 $\\tfrac{-6}{-5}&gt;0$，正号区间在两根之间，故为 $(-6,\\tfrac54)$。原答案标为\\\"以上都不对\\\"，同样是原答案笔误。","focus":"The argument of a logarithm must be strictly positive; solve the resulting polynomial or rational inequality.","trap":"Writing ≥ 0 instead of &gt; 0; keeping the roots inside the interval."},{"id":10,"s":"1.1","c":0,"a":"D","en":"Zeros are $x=-6$ and $x=2$; testing $x=0$ gives $\\tfrac{-6}{-2}=3&gt;0$, so the domain is $(-6,2)$.","zh":"两根为 $x=-6$、$x=2$。代 $x=0$ 得 $\\tfrac{-6}{-2}=3&gt;0$，取两根之间，得 $(-6,2)$。","focus":"The argument of a logarithm must be strictly positive; solve the resulting polynomial or rational inequality.","trap":"Writing ≥ 0 instead of &gt; 0; keeping the roots inside the interval."},{"id":11,"s":"1.2","c":0,"a":"C","en":"$(g\\circ f)(x_0)$ means $g$ applied to $f(x_0)$: $f(\\tfrac{\\pi}{6})=3\\cdot\\tfrac{\\pi}{6}=\\tfrac{\\pi}{2}$, then $g(\\tfrac{\\pi}{2})=\\sec(\\pi)=-1$.","zh":"$(g\\circ f)(x_0)$ 是先算内层 $f$：$f(\\tfrac{\\pi}{6})=\\tfrac{\\pi}{2}$，再代入 $g$ 得 $\\sec(\\pi)=-1$。顺序反过来会得到完全不同的值。","focus":"Compose two functions and evaluate at the given point — substitute inner first.","trap":"Applying the functions in the wrong order; rounding π/6 to a decimal too early."},{"id":12,"s":"1.2","c":0,"a":"A","en":"Inner first: $g(\\tfrac{\\pi}{6})=\\cos\\tfrac{\\pi}{2}=0$, then $f(0)=2-0=2$.","zh":"先算内层：$g(\\tfrac{\\pi}{6})=\\cos\\tfrac{\\pi}{2}=0$，再代入 $f$ 得 $f(0)=2$。","focus":"Compose two functions and evaluate at the given point — substitute inner first.","trap":"Applying the functions in the wrong order; rounding π/6 to a decimal too early."},{"id":13,"s":"1.2","c":0,"a":"B","en":"$g(\\tfrac{\\pi}{6})=\\tan\\tfrac{2\\pi}{3}=-\\sqrt3$, then $f(-\\sqrt3)=2(-\\sqrt3)=-2\\sqrt3$.","zh":"内层 $g(\\tfrac{\\pi}{6})=\\tan\\tfrac{2\\pi}{3}=-\\sqrt3$，外层 $f$ 只是乘 $2$，得 $-2\\sqrt3$。","focus":"Compose two functions and evaluate at the given point — substitute inner first.","trap":"Applying the functions in the wrong order; rounding π/6 to a decimal too early."},{"id":14,"s":"1.2","c":0,"a":"E","en":"$g(\\tfrac{\\pi}{4})=\\cos\\tfrac{\\pi}{2}=0$, so $f(0)=2-2(0)^2=2$.","zh":"$g(\\tfrac{\\pi}{4})=\\cos\\tfrac{\\pi}{2}=0$，故 $f(0)=2$。余弦在 $\\tfrac{\\pi}{2}$ 处为零是本题的关键。","focus":"Compose two functions and evaluate at the given point — substitute inner first.","trap":"Applying the functions in the wrong order; rounding π/6 to a decimal too early."},{"id":15,"s":"1.2","c":0,"a":"D","en":"$(g\\circ f)$: $f(\\tfrac{\\pi}{3})=\\tfrac{2\\pi}{3}$, then $\\tan\\bigl(2\\cdot\\tfrac{2\\pi}{3}\\bigr)=\\tan\\tfrac{4\\pi}{3}=\\sqrt3$.","zh":"先 $f(\\tfrac{\\pi}{3})=\\tfrac{2\\pi}{3}$，再算 $g$ 得 $\\tan\\tfrac{4\\pi}{3}=\\sqrt3$。第三象限正切为正。","focus":"Compose two functions and evaluate at the given point — substitute inner first.","trap":"Applying the functions in the wrong order; rounding π/6 to a decimal too early."},{"id":16,"s":"1.2","c":0,"a":"A","en":"$g(\\tfrac{5\\pi}{24})=\\cos\\tfrac{5\\pi}{6}=-\\tfrac{\\sqrt3}{2}$, so $f=\\;2-\\bigl(\\tfrac{\\sqrt3}{2}\\bigr)^{2}=2-\\tfrac34=\\tfrac54$.","zh":"$g(\\tfrac{5\\pi}{24})=\\cos\\tfrac{5\\pi}{6}=-\\tfrac{\\sqrt3}{2}$，平方后负号消失，$f=2-\\tfrac34=\\tfrac54$。","focus":"Compose two functions and evaluate at the given point — substitute inner first.","trap":"Applying the functions in the wrong order; rounding π/6 to a decimal too early."},{"id":17,"s":"1.2","c":0,"a":"A","en":"$g(\\tfrac{5\\pi}{18})=\\sec\\tfrac{5\\pi}{6}=-\\tfrac{2}{\\sqrt3}$, then $f=2\\cdot\\bigl(-\\tfrac{2}{\\sqrt3}\\bigr)=-\\tfrac{4}{\\sqrt3}=-\\tfrac{4\\sqrt3}{3}$.","zh":"$\\sec\\tfrac{5\\pi}{6}=\\tfrac{1}{\\cos}=-\\tfrac{2}{\\sqrt3}$，乘 $2$ 后有理化分母，得 $-\\tfrac{4\\sqrt3}{3}$。","focus":"Compose two functions and evaluate at the given point — substitute inner first.","trap":"Applying the functions in the wrong order; rounding π/6 to a decimal too early."},{"id":18,"s":"1.2","c":0,"a":"B","en":"$g(\\tfrac{3\\pi}{16})=\\tan\\tfrac{3\\pi}{4}=-1$, so $f=2-(-1)^{2}=1$.","zh":"$\\tan\\tfrac{3\\pi}{4}=-1$，平方为 $1$，故 $f=2-1=1$。","focus":"Compose two functions and evaluate at the given point — substitute inner first.","trap":"Applying the functions in the wrong order; rounding π/6 to a decimal too early."},{"id":19,"s":"1.2","c":0,"a":"D","en":"$(g\\circ f)$: $f(\\tfrac{\\pi}{3})=\\pi$, and $\\tan\\pi=0$.","zh":"$f(\\tfrac{\\pi}{3})=3\\cdot\\tfrac{\\pi}{3}=\\pi$，而 $\\tan\\pi=0$。注意 $\\pi$ 是正切的零点。","focus":"Compose two functions and evaluate at the given point — substitute inner first.","trap":"Applying the functions in the wrong order; rounding π/6 to a decimal too early."},{"id":20,"s":"1.2","c":0,"a":"D","en":"$g(\\tfrac{\\pi}{3})=\\sec\\tfrac{\\pi}{3}=2$, so $f=2-2(2)^{2}=-6$.","zh":"$\\sec\\tfrac{\\pi}{3}=2$，平方后乘 $2$ 得 $8$，故 $f=2-8=-6$。","focus":"Compose two functions and evaluate at the given point — substitute inner first.","trap":"Applying the functions in the wrong order; rounding π/6 to a decimal too early."},{"id":21,"s":"1.3","c":0,"a":"A","en":"Write $y=\\frac{1-\\sqrt{x}}{3\\sqrt{x}+1}$ and solve: $y(3\\sqrt x+1)=1-\\sqrt x\\Rightarrow\\sqrt x(3y+1)=1-y\\Rightarrow\\sqrt x=\\frac{1-y}{3y+1}$. Squaring gives $f^{-1}(x)=\\frac{(x-1)^{2}}{(3x+1)^{2}}$, and $\\sqrt x\\ge0$ forces $\\frac{1-x}{3x+1}\\ge0$, i.e. $-\\tfrac13&lt;x\\le1$.","zh":"把 $y$ 与 $x$ 对调后解出 $\\sqrt x=\\frac{1-y}{3y+1}$，平方得反函数；再用 $\\sqrt x\\ge0$ 要求 $\\frac{1-x}{3x+1}\\ge0$，得定义域 $(-\\tfrac13,1]$。定义域不是随便写的，由根号非负决定。","focus":"Find the inverse of a fractional-linear (or radical) function and state its domain.","trap":"Reporting the domain of f instead of the range of f; forgetting to exclude a value that makes the denominator zero."},{"id":22,"s":"1.3","c":0,"a":"A","en":"$y(5\\sqrt x+2)=2-3\\sqrt x\\Rightarrow\\sqrt x=\\frac{2-2y}{5y+3}$, so $f^{-1}(x)=\\frac{4(1-x)^{2}}{(5x+3)^{2}}$ with $\\frac{2-2x}{5x+3}\\ge0$, i.e. $-\\tfrac35&lt;x\\le1$.","zh":"同法解出 $\\sqrt x=\\frac{2-2y}{5y+3}$，分子提出 $2$ 后平方得 $4(1-x)^2$；定义域由 $\\sqrt x\\ge0$ 定出 $(-\\tfrac35,1]$。","focus":"Find the inverse of a fractional-linear (or radical) function and state its domain.","trap":"Reporting the domain of f instead of the range of f; forgetting to exclude a value that makes the denominator zero."},{"id":23,"s":"1.3","c":0,"a":"D","en":"$y(\\sqrt x+3)=1-2\\sqrt x\\Rightarrow\\sqrt x=\\frac{1-3y}{y+2}$, so $f^{-1}(x)=\\frac{(3x-1)^{2}}{(x+2)^{2}}$ with $x\\in(-2,\\tfrac13]$.","zh":"解出 $\\sqrt x=\\frac{1-3y}{y+2}$，平方后分子写成 $(3x-1)^2$ 更整齐；定义域由非负性得 $(-2,\\tfrac13]$。","focus":"Find the inverse of a fractional-linear (or radical) function and state its domain.","trap":"Reporting the domain of f instead of the range of f; forgetting to exclude a value that makes the denominator zero."},{"id":24,"s":"1.3","c":0,"a":"A","en":"$y(2\\sqrt x+1)=2-\\sqrt x\\Rightarrow\\sqrt x=\\frac{2-y}{2y+1}$, giving $f^{-1}(x)=\\frac{(x-2)^{2}}{(2x+1)^{2}}$ on $(-\\tfrac12,2]$.","zh":"解出 $\\sqrt x=\\frac{2-y}{2y+1}$，平方得反函数；要求 $\\frac{2-x}{2x+1}\\ge0$，得 $(-\\tfrac12,2]$。","focus":"Find the inverse of a fractional-linear (or radical) function and state its domain.","trap":"Reporting the domain of f instead of the range of f; forgetting to exclude a value that makes the denominator zero."},{"id":25,"s":"1.3","c":0,"a":"A","en":"$y(2\\sqrt x+3)=2-3\\sqrt x\\Rightarrow\\sqrt x=\\frac{2-3y}{2y+3}$, so $f^{-1}(x)=\\frac{(3x-2)^{2}}{(2x+3)^{2}}$ on $(-\\tfrac32,\\tfrac23]$.","zh":"解出 $\\sqrt x=\\frac{2-3y}{2y+3}$，平方得反函数；由 $\\sqrt x\\ge0$ 得 $(-\\tfrac32,\\tfrac23]$。","focus":"Find the inverse of a fractional-linear (or radical) function and state its domain.","trap":"Reporting the domain of f instead of the range of f; forgetting to exclude a value that makes the denominator zero."},{"id":26,"s":"1.4a","c":0,"a":"A","en":"Reduce the angle modulo $2\\pi$: $\\frac{34\\pi}{7}=4\\pi+\\frac{6\\pi}{7}$, and $\\cos$ has period $2\\pi$, so the value is $\\cos\\frac{6\\pi}{7}$. Since $\\frac{6\\pi}{7}\\in[0,\\pi]$, $\\arccos$ returns it unchanged.","zh":"先化角：$\\frac{34\\pi}{7}-4\\pi=\\frac{6\\pi}{7}$，余弦以 $2\\pi$ 为周期。$\\frac{6\\pi}{7}$ 落在 $\\arccos$ 的值域 $[0,\\pi]$ 内，直接取它。","focus":"Reduce an inverse trigonometric expression to its principal value.","trap":"Giving an angle outside the principal range; losing the negative sign in the third quadrant."},{"id":27,"s":"1.4a","c":0,"a":"A","en":"$\\frac{17\\pi}{7}-2\\pi=\\frac{3\\pi}{7}$, which already lies in $[0,\\pi]$, so $\\arccos\\bigl(\\cos\\frac{17\\pi}{7}\\bigr)=\\frac{3\\pi}{7}$.","zh":"减去一个 $2\\pi$ 得 $\\frac{3\\pi}{7}$，已在 $[0,\\pi]$ 内，故结果就是它。","focus":"Reduce an inverse trigonometric expression to its principal value.","trap":"Giving an angle outside the principal range; losing the negative sign in the third quadrant."},{"id":28,"s":"1.4a","c":0,"a":"C","en":"$\\cos$ is even, so $\\cos(-\\frac{\\pi}{5})=\\cos\\frac{\\pi}{5}$; $\\frac{\\pi}{5}\\in[0,\\pi]$ gives $\\frac{\\pi}{5}$ directly.","zh":"余弦是偶函数，$\\cos(-\\frac{\\pi}{5})=\\cos\\frac{\\pi}{5}$，且 $\\frac{\\pi}{5}$ 在 $[0,\\pi]$ 内，故答案为 $\\frac{\\pi}{5}$。","focus":"Reduce an inverse trigonometric expression to its principal value.","trap":"Giving an angle outside the principal range; losing the negative sign in the third quadrant."},{"id":29,"s":"1.4a","c":0,"a":"B","en":"$\\frac{9\\pi}{7}$ exceeds $\\pi$, so replace it by $2\\pi-\\frac{9\\pi}{7}=\\frac{5\\pi}{7}$ (same cosine), which is inside $[0,\\pi]$.","zh":"$\\frac{9\\pi}{7}&gt;\\pi$，超出值域。用 $\\cos(2\\pi-\\theta)=\\cos\\theta$ 换成 $\\frac{5\\pi}{7}$，落在 $[0,\\pi]$ 内。","focus":"Reduce an inverse trigonometric expression to its principal value.","trap":"Giving an angle outside the principal range; losing the negative sign in the third quadrant."},{"id":30,"s":"1.4a","c":0,"a":"E","en":"$\\frac{72\\pi}{7}-10\\pi=\\frac{2\\pi}{7}$, inside $[0,\\pi]$, so the principal value is $\\frac{2\\pi}{7}$.","zh":"减去 $10\\pi$（$2\\pi$ 的整数倍）得 $\\frac{2\\pi}{7}$，落在 $[0,\\pi]$ 内，即为主值。","focus":"Reduce an inverse trigonometric expression to its principal value.","trap":"Giving an angle outside the principal range; losing the negative sign in the third quadrant."},{"id":31,"s":"1.4a","c":0,"a":"C","en":"$\\frac{26\\pi}{5}-4\\pi=\\frac{6\\pi}{5}$, and $\\sin\\frac{6\\pi}{5}=-\\sin\\frac{\\pi}{5}$. As $-\\frac{\\pi}{5}\\in[-\\frac{\\pi}{2},\\frac{\\pi}{2}]$, the answer is $-\\frac{\\pi}{5}$.","zh":"$\\frac{26\\pi}{5}-4\\pi=\\frac{6\\pi}{5}$，而 $\\sin\\frac{6\\pi}{5}=-\\sin\\frac{\\pi}{5}$。$-\\frac{\\pi}{5}$ 在 $\\arcsin$ 的值域内，故为 $-\\frac{\\pi}{5}$。","focus":"Reduce an inverse trigonometric expression to its principal value.","trap":"Giving an angle outside the principal range; losing the negative sign in the third quadrant."},{"id":32,"s":"1.4a","c":0,"a":"D","en":"$-\\frac{59\\pi}{7}+8\\pi=-\\frac{3\\pi}{7}$, which is already inside $[-\\frac{\\pi}{2},\\frac{\\pi}{2}]$, so the principal value is $-\\frac{3\\pi}{7}$.","zh":"加 $8\\pi$ 得 $-\\frac{3\\pi}{7}$，已在 $[-\\frac{\\pi}{2},\\frac{\\pi}{2}]$ 内，直接取它。","focus":"Reduce an inverse trigonometric expression to its principal value.","trap":"Giving an angle outside the principal range; losing the negative sign in the third quadrant."},{"id":33,"s":"1.4a","c":0,"a":"E","en":"$\\frac{27\\pi}{7}-4\\pi=-\\frac{\\pi}{7}\\in[-\\frac{\\pi}{2},\\frac{\\pi}{2}]$, so the value is $-\\frac{\\pi}{7}$.","zh":"减 $4\\pi$ 得 $-\\frac{\\pi}{7}$，落在 $\\arcsin$ 的值域内，故答案为 $-\\frac{\\pi}{7}$。","focus":"Reduce an inverse trigonometric expression to its principal value.","trap":"Giving an angle outside the principal range; losing the negative sign in the third quadrant."},{"id":34,"s":"1.4a","c":0,"a":"E","en":"$\\frac{48\\pi}{7}-6\\pi=\\frac{6\\pi}{7}$; then $\\sin\\frac{6\\pi}{7}=\\sin\\frac{\\pi}{7}$ (supplementary angles), and $\\frac{\\pi}{7}$ is inside the range.","zh":"减去 $6\\pi$ 得 $\\frac{6\\pi}{7}$。用 $\\sin(\\pi-\\theta)=\\sin\\theta$ 化到 $\\frac{\\pi}{7}$，落在值域内。","focus":"Reduce an inverse trigonometric expression to its principal value.","trap":"Giving an angle outside the principal range; losing the negative sign in the third quadrant."},{"id":35,"s":"1.4a","c":0,"a":"E","en":"$-\\frac{47\\pi}{7}+6\\pi=-\\frac{5\\pi}{7}$; then $\\sin(-\\frac{5\\pi}{7})=-\\sin\\frac{2\\pi}{7}$, and $-\\frac{2\\pi}{7}$ lies in $[-\\frac{\\pi}{2},\\frac{\\pi}{2}]$.","zh":"加 $6\\pi$ 得 $-\\frac{5\\pi}{7}$，再用 $\\sin(\\pi-\\theta)=\\sin\\theta$ 化为 $-\\sin\\frac{2\\pi}{7}$，故主值为 $-\\frac{2\\pi}{7}$。","focus":"Reduce an inverse trigonometric expression to its principal value.","trap":"Giving an angle outside the principal range; losing the negative sign in the third quadrant."},{"id":36,"s":"1.4a","c":0,"a":"D","en":"$\\tan$ has period $\\pi$: $-\\frac{29\\pi}{7}+4\\pi=-\\frac{\\pi}{7}$, which is inside $(-\\frac{\\pi}{2},\\frac{\\pi}{2})$.","zh":"正切以 $\\pi$ 为周期，加 $4\\pi$ 得 $-\\frac{\\pi}{7}$，落在 $(-\\frac{\\pi}{2},\\frac{\\pi}{2})$ 内。","focus":"Reduce an inverse trigonometric expression to its principal value.","trap":"Giving an angle outside the principal range; losing the negative sign in the third quadrant."},{"id":37,"s":"1.4a","c":0,"a":"D","en":"$\\frac{66\\pi}{7}-8\\pi=\\frac{10\\pi}{7}$; subtracting one more $\\pi$ gives $\\frac{3\\pi}{7}$, inside $(-\\frac{\\pi}{2},\\frac{\\pi}{2})$.","zh":"减 $8\\pi$ 得 $\\frac{10\\pi}{7}$，再减 $\\pi$ 得 $\\frac{3\\pi}{7}$。正切周期为 $\\pi$，可以反复加减。","focus":"Reduce an inverse trigonometric expression to its principal value.","trap":"Giving an angle outside the principal range; losing the negative sign in the third quadrant."},{"id":38,"s":"1.4a","c":0,"a":"E","en":"$-\\frac{2\\pi}{7}$ already lies in $(-\\frac{\\pi}{2},\\frac{\\pi}{2})$, so $\\tan^{-1}\\bigl(\\tan(-\\frac{2\\pi}{7})\\bigr)=-\\frac{2\\pi}{7}$.","zh":"$-\\frac{2\\pi}{7}$ 已在 $(-\\frac{\\pi}{2},\\frac{\\pi}{2})$ 内，无需化角，直接取原值。","focus":"Reduce an inverse trigonometric expression to its principal value.","trap":"Giving an angle outside the principal range; losing the negative sign in the third quadrant."},{"id":39,"s":"1.4a","c":0,"a":"B","en":"$-\\frac{7\\pi}{5}+\\pi=-\\frac{2\\pi}{5}$, which is inside $(-\\frac{\\pi}{2},\\frac{\\pi}{2})$, so the value is $-\\frac{2\\pi}{5}$.","zh":"加一个 $\\pi$ 得 $-\\frac{2\\pi}{5}$，落在值域内，故为 $-\\frac{2\\pi}{5}$。","focus":"Reduce an inverse trigonometric expression to its principal value.","trap":"Giving an angle outside the principal range; losing the negative sign in the third quadrant."},{"id":40,"s":"1.4a","c":0,"a":"C","en":"$\\frac{20\\pi}{7}-2\\pi=\\frac{6\\pi}{7}$, which exceeds $\\frac{\\pi}{2}$; subtracting $\\pi$ gives $-\\frac{\\pi}{7}$, inside the range.","zh":"减 $2\\pi$ 得 $\\frac{6\\pi}{7}&gt;\\frac{\\pi}{2}$，再减 $\\pi$ 得 $-\\frac{\\pi}{7}$，落在 $(-\\frac{\\pi}{2},\\frac{\\pi}{2})$ 内。","focus":"Reduce an inverse trigonometric expression to its principal value.","trap":"Giving an angle outside the principal range; losing the negative sign in the third quadrant."},{"id":41,"s":"1.4b","c":0,"a":"A","en":"$\\sin(-\\frac{23\\pi}{5})=-\\sin\\frac{3\\pi}{5}$, and $\\sin\\frac{3\\pi}{5}=\\cos\\frac{\\pi}{10}$. So the expression is $\\arccos(-\\cos\\frac{\\pi}{10})=\\pi-\\frac{\\pi}{10}=\\frac{9\\pi}{10}$.","zh":"先化角：$\\sin(-\\frac{23\\pi}{5})=-\\sin\\frac{3\\pi}{5}$。再用 $\\sin\\theta=\\cos(\\frac{\\pi}{2}-\\theta)$ 转成余弦，最后用 $\\arccos(-u)=\\pi-\\arccos u$ 得 $\\frac{9\\pi}{10}$。","focus":"Convert between arcsin, arccos and arctan using complementary or supplementary identities.","trap":"Ignoring the sign; applying the identity outside its valid range."},{"id":42,"s":"1.4b","c":0,"a":"E","en":"$\\cos(-\\frac{8\\pi}{7})=\\cos\\frac{8\\pi}{7}=\\cos\\frac{6\\pi}{7}=-\\cos\\frac{\\pi}{7}$. Hence $\\arcsin(-\\cos\\frac{\\pi}{7})=-\\arcsin(\\cos\\frac{\\pi}{7})=-\\bigl(\\frac{\\pi}{2}-\\frac{\\pi}{7}\\bigr)=-\\frac{5\\pi}{14}$.","zh":"$\\cos\\frac{8\\pi}{7}=\\cos\\frac{6\\pi}{7}=-\\cos\\frac{\\pi}{7}$。用 $\\arcsin(\\cos\\theta)=\\frac{\\pi}{2}-\\theta$ 与奇函数性质，得 $-\\frac{5\\pi}{14}$。","focus":"Convert between arcsin, arccos and arctan using complementary or supplementary identities.","trap":"Ignoring the sign; applying the identity outside its valid range."},{"id":43,"s":"1.4b","c":0,"a":"D","en":"$\\cos(-\\frac{5\\pi}{7})=\\cos\\frac{5\\pi}{7}=-\\cos\\frac{2\\pi}{7}$, so the value is $-\\arcsin(\\cos\\frac{2\\pi}{7})=-\\bigl(\\frac{\\pi}{2}-\\frac{2\\pi}{7}\\bigr)=-\\frac{3\\pi}{14}$.","zh":"$\\cos\\frac{5\\pi}{7}=-\\cos\\frac{2\\pi}{7}$，再用 $\\arcsin(\\cos\\theta)=\\frac{\\pi}{2}-\\theta$，得 $-\\frac{3\\pi}{14}$。","focus":"Convert between arcsin, arccos and arctan using complementary or supplementary identities.","trap":"Ignoring the sign; applying the identity outside its valid range."},{"id":44,"s":"1.4b","c":0,"a":"A","en":"$\\frac{30\\pi}{7}-4\\pi=\\frac{2\\pi}{7}$, so $\\cos\\frac{30\\pi}{7}=\\cos\\frac{2\\pi}{7}$ and $\\arcsin(\\cos\\frac{2\\pi}{7})=\\frac{\\pi}{2}-\\frac{2\\pi}{7}=\\frac{3\\pi}{14}$.","zh":"减 $4\\pi$ 得 $\\frac{2\\pi}{7}$。用 $\\arcsin(\\cos\\theta)=\\frac{\\pi}{2}-\\theta$（$\\theta\\in[0,\\frac{\\pi}{2}]$）得 $\\frac{3\\pi}{14}$。","focus":"Convert between arcsin, arccos and arctan using complementary or supplementary identities.","trap":"Ignoring the sign; applying the identity outside its valid range."},{"id":45,"s":"1.4b","c":0,"a":"E","en":"$\\frac{24\\pi}{7}-2\\pi=\\frac{10\\pi}{7}$ and $\\cos\\frac{10\\pi}{7}=\\cos\\frac{4\\pi}{7}=-\\cos\\frac{3\\pi}{7}$, so the value is $-\\arcsin(\\cos\\frac{3\\pi}{7})=-\\bigl(\\frac{\\pi}{2}-\\frac{3\\pi}{7}\\bigr)=-\\frac{\\pi}{14}$.","zh":"$\\frac{24\\pi}{7}-2\\pi=\\frac{10\\pi}{7}$，且 $\\cos\\frac{10\\pi}{7}=\\cos\\frac{4\\pi}{7}=-\\cos\\frac{3\\pi}{7}$。再用余角关系得 $-\\frac{\\pi}{14}$。","focus":"Convert between arcsin, arccos and arctan using complementary or supplementary identities.","trap":"Ignoring the sign; applying the identity outside its valid range."},{"id":46,"s":"1.4c","c":0,"a":"A","en":"Let $\\theta=\\arccos\\frac{2}{7}$; then $\\cos\\theta=\\frac27$ with $\\theta\\in(0,\\frac{\\pi}{2})$ and $\\sin\\theta=\\sqrt{1-\\frac{4}{49}}=\\frac{\\sqrt{45}}{7}=\\frac{3\\sqrt5}{7}$. This value is not listed, so none of the four options is correct.","zh":"设 $\\theta=\\arccos\\frac27$，则 $\\cos\\theta=\\frac27$，$\\sin\\theta=\\sqrt{1-\\frac{4}{49}}=\\frac{3\\sqrt5}{7}$。四个选项里没有这个值，故选\\\"以上都不对\\\"。","focus":"Evaluate a nested expression such as sin(arctan a) or cos(2 arcsin b) exactly.","trap":"Treating arctan a as the ratio a; sign errors when the triangle is in a negative branch."},{"id":47,"s":"1.4c","c":0,"a":"E","en":"With $\\cos\\theta=-\\frac29$ and $\\theta\\in(\\frac{\\pi}{2},\\pi)$, $\\sin\\theta=+\\sqrt{1-\\frac{4}{81}}=\\frac{\\sqrt{77}}{9}$.","zh":"$\\cos\\theta=-\\frac29$ 且 $\\theta$ 在第二象限，正弦取正：$\\sqrt{1-\\frac{4}{81}}=\\frac{\\sqrt{77}}{9}$。","focus":"Evaluate a nested expression such as sin(arctan a) or cos(2 arcsin b) exactly.","trap":"Treating arctan a as the ratio a; sign errors when the triangle is in a negative branch."},{"id":48,"s":"1.4c","c":0,"a":"A","en":"Draw the right triangle for $\\sin\\theta=\\frac17$: opposite $1$, hypotenuse $7$, adjacent $\\sqrt{49-1}=4\\sqrt3$. Then $\\cos\\theta=\\frac{4\\sqrt3}{7}$ and $\\sec\\theta=\\frac{7}{4\\sqrt3}=\\frac{7\\sqrt3}{12}$.","zh":"由 $\\sin\\theta=\\frac17$ 画直角三角形：对边 $1$、斜边 $7$、邻边 $\\sqrt{49-1}=4\\sqrt3$。故 $\\cos\\theta=\\frac{4\\sqrt3}{7}$，$\\sec\\theta=\\frac{7}{4\\sqrt3}=\\frac{7\\sqrt3}{12}$（分母有理化）。","focus":"Evaluate a nested expression such as sin(arctan a) or cos(2 arcsin b) exactly.","trap":"Treating arctan a as the ratio a; sign errors when the triangle is in a negative branch."},{"id":49,"s":"1.4c","c":0,"a":"D","en":"$\\tan\\theta=-4$: take opposite $-4$, adjacent $1$, hypotenuse $\\sqrt{17}$, so $\\sec\\theta=\\sqrt{17}$.","zh":"$\\tan\\theta=-4$ 画三角形：邻边 $1$、对边 $-4$、斜边 $\\sqrt{17}$，故 $\\sec\\theta=\\sqrt{17}$。正割为正，因为 $\\cos&gt;0$。","focus":"Evaluate a nested expression such as sin(arctan a) or cos(2 arcsin b) exactly.","trap":"Treating arctan a as the ratio a; sign errors when the triangle is in a negative branch."},{"id":50,"s":"1.4c","c":0,"a":"B","en":"$\\tan\\theta=-\\frac14$ gives hypotenuse $\\sqrt{1+\\frac{1}{16}}=\\frac{\\sqrt{17}}{4}$, and $\\sec\\theta=\\frac{\\sqrt{17}}{4}$.","zh":"$\\tan\\theta=-\\frac14$，斜边为 $\\sqrt{1+\\frac1{16}}=\\frac{\\sqrt{17}}{4}$，故 $\\sec\\theta=\\frac{\\sqrt{17}}{4}$。","focus":"Evaluate a nested expression such as sin(arctan a) or cos(2 arcsin b) exactly.","trap":"Treating arctan a as the ratio a; sign errors when the triangle is in a negative branch."},{"id":51,"s":"2.1","c":1,"a":"D","en":"The value $f(-3)=15$ is a decoy: a limit only looks at points near $-3$, where $f(x)=-3x-3$. Hence $\\lim_{x\\to-3}f(x)=-3(-3)-3=6$.","zh":"$f(-3)=15$ 是干扰项：极限只看 $x$ 靠近 $-3$ 时的函数值，那里用分支 $-3x-3$，代入得 $6$。函数在该点的取值不影响极限。","focus":"The limit at a point depends only on values near the point, never on the value at the point.","trap":"Plugging in the branch that applies at x = a instead of near a."},{"id":52,"s":"2.1","c":1,"a":"B","en":"Near $x=-1$ the function is $6-x$, so the limit is $6-(-1)=7$; the special value $-8$ at the point is irrelevant.","zh":"$x$ 靠近 $-1$ 时用分支 $6-x$，极限为 $7$。题目给出的 $f(-1)=-8$ 与极限无关。","focus":"The limit at a point depends only on values near the point, never on the value at the point.","trap":"Plugging in the branch that applies at x = a instead of near a."},{"id":53,"s":"2.1","c":1,"a":"A","en":"Use the branch that governs $x\\to1$: $3(1)+1=4$. The separate value $-3$ at $x=1$ does not enter the limit.","zh":"取 $x\\to1$ 对应的分支 $3x+1$，代入得 $4$。$x=1$ 处另行定义的 $-3$ 不参与极限。","focus":"The limit at a point depends only on values near the point, never on the value at the point.","trap":"Plugging in the branch that applies at x = a instead of near a."},{"id":54,"s":"2.1","c":1,"a":"D","en":"$\\lim_{x\\to-2}(5-2x)=5+4=9$.","zh":"$x\\to-2$ 时用 $5-2x$，代入得 $9$。","focus":"The limit at a point depends only on values near the point, never on the value at the point.","trap":"Plugging in the branch that applies at x = a instead of near a."},{"id":55,"s":"2.1","c":1,"a":"B","en":"$\\lim_{x\\to3}(-4x-1)=-12-1=-13$.","zh":"代入分支 $-4x-1$ 得 $-13$。","focus":"The limit at a point depends only on values near the point, never on the value at the point.","trap":"Plugging in the branch that applies at x = a instead of near a."},{"id":56,"s":"2.2","c":1,"a":"C","en":"Left branch at $x=-4$: $-2(-4)-7=1$. Right branch: $-2(16)+16+17=1$. Both one-sided limits agree, so the limit is $1$.","zh":"左支在 $x=-4$ 得 $1$，右支也得 $1$。左右极限相等，故双侧极限为 $1$。两侧都算一遍是这类题的固定动作。","focus":"Compute both one-sided limits; the two-sided limit exists only if they agree.","trap":"Declaring DNE without checking both sides; using the wrong branch for each side."},{"id":57,"s":"2.2","c":1,"a":"C","en":"Left: $x-7=-10$; right: $-x^{2}+5x+14=-9-15+14=-10$. They agree, so the limit is $-10$.","zh":"左支 $x-7$ 得 $-10$，右支 $-x^2+5x+14$ 也得 $-10$，故极限为 $-10$。","focus":"Compute both one-sided limits; the two-sided limit exists only if they agree.","trap":"Declaring DNE without checking both sides; using the wrong branch for each side."},{"id":58,"s":"2.2","c":1,"a":"A","en":"Left: $10-1=9$; right: $3-2+8=9$. Equal, so the limit is $9$.","zh":"左支得 $9$，右支 $3x^2-2x+8$ 也得 $9$，故极限为 $9$。","focus":"Compute both one-sided limits; the two-sided limit exists only if they agree.","trap":"Declaring DNE without checking both sides; using the wrong branch for each side."},{"id":59,"s":"2.2","c":1,"a":"D","en":"Left: $-2(3)-5=-11$; right: $2(9)-3-26=-11$. Equal, so the limit is $-11$.","zh":"左支得 $-11$，右支 $2x^2-x-26$ 同为 $-11$，故极限为 $-11$。","focus":"Compute both one-sided limits; the two-sided limit exists only if they agree.","trap":"Declaring DNE without checking both sides; using the wrong branch for each side."},{"id":60,"s":"2.2","c":1,"a":"A","en":"Left: $19-9=10$; right: $2(9)+9-17=10$. Equal, so the limit is $10$.","zh":"左支 $19-3x$ 得 $10$，右支 $2x^2+3x-17$ 也得 $10$，故极限为 $10$。","focus":"Compute both one-sided limits; the two-sided limit exists only if they agree.","trap":"Declaring DNE without checking both sides; using the wrong branch for each side."},{"id":61,"s":"2.3","c":1,"a":"D","en":"Factor the denominator: $2x^{2}+17x+36=(2x+9)(x+4)$. Then $\\frac{3|x+4|}{(2x+9)(x+4)}=\\pm\\frac{3}{2x+9}$, where the sign depends on whether $x&gt;-4$ or $x&lt;-4$. At $x=-4$ the factor $2x+9=1$, so the one-sided limits are $+3$ and $-3$: they differ, hence DNE.","zh":"分母分解为 $(2x+9)(x+4)$，约去 $x+4$ 后剩下 $\\pm\\frac{3}{2x+9}$，正负由 $x&gt;-4$ 还是 $x&lt;-4$ 决定。左右极限分别为 $+3$ 与 $-3$，不相等，故极限不存在。","focus":"Remove the absolute value by splitting according to the sign of the inner expression.","trap":"Dropping the absolute value without considering the sign; forgetting the sign flip on the left."},{"id":62,"s":"2.3","c":1,"a":"C","en":"Here $x\\to2^{+}$ so $|x-2|=x-2$. The denominator is $2(x-2)(x+1)$, giving $\\frac{5}{2(x+1)}\\to\\frac56$.","zh":"因为 $x\\to2^{+}$，故 $|x-2|=x-2$。分母分解为 $2(x-2)(x+1)$，约分后得 $\\frac{5}{2(x+1)}\\to\\frac56$。单侧极限要保留符号。","focus":"Remove the absolute value by splitting according to the sign of the inner expression.","trap":"Dropping the absolute value without considering the sign; forgetting the sign flip on the left."},{"id":63,"s":"2.3","c":1,"a":"E","en":"For $x&lt;3$, $|x-3|=3-x$ and $4x^{2}-29x+51=(x-3)(4x-17)$, so the ratio becomes $-\\frac{4}{4x-17}\\to-\\frac{4}{-5}=\\frac45$. That value is not listed, so none of the four choices is correct.","zh":"$x&lt;3$ 时 $|x-3|=3-x$，分母分解为 $(x-3)(4x-17)$，约分后为 $-\\frac{4}{4x-17}\\to\\frac45$。选项中无此值，故选\\\"以上都不对\\\"。","focus":"Remove the absolute value by splitting according to the sign of the inner expression.","trap":"Dropping the absolute value without considering the sign; forgetting the sign flip on the left."},{"id":64,"s":"2.3","c":1,"a":"B","en":"With $|x+1|$ and denominator $(5-x)(x+1)$, the reduced ratio is $\\pm\\frac{2}{5-x}$; at $x=-1$ that is $\\pm\\frac{1}{3}$, so the two sides disagree and the limit does not exist. DNE is not offered, hence “none of these”.","zh":"约去 $x+1$ 后剩 $\\pm\\frac{2}{5-x}$，在 $x=-1$ 处为 $\\pm\\frac13$，左右不等，极限不存在。选项未给 DNE，故选\\\"以上都不对\\\"。","focus":"Remove the absolute value by splitting according to the sign of the inner expression.","trap":"Dropping the absolute value without considering the sign; forgetting the sign flip on the left."},{"id":65,"s":"2.3","c":1,"a":"D","en":"Denominator $-x^{2}-8x-15=-(x+3)(x+5)$. After cancelling, $\\pm\\frac{3}{-(x+5)}\\to\\pm\\frac32$; the two sides differ, so the limit does not exist — not among the choices.","zh":"分母 $-(x+3)(x+5)$ 约去 $x+3$ 后得 $\\pm\\frac{3}{-(x+5)}\\to\\pm\\frac32$，左右不等，极限不存在，故为\\\"以上都不对\\\"。","focus":"Remove the absolute value by splitting according to the sign of the inner expression.","trap":"Dropping the absolute value without considering the sign; forgetting the sign flip on the left."},{"id":66,"s":"2.4","c":1,"a":"B","en":"As $x\\to0$, $3-\\frac3x$ sweeps through all reals, so $\\sin(3-\\frac3x)$ keeps oscillating between $-1$ and $1$; no single value is approached, hence DNE.","zh":"$x\\to0$ 时 $3-\\frac3x$ 趋于无穷并扫过所有实数，$\\sin$ 在 $-1$ 与 $1$ 之间无限振荡，没有确定的极限，故不存在。","focus":"Oscillating factors such as sin(1/x) prevent a limit from existing at the point.","trap":"Assuming the limit is 0 just because the function is bounded."},{"id":67,"s":"2.4","c":1,"a":"B","en":"The term $5\\sin(2-\\frac2x)$ oscillates with amplitude $5$, so the whole expression never settles; DNE.","zh":"$5\\sin(2-\\frac2x)$ 以振幅 $5$ 振荡，整体不趋于任何数，故极限不存在。振幅大小不影响振荡结论。","focus":"Oscillating factors such as sin(1/x) prevent a limit from existing at the point.","trap":"Assuming the limit is 0 just because the function is bounded."},{"id":68,"s":"2.4","c":1,"a":"B","en":"$-5\\sin(1-\\frac6x)-2$ oscillates between $-7$ and $3$, so the limit does not exist; “none of these” is the only correct label.","zh":"$-5\\sin(1-\\frac6x)-2$ 在 $-7$ 与 $3$ 之间振荡，极限不存在。选项未列 DNE，故选\\\"以上都不对\\\"。","focus":"Oscillating factors such as sin(1/x) prevent a limit from existing at the point.","trap":"Assuming the limit is 0 just because the function is bounded."},{"id":69,"s":"2.4","c":1,"a":"C","en":"$\\sin(3+\\frac4x)$ oscillates as $x\\to0$, so $-\\sin(3+\\frac4x)-3$ has no limit.","zh":"$\\sin(3+\\frac4x)$ 在 $x\\to0$ 时振荡，故整体极限不存在。","focus":"Oscillating factors such as sin(1/x) prevent a limit from existing at the point.","trap":"Assuming the limit is 0 just because the function is bounded."},{"id":70,"s":"2.4","c":1,"a":"B","en":"The oscillation of $\\sin(2-\\frac5x)$ survives the affine shift, so the limit is DNE.","zh":"$\\sin(2-\\frac5x)$ 的振荡不会被常数项与系数抹平，极限不存在。","focus":"Oscillating factors such as sin(1/x) prevent a limit from existing at the point.","trap":"Assuming the limit is 0 just because the function is bounded."},{"id":71,"s":"2.5","c":1,"a":"D","en":"The numerator factors as $-(3x-4)(x+5)$, so after cancelling $x+5$ the limit is $-(3x-4)\\to19$. Not listed, so “none of these”.","zh":"分子分解为 $-(3x-4)(x+5)$，约去 $x+5$ 后极限为 $-(3x-4)\\to19$。选项中没有 $19$，故选\\\"以上都不对\\\"。","focus":"0/0 indeterminate form: factor and cancel the common factor.","trap":"Cancelling terms that are not factors; forgetting to re-substitute after cancelling."},{"id":72,"s":"2.5","c":1,"a":"B","en":"Numerator $-(3x-4)(x+5)$, denominator $-(x+5)(x+6)$; after cancelling, $\\frac{3x-4}{x+6}\\to\\frac{-19}{1}=-19$, which is not among the choices.","zh":"分子 $-(3x-4)(x+5)$、分母 $-(x+5)(x+6)$，约分后为 $\\frac{3x-4}{x+6}\\to-19$，选项中不存在，故为\\\"以上都不对\\\"。","focus":"0/0 indeterminate form: factor and cancel the common factor.","trap":"Cancelling terms that are not factors; forgetting to re-substitute after cancelling."},{"id":73,"s":"2.5","c":1,"a":"B","en":"$5x^{2}+20x-25=5(x+5)(x-1)$, so the limit is $5(x-1)\\to5(-6)=-30$.","zh":"分子提出 $5$ 后为 $5(x+5)(x-1)$，约去 $x+5$ 得 $5(x-1)\\to-30$。","focus":"0/0 indeterminate form: factor and cancel the common factor.","trap":"Cancelling terms that are not factors; forgetting to re-substitute after cancelling."},{"id":74,"s":"2.5","c":1,"a":"C","en":"Numerator $(3x+2)(x+4)$, denominator $-(x+3)(x+4)$; the limit is $\\frac{3x+2}{-(x+3)}\\to\\frac{-10}{1}=-10$.","zh":"分子 $(3x+2)(x+4)$、分母 $-(x+3)(x+4)$，约分后代入 $x=-4$ 得 $-10$。","focus":"0/0 indeterminate form: factor and cancel the common factor.","trap":"Cancelling terms that are not factors; forgetting to re-substitute after cancelling."},{"id":75,"s":"2.5","c":1,"a":"B","en":"$x^{2}+3x+2=(x+1)(x+2)$, so the limit is $x+1\\to-1$.","zh":"分子为 $(x+1)(x+2)$，约去 $x+2$ 后得 $x+1\\to-1$。","focus":"0/0 indeterminate form: factor and cancel the common factor.","trap":"Cancelling terms that are not factors; forgetting to re-substitute after cancelling."},{"id":76,"s":"2.5","c":1,"a":"B","en":"$4x^{2}-26x+30=2(2x-3)(x-5)$ and $-x^{2}+13x-40=-(x-5)(x-8)$, so the limit is $\\frac{2(2x-3)}{-(x-8)}\\to\\frac{14}{3}$.","zh":"分子 $2(2x-3)(x-5)$、分母 $-(x-5)(x-8)$，约分后代入 $x=5$ 得 $\\frac{14}{3}$。","focus":"0/0 indeterminate form: factor and cancel the common factor.","trap":"Cancelling terms that are not factors; forgetting to re-substitute after cancelling."},{"id":77,"s":"2.5","c":1,"a":"D","en":"$2x^{2}+4x-16=2(x+4)(x-2)$, so the limit is $2(x-2)\\to-12$.","zh":"分子提出 $2$ 得 $2(x+4)(x-2)$，约去 $x+4$ 后为 $2(x-2)\\to-12$。","focus":"0/0 indeterminate form: factor and cancel the common factor.","trap":"Cancelling terms that are not factors; forgetting to re-substitute after cancelling."},{"id":78,"s":"2.5","c":1,"a":"E","en":"$-4x^{2}+x+5=-(4x-5)(x+1)$, so the limit is $-(4x-5)\\to9$.","zh":"分子为 $-(4x-5)(x+1)$，约去 $x+1$ 后得 $-(4x-5)\\to9$。","focus":"0/0 indeterminate form: factor and cancel the common factor.","trap":"Cancelling terms that are not factors; forgetting to re-substitute after cancelling."},{"id":79,"s":"2.5","c":1,"a":"E","en":"Numerator $(2x-3)(x-4)$, denominator $-(2x+3)(x-4)$; the limit is $\\frac{2x-3}{-(2x+3)}\\to-\\frac{5}{11}$.","zh":"分子 $(2x-3)(x-4)$、分母 $-(2x+3)(x-4)$，约分后得 $-\\frac{5}{11}$。","focus":"0/0 indeterminate form: factor and cancel the common factor.","trap":"Cancelling terms that are not factors; forgetting to re-substitute after cancelling."},{"id":80,"s":"2.5","c":1,"a":"C","en":"$x^{3}-8=(x-2)(x^{2}+2x+4)$ and $x^{2}-x-2=(x-2)(x+1)$, so the limit is $\\frac{x^{2}+2x+4}{x+1}\\to\\frac{12}{3}=4$.","zh":"立方差 $x^3-8=(x-2)(x^2+2x+4)$，分母 $(x-2)(x+1)$；约分后代入 $x=2$ 得 $4$。","focus":"0/0 indeterminate form: factor and cancel the common factor.","trap":"Cancelling terms that are not factors; forgetting to re-substitute after cancelling."},{"id":81,"s":"2.6","c":1,"a":"A","en":"Substitution is legal here because the denominator is not zero: $\\frac{\\sqrt{10-6}}{6-14}=\\frac{2}{-8}=-\\frac14$. Not listed, hence “none of these”.","zh":"分母非零，可直接代入：分子 $\\sqrt{4}=2$，分母 $6-14=-8$，得 $-\\frac14$。选项中无此值，故选\\\"以上都不对\\\"。","focus":"For a continuous function the limit equals the function value — just substitute.","trap":"Over-complicating a limit that is simply a substitution; decimal approximations."},{"id":82,"s":"2.6","c":1,"a":"D","en":"Direct substitution: $\\frac{\\sqrt{10-3}}{-4}=\\frac{\\sqrt7}{-4}=-\\frac{\\sqrt7}{4}$. Keep the minus sign from the denominator.","zh":"直接代入得 $\\frac{\\sqrt{10-3}}{-4}=-\\frac{\\sqrt7}{4}$。分母的负号不能丢，这是本题唯一的陷阱。","focus":"For a continuous function the limit equals the function value — just substitute.","trap":"Over-complicating a limit that is simply a substitution; decimal approximations."},{"id":83,"s":"2.6","c":1,"a":"B","en":"$\\sqrt{-3(16)+4(-4)+68}=\\sqrt4=2$ and $4(-4)+9=-7$, so the limit is $-\\frac27$ — not among the options.","zh":"分子为 $\\sqrt{4}=2$，分母 $4(-4)+9=-7$，极限为 $-\\frac27$，选项中没有，故选\\\"以上都不对\\\"。","focus":"For a continuous function the limit equals the function value — just substitute.","trap":"Over-complicating a limit that is simply a substitution; decimal approximations."},{"id":84,"s":"2.6","c":1,"a":"C","en":"The denominator is non-zero at $x=1$, so substitute: $\\frac{\\sqrt{7-1}}{2-1}=\\sqrt6$.","zh":"$x=1$ 处分母不为零，直接代入得 $\\sqrt6$。不要把\\\"根号\\\"误当成需要有理化的信号。","focus":"For a continuous function the limit equals the function value — just substitute.","trap":"Over-complicating a limit that is simply a substitution; decimal approximations."},{"id":85,"s":"2.6","c":1,"a":"A","en":"At $x=-3$: numerator $\\sqrt{6-4}=\\sqrt2$, denominator $-6+11=5$, so the limit is $\\frac{\\sqrt2}{5}$.","zh":"$x=-3$ 时分子 $\\sqrt{2}$、分母 $5$，故极限为 $\\frac{\\sqrt2}{5}$。","focus":"For a continuous function the limit equals the function value — just substitute.","trap":"Over-complicating a limit that is simply a substitution; decimal approximations."},{"id":86,"s":"2.7","c":1,"a":"B","en":"Use the limit laws: $2(-3)^{3}\\cdot\\frac{\\sqrt{36}}{8}=2(-27)\\cdot\\frac{6}{8}=-\\frac{81}{2}$.","zh":"用极限的四则运算直接组装：$2\\cdot(-27)\\cdot\\frac{6}{8}=-\\frac{81}{2}$。根号与三次方都可以分开算。","focus":"Combine known limits using the algebra of limits.","trap":"Splitting a limit whose parts do not exist; dividing by a limit equal to zero."},{"id":87,"s":"2.7","c":1,"a":"E","en":"$3(-3)^{3}\\cdot\\frac{\\sqrt{25}}{-10}=\\frac{3(-27)(5)}{-10}=\\frac{81}{2}$.","zh":"$3\\cdot(-27)\\cdot\\frac{5}{-10}=\\frac{81}{2}$。注意分母为负，最终结果为正。","focus":"Combine known limits using the algebra of limits.","trap":"Splitting a limit whose parts do not exist; dividing by a limit equal to zero."},{"id":88,"s":"2.7","c":1,"a":"B","en":"$4(3)^{3}\\cdot\\frac{6}{7}=\\frac{648}{7}$.","zh":"$4\\cdot27\\cdot\\frac67=\\frac{648}{7}$。先算 $[f]^{3}$，再乘根号，最后除以 $h$。","focus":"Combine known limits using the algebra of limits.","trap":"Splitting a limit whose parts do not exist; dividing by a limit equal to zero."},{"id":89,"s":"2.7","c":1,"a":"B","en":"$-(-4)^{3}\\cdot\\frac{\\sqrt4}{4}=\\frac{64\\cdot2}{4}=32$.","zh":"$-(-4)^3=64$，再乘 $\\frac{2}{4}$，得 $32$。负号与立方相互作用，别漏。","focus":"Combine known limits using the algebra of limits.","trap":"Splitting a limit whose parts do not exist; dividing by a limit equal to zero."},{"id":90,"s":"2.7","c":1,"a":"A","en":"$-2(-2)^{2}\\cdot\\frac{3}{6}=-2\\cdot4\\cdot\\frac12=-4$.","zh":"$-2\\cdot4\\cdot\\frac{3}{6}=-4$。平方后符号为正，再乘前面的负号。","focus":"Combine known limits using the algebra of limits.","trap":"Splitting a limit whose parts do not exist; dividing by a limit equal to zero."},{"id":91,"s":"2.8","c":1,"a":"D","en":"Multiply by the conjugate: $\\frac{(4x-18)-(27-5x)}{(x-5)(\\sqrt{4x-18}+\\sqrt{27-5x})}=\\frac{9(x-5)}{(x-5)\\cdot2\\sqrt2}=\\frac{9}{2\\sqrt2}=\\frac{9\\sqrt2}{4}$. Not listed, so “none of these”.","zh":"乘共轭：分子化为 $(4x-18)-(27-5x)=9(x-5)$，分母为 $(x-5)\\cdot2\\sqrt2$，约分得 $\\frac{9}{2\\sqrt2}=\\frac{9\\sqrt2}{4}$。选项中无此值。","focus":"0/0 with a square root: multiply by the conjugate to rationalise.","trap":"Forgetting to multiply the denominator as well; sign errors in the conjugate."},{"id":92,"s":"2.8","c":1,"a":"D","en":"Conjugate gives numerator $(-5x-5)-(5x+15)=-10(x+2)$ over $(x+2)\\cdot2\\sqrt5$, so the limit is $-\\frac{10}{2\\sqrt5}=-\\sqrt5$ — not among the choices.","zh":"乘共轭后分子为 $-10(x+2)$，分母 $(x+2)\\cdot2\\sqrt5$，极限 $-\\sqrt5$，选项中不存在。","focus":"0/0 with a square root: multiply by the conjugate to rationalise.","trap":"Forgetting to multiply the denominator as well; sign errors in the conjugate."},{"id":93,"s":"2.8","c":1,"a":"D","en":"Conjugate: numerator $(2x+20)-(10-3x)=5(x+2)$ over $(x+2)\\cdot8$, giving $\\frac58$ — not listed.","zh":"乘共轭后分子 $5(x+2)$、分母 $(x+2)\\cdot8$，得 $\\frac58$，选项中没有。","focus":"0/0 with a square root: multiply by the conjugate to rationalise.","trap":"Forgetting to multiply the denominator as well; sign errors in the conjugate."},{"id":94,"s":"2.8","c":1,"a":"E","en":"Conjugate: $(4x-7)-(3-x)=5(x-2)$ over $(x-2)(1+1)$, so the limit is $\\frac52$.","zh":"乘共轭：分子 $(4x-7)-(3-x)=5(x-2)$，分母 $(x-2)(\\sqrt1+\\sqrt1)=2(x-2)$，得 $\\frac52$。","focus":"0/0 with a square root: multiply by the conjugate to rationalise.","trap":"Forgetting to multiply the denominator as well; sign errors in the conjugate."},{"id":95,"s":"2.8","c":1,"a":"E","en":"Conjugate: numerator $(2x+22)-(4x+28)=-2(x+3)$ over $(x+3)(4+4)$, so the limit is $-\\frac{2}{8}=-\\frac14$ — not among the options.","zh":"乘共轭后分子 $-2(x+3)$、分母 $8(x+3)$，得 $-\\frac14$，选项中没有，故选\\\"以上都不对\\\"。","focus":"0/0 with a square root: multiply by the conjugate to rationalise.","trap":"Forgetting to multiply the denominator as well; sign errors in the conjugate."},{"id":96,"s":"2.9","c":1,"a":"A","en":"As $x\\to4^{+}$, $x-4\\to0^{+}$, so $\\frac{1}{x-4}\\to+\\infty$ and the negative makes it $-\\infty$.","zh":"$x\\to4^{+}$ 时 $x-4\\to0^{+}$，故 $\\frac{1}{x-4}\\to+\\infty$，前面带负号即 $-\\infty$。判断符号是这类题的全部内容。","focus":"A one-sided infinite limit: the denominator → 0⁺ or 0⁻ decides +∞ or −∞.","trap":"Mixing the two sides; treating ∞ as a number."},{"id":97,"s":"2.10","c":1,"a":"E","en":"Every factor is continuous and the denominator is non-zero at $0$: $\\frac{4}{1\\cdot\\cos\\frac{\\pi}{3}}=\\frac{4}{1/2}=8$.","zh":"各因子在 $0$ 处连续且分母非零，直接代入：$\\frac{4}{1\\cdot\\frac12}=8$。三角函数极限不都要凑 $\\frac{\\sin u}{u}$。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":98,"s":"2.10","c":1,"a":"B","en":"Substitute $x=0$: $\\frac{4}{1\\cdot\\cos\\frac{\\pi}{3}}=8$.","zh":"直接代入 $x=0$ 得 $\\frac{4}{1\\cdot\\frac12}=8$。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":99,"s":"2.10","c":1,"a":"A","en":"The factors $\\cos(2x+\\frac{\\pi}{4})$ cancel after substitution, leaving $\\frac{-4}{-5}=\\frac45$.","zh":"代入后 $\\cos(2x+\\frac{\\pi}{4})$ 上下相消，只剩 $\\frac{-4}{-5}=\\frac45$。$0/0$ 时先看有没有公共因子。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":100,"s":"2.10","c":1,"a":"D","en":"Substitute: $\\frac{(-1)\\cos\\frac{\\pi}{3}}{4}=\\frac{-1/2}{4}=-\\frac18$.","zh":"代入得 $\\frac{-1\\cdot\\frac12}{4}=-\\frac18$。余弦在 $\\frac{\\pi}{3}$ 处为 $\\frac12$。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":101,"s":"2.10","c":1,"a":"C","en":"$\\frac{(0+4)\\sin\\frac{\\pi}{6}}{0+4}=\\frac{4\\cdot\\frac12}{4}=\\frac12$.","zh":"代入得 $\\frac{4\\cdot\\frac12}{4}=\\frac12$。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":102,"s":"2.10","c":1,"a":"B","en":"Use $\\tan u\\sim u$ and $\\sin v\\sim v$: $\\frac{4x}{5x}=\\frac45$.","zh":"用等价无穷小 $\\tan u\\sim u$、$\\sin v\\sim v$，得 $\\frac{4x}{5x}=\\frac45$。系数之比就是答案。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":103,"s":"2.10","c":1,"a":"D","en":"$\\frac{\\sin8x}{3x}\\sim\\frac{8x}{3x}=\\frac83$.","zh":"$\\sin8x\\sim8x$，与分母的 $3x$ 相约，得 $\\frac83$。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":104,"s":"2.10","c":1,"a":"E","en":"$\\frac{\\sin8x}{5x}\\to\\frac85$.","zh":"$\\sin8x\\sim8x$，系数之比为 $\\frac85$。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":105,"s":"2.10","c":1,"a":"C","en":"The minus sign survives: $-\\frac{\\tan7x}{\\sin3x}\\to-\\frac{7}{3}$.","zh":"负号保留：$-\\frac{7x}{3x}=-\\frac73$。方括号外的负号最容易漏。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":106,"s":"2.10","c":1,"a":"C","en":"$\\frac{\\tan8x}{\\sin6x}\\to\\frac{8}{6}=\\frac43$.","zh":"$\\tan8x\\sim8x$、$\\sin6x\\sim6x$，得 $\\frac86=\\frac43$。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":107,"s":"2.10","c":1,"a":"B","en":"Use $1-\\cos u\\sim\\frac{u^{2}}{2}$: $\\frac{1-\\cos7x}{5x^{2}}\\sim\\frac{49x^{2}/2}{5x^{2}}=\\frac{49}{10}$, with the outer minus giving $-\\frac{49}{10}$.","zh":"用 $1-\\cos u\\sim\\frac{u^2}{2}$：$\\frac{49x^2/2}{5x^2}=\\frac{49}{10}$，再加外层负号得 $-\\frac{49}{10}$。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":108,"s":"2.10","c":1,"a":"C","en":"$\\frac{1-\\cos2x}{x^{2}}\\sim\\frac{2x^{2}}{x^{2}}=2$, and the outer minus makes it $-2$.","zh":"$1-\\cos2x\\sim\\frac{(2x)^2}{2}=2x^2$，商为 $2$，带负号得 $-2$。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":109,"s":"2.10","c":1,"a":"D","en":"$\\frac{1-\\cos2x}{6x^{2}}\\to\\frac{2x^{2}}{6x^{2}}=\\frac13$.","zh":"分子 $\\sim2x^2$，除以 $6x^2$ 得 $\\frac13$。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":110,"s":"2.10","c":1,"a":"B","en":"$\\frac{1-\\cos5x}{6x^{2}}\\to\\frac{25}{12}$, so with the minus the value is $-\\frac{25}{12}$ — not among the options.","zh":"$\\frac{25x^2/2}{6x^2}=\\frac{25}{12}$，带负号为 $-\\frac{25}{12}$，选项中不存在。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":111,"s":"2.10","c":1,"a":"A","en":"$\\frac{1-\\cos8x}{2x^{2}}\\to\\frac{32x^{2}}{2x^{2}}=16$, so the value is $-16$.","zh":"$1-\\cos8x\\sim32x^2$，除以 $2x^2$ 得 $16$，带负号为 $-16$。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":112,"s":"2.10","c":1,"a":"D","en":"With $u=\\frac4x\\to0$, $\\sqrt x\\sin\\frac4x=\\sqrt x\\cdot\\frac{4}{x}\\cdot\\frac{\\sin u}{u}\\to\\frac{4}{\\sqrt x}\\to0$.","zh":"令 $u=\\frac4x\\to0$，则 $\\sqrt x\\sin\\frac4x\\approx\\frac{4}{\\sqrt x}\\to0$。$x$ 在根号里、$\\frac1x$ 在分子，量级决定结果。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":113,"s":"2.10","c":1,"a":"E","en":"The same estimate gives $\\frac{4}{\\sqrt x}\\to0$; the coefficient $-3$ does not change the limit.","zh":"同理得 $\\frac{4}{\\sqrt x}\\to0$，系数 $-3$ 不改变极限。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":114,"s":"2.10","c":1,"a":"B","en":"$\\sqrt x\\sin\\frac8x\\approx\\frac{8}{\\sqrt x}\\to0$, which is not offered.","zh":"$\\sqrt x\\sin\\frac8x\\approx\\frac{8}{\\sqrt x}\\to0$，选项中没有 $0$，故选\\\"以上都不对\\\"。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":115,"s":"2.10","c":1,"a":"D","en":"Put $u=x+\\frac{\\pi}{2}\\to0^{+}$; then $\\tan(-x-\\pi)=\\cot u\\sim\\frac1u$, so the product tends to $\\frac{2}{3}$.","zh":"令 $u=x+\\frac{\\pi}{2}\\to0^{+}$，则 $\\tan(-x-\\pi)=\\cot u\\sim\\frac1u$，乘积趋于 $\\frac23$。用余切把小量搬到分子。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":116,"s":"2.10","c":1,"a":"A","en":"With $u=x-\\frac{\\pi}{2}$, $\\tan(-4x+\\frac{5\\pi}{2})=\\cot(4u)\\sim\\frac{1}{4u}$; multiplying by $-\\frac{6u}{5}$ gives $-\\frac{3}{10}$.","zh":"令 $u=x-\\frac{\\pi}{2}$，则 $\\tan(-4x+\\frac{5\\pi}{2})=\\cot4u\\sim\\frac1{4u}$，乘 $-\\frac{6u}{5}$ 得 $-\\frac{3}{10}$。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":117,"s":"2.10","c":1,"a":"E","en":"With $u=x-\\frac{\\pi}{2}\\to0^{+}$, $\\tan(-6x+\\frac{7\\pi}{2})=\\cot(6u)\\sim\\frac{1}{6u}$, and the prefactor $\\frac{u}{3}$ leaves $\\frac{1}{18}$.","zh":"令 $u=x-\\frac{\\pi}{2}$，$\\tan(-6x+\\frac{7\\pi}{2})=\\cot6u\\sim\\frac1{6u}$，前面因子 $\\frac u3$ 给出 $\\frac1{18}$。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":118,"s":"2.10","c":1,"a":"D","en":"With $u=x+\\frac{\\pi}{2}\\to0^{-}$, $\\tan(4x+\\frac{3\\pi}{2})=-\\cot(4u)\\sim-\\frac{1}{4u}$; the product with $-\\frac{4u}{5}$ is $\\frac15$.","zh":"令 $u=x+\\frac{\\pi}{2}\\to0^{-}$，$\\tan(4x+\\frac{3\\pi}{2})=-\\cot4u\\sim-\\frac1{4u}$，与 $-\\frac{4u}{5}$ 相乘得 $\\frac15$。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":119,"s":"2.10","c":1,"a":"B","en":"With $u=x-\\frac{\\pi}{2}$, $\\tan(2x-\\frac{\\pi}{2})=-\\cot(2u)\\sim-\\frac{1}{2u}$, and $-\\frac{5u}{3}$ times that gives $\\frac56$.","zh":"令 $u=x-\\frac{\\pi}{2}$，$\\tan(2x-\\frac{\\pi}{2})=-\\cot2u\\sim-\\frac1{2u}$，乘 $-\\frac{5u}{3}$ 得 $\\frac56$。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":120,"s":"2.10","c":1,"a":"A","en":"$\\sin3t=3t-\\frac{9}{2}t^{3}+\\cdots$, so numerator $6t-2\\sin3t\\to9t^{3}$ while the denominator is $\\sim3t$; the ratio is $\\sim3t^{2}\\to0$.","zh":"$\\sin3t=3t-\\frac92t^3+\\cdots$，分子 $6t-2\\sin3t\\sim9t^3$，分母 $\\sim3t$，比值 $\\sim3t^2\\to0$。线性项抵消时必须看更高阶。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":121,"s":"2.10","c":1,"a":"C","en":"$2\\sin4t=8t-\\frac{64}{3}t^{3}+\\cdots$, so the numerator is $\\sim-\\frac{64}{3}t^{3}$ and the ratio tends to $0$.","zh":"展开后线性项抵消，分子为 $O(t^3)$，分母 $O(t)$，故极限为 $0$。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":122,"s":"2.10","c":1,"a":"E","en":"$\\sin3t=3t+O(t^{3})$ cancels the $-8t$ only partly: the ratio of the linear coefficients is $\\frac{-8+3}{4}=-\\frac54$.","zh":"$\\sin3t=3t+O(t^3)$，线性部分为 $-8t+3t=-5t$，除以 $4t$ 得 $-\\frac54$。$\\sec2t\\to1$ 可以先代。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":123,"s":"2.10","c":1,"a":"E","en":"Linear parts: $6t-2t=4t$, and $\\sec3t\\to1$, so the limit is $\\frac44=1$.","zh":"线性部分 $6t-2t=4t$，$\\sec3t\\to1$，故极限为 $1$。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":124,"s":"2.10","c":1,"a":"A","en":"Linear parts give $7t-4t=3t$ over $4t$, so the limit is $\\frac34$.","zh":"线性部分 $7t-4t=3t$，除以 $4t$ 得 $\\frac34$。","focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":125,"s":"2.11","c":1,"a":"A","en":"$|\\sin\\frac{7}{x^{2}}|\\le1$ while $3x^{3}\\to0$, so the product is squeezed to $0$.","zh":"$\\sin$ 有界而 $3x^3\\to0$，由夹逼定理乘积趋于 $0$。有界量乘无穷小仍是无穷小。","focus":"Bounded × infinitesimal → 0 by the squeeze theorem.","trap":"Applying it when the bounded factor is multiplied by something that does not vanish."},{"id":126,"s":"2.11","c":1,"a":"C","en":"The oscillating term vanishes: $3x^{3}\\cos\\frac{6}{x}\\to0$, leaving $0-3=-3$.","zh":"振荡项被 $x^3$ 压成 $0$，剩下的常数项给出 $-3$。","focus":"Bounded × infinitesimal → 0 by the squeeze theorem.","trap":"Applying it when the bounded factor is multiplied by something that does not vanish."},{"id":127,"s":"3.1","c":2,"a":"D","en":"The numerator is linear and the denominator quadratic, so the denominator wins: the limit is $0$.","zh":"分子一次、分母二次，分母阶数更高，故极限为 $0$。比次数是最快的判据。","focus":"Rational functions at infinity: compare the degrees of numerator and denominator.","trap":"Forgetting the sign when the highest power is odd; dividing by the wrong power."},{"id":128,"s":"3.1","c":2,"a":"B","en":"Linear over quadratic → $0$.","zh":"分子一次、分母二次，极限为 $0$。","focus":"Rational functions at infinity: compare the degrees of numerator and denominator.","trap":"Forgetting the sign when the highest power is odd; dividing by the wrong power."},{"id":129,"s":"3.1","c":2,"a":"E","en":"Linear over quadratic → $0$; the sign of the leading coefficient is irrelevant.","zh":"一次除以二次，极限为 $0$，首项系数的正负不影响结论。","focus":"Rational functions at infinity: compare the degrees of numerator and denominator.","trap":"Forgetting the sign when the highest power is odd; dividing by the wrong power."},{"id":130,"s":"3.1","c":2,"a":"E","en":"Divide by $x^{2}$: $-2+\\frac{2\\cos(6x-5)}{x^{2}}\\to-2$, since the cosine term is bounded over $x^{2}\\to\\infty$.","zh":"同除 $x^2$：$-2+\\frac{2\\cos(6x-5)}{x^2}$，有界量除以 $x^2$ 趋于 $0$，故极限为 $-2$。","focus":"Rational functions at infinity: compare the degrees of numerator and denominator.","trap":"Forgetting the sign when the highest power is odd; dividing by the wrong power."},{"id":131,"s":"3.1","c":2,"a":"C","en":"Same degree: the limit is the ratio of leading coefficients $\\frac{4}{-2}=-2$.","zh":"同次，取首项系数之比 $\\frac{4}{-2}=-2$。","focus":"Rational functions at infinity: compare the degrees of numerator and denominator.","trap":"Forgetting the sign when the highest power is odd; dividing by the wrong power."},{"id":132,"s":"3.1","c":2,"a":"D","en":"Split: $\\frac{-2x}{x}=-2$, $\\frac{\\sin(2x+2)}{x}\\to0$, $\\frac{2}{x}\\to0$; total $-2$.","zh":"拆成三项：$\\frac{-2x}{x}=-2$，其余两项都有界除以 $x$ 趋于 $0$，故为 $-2$。","focus":"Rational functions at infinity: compare the degrees of numerator and denominator.","trap":"Forgetting the sign when the highest power is odd; dividing by the wrong power."},{"id":133,"s":"3.1","c":2,"a":"D","en":"Divide by $x^{3}$: $-2-\\frac{3}{x}-\\frac{5\\sin(2x+6)}{x^{3}}\\to-2$.","zh":"同除 $x^3$：$-2-\\frac3x-\\frac{5\\sin(\\cdot)}{x^3}$，后两项趋于 $0$，故为 $-2$。","focus":"Rational functions at infinity: compare the degrees of numerator and denominator.","trap":"Forgetting the sign when the highest power is odd; dividing by the wrong power."},{"id":134,"s":"3.1","c":2,"a":"A","en":"Divide by $x^{3}$: $1+\\frac1x+\\frac{6\\cos(3x-2)}{x^{3}}\\to1$.","zh":"同除 $x^3$ 得 $1+\\frac1x+\\frac{6\\cos(\\cdot)}{x^3}\\to1$。","focus":"Rational functions at infinity: compare the degrees of numerator and denominator.","trap":"Forgetting the sign when the highest power is odd; dividing by the wrong power."},{"id":135,"s":"3.1","c":2,"a":"D","en":"$\\frac{-4x^{2}}{x^{2}}=-4$ and the remaining terms vanish; limit $-4$.","zh":"首项之比为 $-4$，其余项趋于 $0$，故为 $-4$。","focus":"Rational functions at infinity: compare the degrees of numerator and denominator.","trap":"Forgetting the sign when the highest power is odd; dividing by the wrong power."},{"id":136,"s":"3.1","c":2,"a":"C","en":"Numerator degree $3$ exceeds denominator degree $2$, and the leading coefficient is positive, so the limit is $+\\infty$.","zh":"分子三次、分母二次，次数更高且首项为正，故极限为 $+\\infty$。","focus":"Rational functions at infinity: compare the degrees of numerator and denominator.","trap":"Forgetting the sign when the highest power is odd; dividing by the wrong power."},{"id":137,"s":"3.2","c":2,"a":"A","en":"For $x\\to-\\infty$, $\\sqrt{16x^{2}-7x+8}\\approx4|x|=-4x$. The quotient is $\\frac{4x}{-4x}=-1$.","zh":"$x\\to-\\infty$ 时 $\\sqrt{16x^2}\\approx4|x|=-4x$，故商为 $\\frac{4x}{-4x}=-1$。$|x|=-x$ 是本题唯一考点。","focus":"Limits at infinity involving a square root: factor out the dominant power, remembering √(x²) = |x|.","trap":"Writing √(x²) = x when x → −∞."},{"id":138,"s":"3.2","c":2,"a":"E","en":"Same argument: denominator $\\approx-4x$, numerator $4x$, so the limit is $-1$.","zh":"分母 $\\approx-4x$、分子 $4x$，极限为 $-1$。","focus":"Limits at infinity involving a square root: factor out the dominant power, remembering √(x²) = |x|.","trap":"Writing √(x²) = x when x → −∞."},{"id":139,"s":"3.2","c":2,"a":"D","en":"$\\sqrt{25x^{2}-8x+3}\\approx-5x$ as $x\\to-\\infty$, and the numerator $\\approx-5x$, so the limit is $1$.","zh":"$x\\to-\\infty$ 时根号 $\\approx-5x$，分子 $\\approx-5x$，故极限为 $1$。两个负号相消。","focus":"Limits at infinity involving a square root: factor out the dominant power, remembering √(x²) = |x|.","trap":"Writing √(x²) = x when x → −∞."},{"id":140,"s":"3.2","c":2,"a":"D","en":"As $x\\to+\\infty$ the square root $\\approx5x$, so $\\frac{-5x}{5x}=-1$, which is not among the choices.","zh":"$x\\to+\\infty$ 时根号 $\\approx5x$，商为 $-1$。选项中没有 $-1$，故选\\\"以上都不对\\\"。","focus":"Limits at infinity involving a square root: factor out the dominant power, remembering √(x²) = |x|.","trap":"Writing √(x²) = x when x → −∞."},{"id":141,"s":"3.2","c":2,"a":"B","en":"At $+\\infty$: numerator $\\approx2x$, denominator $\\approx-2x$, so the limi
