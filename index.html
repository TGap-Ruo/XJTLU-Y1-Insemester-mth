7.4","c":6,"p":314},{"id":1315,"s":"8.1","c":7,"p":315},{"id":1316,"s":"9.1","c":8,"p":316},{"id":1317,"s":"9.2","c":8,"p":317},{"id":1318,"s":"9.2","c":8,"p":318},{"id":1319,"s":"9.2","c":8,"p":319},{"id":1320,"s":"9.3","c":8,"p":320},{"id":1321,"s":"9.4","c":8,"p":321},{"id":1322,"s":"9.4","c":8,"p":322},{"id":1323,"s":"9.5","c":8,"p":323}],"ref":[{"id":"1.1","en":"Natural Domain of a Logarithmic Function","zh":"对数函数的自然定义域","c":0,"n":10,"focus":"The argument of a logarithm must be strictly positive; solve the resulting polynomial or rational inequality.","steps":["Set the inside of log &gt; 0 (and denominator ≠ 0 if it is a fraction).","Factor and mark the critical points on a sign chart.","Read off the intervals where the sign is +.","Use round brackets for strict inequalities; never include the roots."],"note":"真数必须严格大于零。把二次式因式分解后画符号表，取正号区间；因为是严格不等号，端点一律不含，写成开区间。","trap":"Writing ≥ 0 instead of &gt; 0; keeping the roots inside the interval."},{"id":"1.2","en":"Evaluating Composite Functions","zh":"复合函数求值","c":0,"n":10,"focus":"Compose two functions and evaluate at the given point — substitute inner first.","steps":["Compute the inner value g(x0) (or f(x0)) exactly, keeping π/6, π/3 etc.","Substitute that value into the outer function.","Use exact trigonometric values; simplify surds."],"note":"先算内层函数在给定点的值（保留 π/6、π/3 这类特殊角），再代入外层函数。特殊角的三角函数值必须记准。","trap":"Applying the functions in the wrong order; rounding π/6 to a decimal too early."},{"id":"1.3","en":"Inverse Function and Its Domain","zh":"反函数及其定义域","c":0,"n":5,"focus":"Find the inverse of a fractional-linear (or radical) function and state its domain.","steps":["Write y = f(x), then solve for x in terms of y.","Swap x and y to get f⁻¹(x).","Domain of f⁻¹ = range of f: find it from the original function, not from the formula."],"note":"先解出 x 关于 y 的表达式，再互换字母。反函数的定义域等于原函数的值域，要从原函数求，不能从新公式猜。","trap":"Reporting the domain of f instead of the range of f; forgetting to exclude a value that makes the denominator zero."},{"id":"1.4a","en":"Principal Values of Inverse Trig (same function)","zh":"反三角化主值（同函数）","c":0,"n":15,"focus":"Reduce an inverse trigonometric expression to its principal value.","steps":["Identify which quadrant the angle must lie in for the given inverse function.","Use the reference angle and adjust the sign for that quadrant.","Check the result against the principal range: arcsin ∈ [−π/2, π/2], arccos ∈ [0, π], arctan ∈ (−π/2, π/2)."],"note":"先确定该反三角函数的取值区间（主值范围），再用参考角并按象限定符号。答案必须落在主值区间内。","trap":"Giving an angle outside the principal range; losing the negative sign in the third quadrant."},{"id":"1.4b","en":"Converting Between Inverse Trig Functions","zh":"反三角互化（异函数）","c":0,"n":5,"focus":"Convert between arcsin, arccos and arctan using complementary or supplementary identities.","steps":["Use arccos x = π/2 − arcsin x, or arctan x + arctan(1/x) = ±π/2 depending on the sign.","For negative arguments use the odd/even symmetry of each function.","Simplify and check the range."],"note":"用余角/补角关系互化：arccos x = π/2 − arcsin x；arctan x + arctan(1/x) 按符号取 ±π/2。负数用奇偶性处理。","trap":"Ignoring the sign; applying the identity outside its valid range."},{"id":"1.4c","en":"Nested Inverse Trigonometric Evaluation","zh":"反三角嵌套代数求值","c":0,"n":5,"focus":"Evaluate a nested expression such as sin(arctan a) or cos(2 arcsin b) exactly.","steps":["Draw a right triangle (or use an identity) to convert the inner inverse trig value into a ratio.","Apply the outer function using that ratio.","For double angles use the double-angle formula rather than computing the angle."],"note":"画直角三角形把内层反三角转成边长比，再代外层函数；遇到倍角直接用倍角公式，不要真的算出角度。","trap":"Treating arctan a as the ratio a; sign errors when the triangle is in a negative branch."},{"id":"2.1","en":"Limit of a Piecewise Function at a Point","zh":"分段函数在某点的极限","c":1,"n":5,"focus":"The limit at a point depends only on values near the point, never on the value at the point.","steps":["Find which formula applies for x near (but not equal to) a.","Substitute or simplify using that branch only.","Ignore the separately defined f(a)."],"note":"极限只看该点附近的取值，与该点本身定义成什么无关。选对邻近区间对应的那一支表达式即可，f(a) 单独给出的值可以完全无视。","trap":"Plugging in the branch that applies at x = a instead of near a."},{"id":"2.2","en":"One-Sided Limits of Piecewise Functions","zh":"分段函数的左右极限","c":1,"n":5,"focus":"Compute both one-sided limits; the two-sided limit exists only if they agree.","steps":["Evaluate the left limit using the formula valid for x &lt; a.","Evaluate the right limit using the formula valid for x &gt; a.","Conclude: equal → that value; different → DNE."],"note":"左右两支分别求极限：相等则双侧极限存在且等于该值，不等则极限不存在（DNE）。","trap":"Declaring DNE without checking both sides; using the wrong branch for each side."},{"id":"2.3","en":"Limits Involving Absolute Value","zh":"含绝对值的极限","c":1,"n":5,"focus":"Remove the absolute value by splitting according to the sign of the inner expression.","steps":["Find where the inside of |·| changes sign.","On each side replace |u| by ±u and simplify.","Take one-sided limits and compare."],"note":"先找绝对值内表达式变号的分界点，在该点左右分别去掉绝对值（取 +u 或 −u），再分别求单侧极限。","trap":"Dropping the absolute value without considering the sign; forgetting the sign flip on the left."},{"id":"2.4","en":"Oscillation and Non-Existent Limits","zh":"振荡函数与极限不存在","c":1,"n":5,"focus":"Oscillating factors such as sin(1/x) prevent a limit from existing at the point.","steps":["Show the function oscillates between fixed bounds as x → a (pick two sequences).","If the two sequences give different limits → DNE.","If the oscillation is multiplied by something → 0, use the squeeze theorem instead."],"note":"sin(1/x) 这类振荡因子在趋近点附近反复取值。取两条不同子列得到不同极限即可断定不存在；若振荡因子乘的是趋于 0 的量，则改用夹逼。","trap":"Assuming the limit is 0 just because the function is bounded."},{"id":"2.5","en":"0/0 Form: Factoring and Cancelling","zh":"0/0 型：因式分解约简","c":1,"n":10,"focus":"0/0 indeterminate form: factor and cancel the common factor.","steps":["Confirm the form is 0/0 by substitution.","Factor numerator and denominator; cancel the common (x − a).","Substitute again into the simplified expression."],"note":"先代入确认是 0/0，再因式分解并约去公因子 (x−a)，最后把 x = a 代回化简后的式子。","trap":"Cancelling terms that are not factors; forgetting to re-substitute after cancelling."},{"id":"2.6","en":"Direct Substitution for Continuous Functions","zh":"连续函数直接代入","c":1,"n":5,"focus":"For a continuous function the limit equals the function value — just substitute.","steps":["Check the function is continuous at the point (no division by zero, no log of negative).","Substitute directly, simplifying surds exactly."],"note":"连续函数求极限就是直接代入函数值。只要没有分母为零、没有对数取负数，就可以放心代入。","trap":"Over-complicating a limit that is simply a substitution; decimal approximations."},{"id":"2.7","en":"Algebra of Known Limits","zh":"已知极限的四则组合","c":1,"n":5,"focus":"Combine known limits using the algebra of limits.","steps":["Apply the sum/product/quotient rules, provided each part has a finite limit.","Watch the denominator limit: it must be non-zero."],"note":"用极限的四则运算法则拆开计算，前提是每一部分的极限都存在且分母极限不为零。","trap":"Splitting a limit whose parts do not exist; dividing by a limit equal to zero."},{"id":"2.8","en":"0/0 Form: Rationalising","zh":"0/0 型：根式有理化","c":1,"n":5,"focus":"0/0 with a square root: multiply by the conjugate to rationalise.","steps":["Multiply numerator and denominator by the conjugate of the radical part.","Expand using (a − b)(a + b) = a² − b².","Cancel the common factor, then substitute."],"note":"分子分母同乘共轭式，用平方差公式去掉根号，再约去公因子后代值。","trap":"Forgetting to multiply the denominator as well; sign errors in the conjugate."},{"id":"2.9","en":"One-Sided Infinite Limits","zh":"单侧无穷极限","c":1,"n":1,"focus":"A one-sided infinite limit: the denominator → 0⁺ or 0⁻ decides +∞ or −∞.","steps":["Approach from the stated side only.","Determine the sign of numerator and denominator separately.","Report +∞ or −∞ accordingly."],"note":"只从题目指定的那一侧趋近，分别判断分子与分母的符号，据此写出 +∞ 或 −∞。","trap":"Mixing the two sides; treating ∞ as a number."},{"id":"2.10","en":"Trigonometric Limits","zh":"三角函数极限","c":1,"n":28,"focus":"Trigonometric limits: use sin u/u → 1 and (1 − cos u)/u → 0 by rewriting into that shape.","steps":["Rewrite the expression so that the argument of sin/cos matches the denominator.","Use sin u / u → 1, (1 − cos u)/u² → 1/2, tan u / u → 1.","Handle constants and powers carefully."],"note":"把式子整理成 sin u / u 的标准形（u 必须与分母一致），再用 sin u/u → 1、(1−cos u)/u² → 1/2、tan u/u → 1。","trap":"Mismatching the argument and the denominator; applying sin u/u → 1 when u does not → 0."},{"id":"2.11","en":"Squeeze Theorem (bounded × infinitesimal)","zh":"夹逼定理（有界乘无穷小）","c":1,"n":2,"focus":"Bounded × infinitesimal → 0 by the squeeze theorem.","steps":["Show one factor is bounded (|sin| ≤ 1, |cos| ≤ 1).","Show the other factor → 0.","Squeeze between −|g| and +|g| to conclude 0."],"note":"有界量乘无穷小仍为无穷小：用 −|g| ≤ f·g ≤ |g| 夹住，两端都趋于 0，故极限为 0。","trap":"Applying it when the bounded factor is multiplied by something that does not vanish."},{"id":"3.1","en":"Limits at Infinity of Rational Functions","zh":"有理函数的无穷远极限","c":2,"n":10,"focus":"Rational functions at infinity: compare the degrees of numerator and denominator.","steps":["Divide every term by the highest power of x in the denominator.","Use 1/xⁿ → 0 for n &gt; 0.","Degree numerator &lt; denominator → 0; equal → ratio of leading coefficients; greater → ±∞."],"note":"分子分母同除分母的最高次幂，用 1/xⁿ → 0。分子次数低于分母得 0，相等得首项系数之比，高于则为 ±∞。","trap":"Forgetting the sign when the highest power is odd; dividing by the wrong power."},{"id":"3.2","en":"Limits at Infinity with Radicals","zh":"含根号的无穷远极限","c":2,"n":5,"focus":"Limits at infinity involving a square root: factor out the dominant power, remembering √(x²) = |x|.","steps":["Factor x² out of the radical as |x| (careful: for x → −∞, |x| = −x).","Divide through by x, keeping track of the sign.","Evaluate the remaining finite limit."],"note":"从根号内提出最高次幂时，√(x²) = |x|。当 x → −∞ 时 |x| = −x，符号最容易错。","trap":"Writing √(x²) = x when x → −∞."},{"id":"3.3","en":"Radical Differences at Infinity","zh":"根式差的无穷远极限","c":2,"n":5,"focus":"Difference of radicals at infinity: multiply by the conjugate to remove the ∞ − ∞ form.","steps":["Multiply and divide by the conjugate sum.","Simplify the numerator with the difference of squares.","Divide by the highest power and take the limit."],"note":"遇到 ∞ − ∞ 型，乘共轭式化为分式，再用平方差展开，最后同除最高次幂求极限。","trap":"Forgetting the conjugate on the denominator; sign errors for x → −∞."},{"id":"3.4","en":"Limits of Sequences","zh":"数列极限","c":2,"n":5,"focus":"Limits of sequences: same algebra as functions, but n is an integer tending to ∞.","steps":["Divide by the dominant power of n.","Use standard limits such as (1 + a/n)ⁿ → eᵃ.","For oscillating factors use the squeeze theorem."],"note":"数列极限与函数极限算法一致，但 n 只取整数。常用 (1 + a/n)ⁿ → eᵃ；有振荡因子时用夹逼。","trap":"Treating n as continuous in a way that changes the answer; missing the e-form."},{"id":"3.5","en":"Horizontal and Vertical Asymptotes","zh":"水平与垂直渐近线","c":2,"n":5,"focus":"Find vertical asymptotes from the zeros of the denominator, horizontal ones from limits at ±∞.","steps":["Vertical: solve denominator = 0 (after cancelling common factors).","Horizontal: compute lim x→±∞ f(x); if it is a finite L, y = L is an asymptote.","State each asymptote as an equation."],"note":"垂直渐近线来自分母的零点（先约去公因子）；水平渐近线由 x → ±∞ 的极限决定，若极限为有限值 L，则 y = L。","trap":"Keeping a cancelled factor as an asymptote; reporting a point instead of a line."},{"id":"4.1","en":"Limits of Exponential Functions","zh":"指数函数极限","c":3,"n":9,"focus":"Limits of exponential functions: substitute if continuous, otherwise rewrite to expose e.","steps":["If the base is fixed and the exponent → a finite number, substitute directly.","For 1^∞ forms use (1 + u)^(1/u) → e.","Take logarithms when the exponent is variable."],"note":"底数固定、指数趋于有限值时直接代入；遇到 1^∞ 型用 (1+u)^{1/u} → e，或先取对数再求极限。","trap":"Applying the e-limit when the base does not tend to 1."},{"id":"4.2","en":"Limits of Logarithmic Functions","zh":"对数函数极限","c":3,"n":5,"focus":"Limits of logarithmic functions, including ln(1 + u)/u → 1.","steps":["Use continuity to substitute when the argument → a positive number.","For ln(1 + u)/u with u → 0, the limit is 1.","Rewrite log_a as ln/ln a when the base matters."],"note":"真数趋于正数时直接代入；出现 ln(1+u)/u 且 u → 0 时极限为 1。换底用 log_a x = ln x / ln a。","trap":"Forgetting ln 1 = 0 introduces a 0/0 form that must be handled."},{"id":"4.3","en":"Sign of a Logarithmic Quotient","zh":"含对数分式的符号判断","c":3,"n":1,"focus":"Determine the sign of a logarithmic quotient near a boundary point.","steps":["Find where numerator and denominator change sign.","Build a sign chart on the relevant interval.","Conclude the sign of the quotient on each side."],"note":"分别找分子、分母的变号点，画符号表，判断分式在边界两侧的正负。","trap":"Ignoring the domain restriction imposed by the logarithm."},{"id":"4.4","en":"Indeterminate Forms Involving e","zh":"含 e 的未定式","c":3,"n":5,"focus":"Indeterminate forms built from e: rewrite as e^{ln(...)} or use standard expansions.","steps":["Take ln of the expression to bring the exponent down.","Evaluate the resulting limit, then exponentiate.","Watch 0·∞ and ∞/∞ forms inside the exponent."],"note":"先取对数把指数拉下来，求完极限再取指数还原；指数内部常见 0·∞、∞/∞ 型。","trap":"Forgetting to exponentiate at the end."},{"id":"4.5","en":"(e^u-1)/u and ln(1+u)/u","zh":"(e^u-1)/u 与 ln(1+u)/u 重要极限","c":3,"n":5,"focus":"The two standard limits (e^u − 1)/u → 1 and ln(1 + u)/u → 1 as u → 0.","steps":["Check u → 0 and match the denominator exactly to u.","Adjust constants by multiplying and dividing.","Combine with the algebra of limits."],"note":"两个重要极限要求 u → 0 且分母与 u 完全一致；不一致就乘除常数凑形。","trap":"Using them when u does not tend to 0."},{"id":"4.6","en":"Compound Interest Models","zh":"复利模型","c":3,"n":5,"focus":"Continuous compounding: A = P e^{rt}; solve for whichever quantity is missing.","steps":["Identify P, r, t and whether compounding is continuous.","Use A = P e^{rt} for the balance; rearrange for P, r or t with logarithms.","Keep answers exact (ln form) unless a decimal is requested."],"note":"连续复利用 A = P e^{rt}。求利率或时间时两边取对数，答案用精确形式（含 ln），除非题目要求小数。","trap":"Using (1 + r/n)^{nt} when the question says continuously compounded."},{"id":"5.1","en":"Choosing L to Make f Continuous","zh":"求 L 使函数在点连续","c":4,"n":5,"focus":"Choose the constant L so that a piecewise function is continuous at the join.","steps":["Compute the left limit at the join.","Compute the right limit / the value of the other branch.","Set them equal and solve for L."],"note":"分别求连接点处的左极限与右极限，令二者相等解出 L。连续的定义就是左极限 = 右极限 = 函数值。","trap":"Using the function value instead of a limit on one side."},{"id":"5.2","en":"Classifying Discontinuities","zh":"间断点识别与分类","c":4,"n":10,"focus":"Classify discontinuities: removable, jump, infinite, or oscillatory.","steps":["Find the candidate points (denominator zero, piecewise joins).","Compute one-sided limits at each point.","Classify: limits equal but value differs/missing → removable; finite but unequal → jump; infinite → infinite."],"note":"先找可疑点（分母零点、分段连接点），再求左右极限：相等但函数值缺失或不等 → 可去间断；有限但不等 → 跳跃；趋于无穷 → 无穷间断。","trap":"Calling every discontinuity removable; missing a point where the function is undefined but the limit exists."},{"id":"5.3","en":"Parameters for Piecewise Continuity","zh":"分段函数求参数使连续","c":4,"n":5,"focus":"Find parameters that make a piecewise function continuous everywhere.","steps":["Write the continuity condition at each join point.","Solve the resulting system for the parameters.","Check the solution satisfies all joins."],"note":"对每个连接点写出「左极限 = 右极限」的方程，联立解出参数，再逐点验证。","trap":"Solving only one join when there are several."},{"id":"5.4","en":"Continuity versus Limit","zh":"连续与极限关系判断","c":4,"n":5,"focus":"Distinguish continuity from the existence of a limit.","steps":["Continuity at a requires: f(a) defined, limit exists, and the two agree.","A limit can exist without continuity (hole at the point).","Continuity implies the limit exists, not conversely."],"note":"连续需要三个条件同时成立：f(a) 有定义、极限存在、二者相等。极限存在不代表连续（可能是可去间断）。","trap":"Assuming differentiability from continuity, or continuity from a limit."},{"id":"5.5","en":"IVT and Zeros","zh":"零点定理 / 介值定理","c":4,"n":5,"focus":"Intermediate Value Theorem: a continuous function on [a, b] takes every value between f(a) and f(b).","steps":["Verify f is continuous on the closed interval.","Evaluate f at the endpoints and check the target value lies between them.","Conclude existence of at least one c; for uniqueness add monotonicity."],"note":"介值定理：闭区间上连续的函数必取到两端函数值之间的任何值。先验证连续、再算两端值，判断目标值是否夹在中间；要说明唯一还须单调。","trap":"Applying IVT on an interval where f is not continuous; claiming uniqueness without monotonicity."},{"id":"6.1","en":"Slope of a Tangent Line","zh":"切线斜率","c":5,"n":5,"focus":"The slope of the tangent at x = a is f′(a).","steps":["Differentiate f(x).","Substitute x = a into f′(x).","Interpret the sign: positive rising, negative falling."],"note":"切线斜率就是导数在该点的值：先求 f′(x)，再代入 x = a。","trap":"Substituting into f instead of f′."},{"id":"6.2","en":"Derivative at a Point","zh":"某点的导数","c":5,"n":5,"focus":"Evaluate the derivative at a specific point, including from the limit definition.","steps":["If the definition is required, write [f(a+h) − f(a)]/h and simplify.","Otherwise differentiate and substitute.","Simplify surds and fractions exactly."],"note":"若题目要求用定义，就写 [f(a+h) − f(a)]/h 化简后令 h → 0；否则求导后代入。","trap":"Algebra slips when expanding (a+h)ⁿ; forgetting to rationalise."},{"id":"6.3","en":"Equation of a Tangent Line","zh":"切线方程","c":5,"n":5,"focus":"Equation of the tangent line at a point: y − y₀ = f′(x₀)(x − x₀).","steps":["Compute y₀ = f(x₀).","Compute the slope m = f′(x₀).","Write y − y₀ = m(x − x₀) and rearrange to the required form."],"note":"先算点 (x₀, f(x₀))，再算斜率 f′(x₀)，用点斜式 y − y₀ = m(x − x₀)，最后整理成题目要求的形式。","trap":"Using the normal-line slope; sign errors in rearranging."},{"id":"6.4","en":"Basic Differentiation (power, trig, algebra)","zh":"基本求导（幂/三角/四则）","c":5,"n":10,"focus":"Basic differentiation: power, trigonometric and algebraic combinations.","steps":["Apply the power rule, the sum rule and the constant multiple rule.","For products use (uv)′ = u′v + uv′; for quotients the quotient rule.","Simplify before and after differentiating."],"note":"幂函数、三角函数与四则运算的基本求导：和差直接逐项求，乘积用 (uv)′ = u′v + uv′，商用商法则。","trap":"Forgetting the chain factor; quotient-rule sign errors."},{"id":"6.5","en":"Chain Rule","zh":"链式法则","c":5,"n":10,"focus":"Chain rule: differentiate the outer function, then multiply by the derivative of the inner.","steps":["Identify the outer and inner functions.","Differentiate outer at the inner, then multiply by inner′.","Repeat for deeper nesting."],"note":"链式法则：外层对中层求导，再乘内层的导数；嵌套几层就乘几次。","trap":"Missing the innermost factor; treating a composite as a product."},{"id":"6.6","en":"Higher-Order Derivatives","zh":"高阶导数","c":5,"n":10,"focus":"Higher-order derivatives: differentiate repeatedly and evaluate as required.","steps":["Differentiate once, twice, … as many times as asked.","Look for a pattern when a general formula is needed.","Substitute the point only at the end."],"note":"一阶一阶往下求，需要通项时找规律；最后再代点，避免中途代入导致无法继续求导。","trap":"Substituting the point too early; losing a factor when the pattern repeats."},{"id":"6.7","en":"Kinematics: Velocity and Acceleration","zh":"运动学：速度与加速度","c":5,"n":5,"focus":"Kinematics: velocity is the derivative of position, acceleration the derivative of velocity.","steps":["Write s(t) and differentiate to get v(t) = s′(t).","Differentiate again for a(t) = v′(t).","Set v = 0 to find turning/rest points when asked."],"note":"位置求导得速度，速度再求导得加速度。问「何时静止」就令 v(t) = 0。","trap":"Confusing the sign of velocity with speed; forgetting units."},{"id":"7.1","en":"Differentiating Exponential and Logarithmic Functions","zh":"指数与对数求导","c":6,"n":16,"focus":"Differentiate exponential and logarithmic functions, including composite arguments.","steps":["(e^u)′ = e^u u′; (a^u)′ = a^u ln a · u′.","(ln u)′ = u′/u; (log_a u)′ = u′/(u ln a).","Apply the chain rule for composite arguments."],"note":"(e^u)′ = e^u·u′，(a^u)′ = a^u ln a·u′，(ln u)′ = u′/u。复合时别忘了链式因子 u′。","trap":"Forgetting ln a for a general base; dropping u′."},{"id":"7.2","en":"Derivative of an Inverse Function","zh":"反函数求导","c":6,"n":5,"focus":"Derivative of an inverse function: (f⁻¹)′(y) = 1 / f′(x) where y = f(x).","steps":["Find x such that f(x) = y₀.","Compute f′(x) at that x.","Take the reciprocal."],"note":"反函数求导：(f⁻¹)′(y₀) = 1 / f′(x₀)，其中 f(x₀) = y₀。先由 y₀ 反解 x₀，再取导数倒数。","trap":"Evaluating f′ at y₀ instead of at x₀."},{"id":"7.3","en":"Derivatives of Inverse Trigonometric Functions","zh":"反三角函数求导","c":6,"n":5,"focus":"Standard derivatives of arcsin, arccos and arctan, with the chain rule.","steps":["arcsin u → u′/√(1 − u²); arccos u → −u′/√(1 − u²); arctan u → u′/(1 + u²).","Identify u and compute u′.","Simplify."],"note":"arcsin u 导数为 u′/√(1−u²)，arccos 前面多一个负号，arctan 为 u′/(1+u²)。","trap":"Mixing up the arccos sign; forgetting u′."},{"id":"7.4","en":"Logarithmic Differentiation","zh":"对数求导法（幂指函数）","c":6,"n":4,"focus":"Logarithmic differentiation for y = f(x)^{g(x)}.","steps":["Take ln of both sides: ln y = g(x) ln f(x).","Differentiate implicitly.","Multiply by y to finish."],"note":"幂指函数先取对数：ln y = g(x) ln f(x)，两边求导后再乘回 y。","trap":"Differentiating f^g as if the exponent were constant."},{"id":"7.5","en":"Implicit Differentiation","zh":"隐函数求导","c":6,"n":5,"focus":"Implicit differentiation: differentiate both sides with respect to x, treating y as a function of x.","steps":["Differentiate every term; each y-term picks up a factor y′.","Collect y′ terms on one side.","Solve for y′ = dy/dx."],"note":"两边对 x 求导，含 y 的项要额外乘 y′；把 y′ 的项归到一边后解出。","trap":"Forgetting y′ on y-terms; treating y as a constant."},{"id":"7.6","en":"Tangent Line from an Implicit Curve","zh":"隐函数的切线方程","c":6,"n":5,"focus":"Tangent line to an implicitly defined curve at a given point.","steps":["Differentiate implicitly to get y′.","Substitute the point to get the slope.","Write y − y₀ = m(x − x₀)."],"note":"先隐函数求导得到 y′，再代点求斜率，最后写点斜式。","trap":"Substituting the point before solving for y′; using the wrong point."},{"id":"8.1","en":"Rising Balloon (right triangle)","zh":"气球上升（直角三角形）","c":7,"n":2,"focus":"Related rates with a right triangle: differentiate the geometric relation with respect to time.","steps":["Draw the figure and name the variables.","Write the relation between them (Pythagoras or tangent).","Differentiate with respect to t, then substitute the instantaneous values."],"note":"先画图设变量，写出几何关系（勾股或正切），两边对 t 求导，最后代入该时刻的数值。","trap":"Substituting the numbers before differentiating; forgetting a factor of 2 from differentiating squares."},{"id":"8.2","en":"Conical Tank","zh":"圆锥水箱","c":7,"n":2,"focus":"Related rates with similar triangles (conical tank).","steps":["Use similar triangles to express the radius in terms of the height.","Write V = (1/3)π r² h with r replaced.","Differentiate with respect to t and substitute."],"note":"先用相似三角形把半径表示成高的函数，代入 V = (1/3)πr²h 后再对 t 求导。","trap":"Treating r as constant; using the full cone volume formula with a fixed radius."},{"id":"8.3","en":"Boat and Telescope (angle)","zh":"船与望远镜（角度变化）","c":7,"n":1,"focus":"Related rates with an angle: differentiate a trigonometric relation.","steps":["Write tan θ = opposite / adjacent.","Differentiate with respect to t (sec²θ · dθ/dt).","Substitute the geometry at that instant to get sec²θ."],"note":"写出 tan θ = 对边/邻边，对 t 求导得 sec²θ·dθ/dt，再代该时刻的边长求 sec²θ。","trap":"Forgetting to convert the angle to radians when a rate in degrees is given."},{"id":"9.1","en":"Critical and Singular Points","zh":"驻点与奇点","c":8,"n":5,"focus":"Critical points where f′ = 0 and singular points where f′ does not exist.","steps":["Solve f′(x) = 0 for stationary points.","Find points where f′ is undefined but f is continuous.","Report both kinds with their coordinates."],"note":"驻点解 f′(x) = 0；奇点是不存在导数但函数有定义的点。两类都要找齐。","trap":"Only reporting f′ = 0; including points outside the domain."},{"id":"9.2","en":"Extrema on a Closed Interval","zh":"闭区间最值","c":8,"n":15,"focus":"Absolute extrema on a closed interval: check critical points and both endpoints.","steps":["Find all critical points inside the interval.","Evaluate f at each critical point and at both endpoints.","Compare the values: largest is the maximum, smallest the minimum."],"note":"闭区间最值：找出区间内的所有临界点，连同两个端点一并代入比较，最大者为最大值、最小者为最小值。","trap":"Forgetting the endpoints; using the first-derivative test instead of comparing values."},{"id":"9.3","en":"Intervals of Increase and Decrease","zh":"单调区间","c":8,"n":5,"focus":"Intervals of increase and decrease from the sign of f′.","steps":["Find where f′ = 0 or is undefined; these split the domain.","Test the sign of f′ on each subinterval.","f′ &gt; 0 → increasing; f′ &lt; 0 → decreasing."],"note":"用 f′ 的零点与不存在的点把定义域分段，逐段判断 f′ 的符号：正为增、负为减。","trap":"Writing closed intervals where f′ = 0 at an endpoint; ignoring the domain."},{"id":"9.4","en":"Concavity and Inflection Points","zh":"凹凸区间与拐点","c":8,"n":10,"focus":"Concavity and inflection points from the sign of f″.","steps":["Compute f″(x) and find where f″ = 0 or is undefined.","Test the sign of f″ on each subinterval.","f″ &gt; 0 → concave up; f″ &lt; 0 → concave down; a sign change gives an inflection point."],"note":"求 f″ 并找其零点，分段判断符号：f″ &gt; 0 凹向上，f″ &lt; 0 凹向下；符号改变处才是拐点。","trap":"Calling every f″ = 0 point an inflection point without a sign change."},{"id":"9.5","en":"Number of Real Roots","zh":"实根个数判断","c":8,"n":5,"focus":"Number of real roots of an equation, counted via monotonicity and sign changes.","steps":["Move everything to one side and define f(x).","Find the intervals of monotonicity.","Use the sign of f at the ends of each interval (plus IVT) to count roots."],"note":"移项构造 f(x)，求单调区间，再结合各区间端点的函数值与介值定理数出实根个数。","trap":"Counting roots without checking the behaviour at ±∞; missing a double root."}],"forms":[{"name":"极限与等价无穷小 Limits","rows":[["\\lim_{u\\to0}\\frac{\\sin u}{u}=1","\\sin u\\sim u"],["\\lim_{u\\to0}\\frac{1-\\cos u}{u^{2}}=\\frac12","1-\\cos u\\sim\\frac{u^{2}}{2}"],["\\lim_{u\\to0}\\frac{e^{u}-1}{u}=1","e^{u}-1\\sim u"],["\\lim_{u\\to0}\\frac{\\ln(1+u)}{u}=1","\\ln(1+u)\\sim u"],["\\lim_{u\\to0}(1+u)^{1/u}=e","(1+u)^{1/u}\\to e"]]},{"name":"求导法则 Differentiation","rows":[["(x^{n})'=nx^{n-1}","(\\sin x)'=\\cos x"],["(\\cos x)'=-\\sin x","(\\tan x)'=\\sec^{2}x"],["(\\sec x)'=\\sec x\\tan x","(\\csc x)'=-\\csc x\\cot x"],["(e^{u})'=u'e^{u}","(\\ln u)'=\\frac{u'}{u}"],["(uv)'=u'v+uv'","\\left(\\frac uv\\right)'=\\frac{u'v-uv'}{v^{2}}"],["(\\arcsin u)'=\\frac{u'}{\\sqrt{1-u^{2}}}","(\\arctan u)'=\\frac{u'}{1+u^{2}}"],["(\\arccos u)'=-\\frac{u'}{\\sqrt{1-u^{2}}}","(f^{-1})'(b)=\\frac{1}{f'(a)}"]]},{"name":"三角值表 Exact values","rows":[["\\sin\\frac{\\pi}{6}=\\frac12","\\cos\\frac{\\pi}{6}=\\frac{\\sqrt3}{2}"],["\\sin\\frac{\\pi}{4}=\\frac{\\sqrt2}{2}","\\tan\\frac{\\pi}{4}=1"],["\\sin\\frac{\\pi}{3}=\\frac{\\sqrt3}{2}","\\cos\\frac{\\pi}{3}=\\frac12"],["\\sec\\frac{\\pi}{3}=2","\\tan\\frac{\\pi}{3}=\\sqrt3"]]},{"name":"主值区间 Principal ranges","rows":[["\\arcsin:\\ \\left[-\\frac{\\pi}{2},\\frac{\\pi}{2}\\right]","\\arccos:\\ [0,\\pi]"],["\\arctan:\\ \\left(-\\frac{\\pi}{2},\\frac{\\pi}{2}\\right)","\\sin(\\pi-\\theta)=\\sin\\theta"],["\\cos(2\\pi-\\theta)=\\cos\\theta","\\tan(\\theta+\\pi)=\\tan\\theta"]]},{"name":"复利 Compounding","rows":[["A=P\\left(1+\\frac rn\\right)^{nt}","A=Pe^{rt}"],["e^{rt}=2\\Rightarrow t=\\frac{\\ln2}{r}","\\text{monthly}: n=12"]]}],"gloss":[{"g":"Precalculus & functions","gz":"预备知识与函数","items":[["natural domain","自然定义域","使表达式有意义的所有实数；根号内非负、分母非零、真数为正"],["argument (of a logarithm)","真数","$\\log_a(\\cdot)$ 括号里的整体，必须严格大于零"],["strict inequality","严格不等式","$&lt;, &gt;$；端点一律不取，写成开区间"],["open / closed interval","开区间 / 闭区间","$(a,b)$ 不含端点，$[a,b]$ 含端点"],["composite function","复合函数","$(f\\circ g)(x)=f(g(x))$，先算内层"],["inverse function","反函数","$f^{-1}$ 把 $f$ 的输出映回输入；定义域即原函数值域"],["one-to-one","一一对应","反函数存在的前提；水平线检验"],["principal value","主值","反三角函数返 <script>
const LS='mth026.en.v1';
const ITEMS = DATA.items, SECS = DATA.sections, CHS = DATA.chapters;
const PQ = DATA.pq || [];
const BYID = {}; ITEMS.forEach(q=>BYID[q.id]=q);
const SECMAP = {}; SECS.forEach(s=>SECMAP[s.id]=s);
PQ.forEach(p=>{ BYID[p.id]={id:p.id, s:p.s, c:p.c, p:p.p, pq:1}; });
const PQBYSEC = {}; PQ.forEach(p=>{ (PQBYSEC[p.s]=PQBYSEC[p.s]||[]).push(p.id); });
/* one topic = both decks. Graded items first, then the originals served for it,
   so a topic is fully covered only when every item of either deck has been seen. */
const ALLBYSEC = {};
SECS.forEach(s=>{ const a=[];
  for(let i=s.from;i<=s.to;i++) a.push(i);
  (PQBYSEC[s.id]||[]).forEach(p=>a.push(p));
  ALLBYSEC[s.id]=a;
});
const TOTAL_PQ = PQ.length;
const REF = DATA.ref || [], FORMS = DATA.forms || [], GLOSS = DATA.gloss || [];
let store = {h:{}, fav:{}, streak:0, best:0};
try{ const raw=localStorage.getItem(LS); if(raw) store=Object.assign(store,JSON.parse(raw)); }catch(e){}
/* Old localStorage blobs may hold fav[id]=true/false/null or padded keys.
   The server skips bool/null and abs>1e14, so normalise before anything is
   uploaded: keys become canonical integer strings, values signed ms ints. */
function normFav(f){
  /* Same whitelist as the server's _fav_int(): a favourite is a signed ms
     timestamp, nothing else. Booleans/nulls are dropped rather than turned into
     1/0 — the server would accept 1 as a real (tiny) timestamp and isFav() would
     then show a ghost star that can never be explained. */
  const out={};
  Object.keys(f||{}).forEach(k=>{
    const key=String(Number(k));
    if(!/^\d+$/.test(key) || !(+key>0)) return;
    const raw=f[k];
    if(typeof raw==='boolean' || raw==null) return;
    const v=+raw;
    if(!Number.isFinite(v) || v===0 || Math.abs(v)>1e14) return;
    out[key]=v;
  });
  return out;
}
store.fav=normFav(store.fav);
function save(quiet){
  try{localStorage.setItem(LS,JSON.stringify(store))}catch(e){}
  if(!quiet) schedulePush();
}

/* ---------- account + cloud sync ----------
   Signed out, the browser is the only store. Signed in, the server keeps a
   copy and the two are merged per item by timestamp, so no device can erase
   what another device recorded. */
const CAN_API = location.protocol==='http:' || location.protocol==='https:';
let ACCT=null, SYNC=CAN_API?'guest':'local', acctMode='in', pushTimer=null;

function api(path, opts){
  opts=opts||{};
  opts.credentials='same-origin';
  opts.headers=Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  return fetch(path, opts)
    .then(r=>r.json().catch(()=>({})).then(d=>({ok:r.ok, status:r.status, d:d||{}})))
    .catch(()=>null);
}

function mergeInto(dst, src){
  const h=(src&&src.h)||{};
  Object.keys(h).forEach(k=>{
    const a=dst.h[k], b=h[k]||{};
    if(!a || (+b.t||0)>=(+a.t||0)) dst.h[k]=b;
  });
  dst.fav=dst.fav||{};
  const f=(src&&src.fav)||{};
  Object.keys(f).forEach(k=>{
    const a=+(dst.fav[k])||0, b=+(f[k])||0;          // true->1, false/null->0
    if(Math.abs(b)>=Math.abs(a)) dst.fav[k]=b;        // newest abs wins; deletions too
  });
  dst.streak=Math.max(+dst.streak||0, +src.streak||0);
  dst.best=Math.max(+dst.best||0, +src.best||0);
}

function setSync(s){ SYNC=s; paintAcct(); }

function schedulePush(){
  if(!ACCT||!CAN_API) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>syncNow(), 700);
}

function syncNow(){
  if(!ACCT||!CAN_API) return Promise.resolve();
  setSync('busy');
  return api('api/progress',{method:'PUT',
      body:JSON.stringify({h:store.h, streak:store.streak, best:store.best, fav:store.fav})})
    .then(r=>{
      if(!r){ setSync('err'); return; }
      if(r.status===401){ ACCT=null; setSync('guest'); paintTop(); return; }
      if(!r.ok){ setSync('err'); return; }
      mergeInto(store, r.d);
      save(true);
      setSync('on');
    });
}

function bootAcct(){
  if(!CAN_API){ setSync('local'); return Promise.resolve(); }
  return api('api/me').then(r=>{
    if(!r){ setSync('err'); return; }
    if(!r.d || !r.d.user){ setSync('guest'); return; }
    ACCT=r.d.user; setSync('busy');
    return api('api/progress').then(g=>{
      if(g && g.ok){ mergeInto(store, g.d); save(true); }
      return syncNow();
    });
  });
}

function paintAcct(){
  const n=document.getElementById('acctName'), d=document.getElementById('acctDot');
  if(!n||!d) return;
  n.textContent = ACCT? ACCT.display : (CAN_API? 'Sign in' : 'Local only');
  const label={on:'Synced to your account', busy:'Syncing…', err:'Sync failed',
               guest:'Not signed in — saved in this browser', local:'Saved in this browser'};
  d.className='dot'+(SYNC==='on'?' on':(SYNC==='err'?' err':''));
  d.title=label[SYNC]||'';
}

function openAcct(){
  acctMode = ACCT? 'me':'in';
  renderAcct();
  document.getElementById('mAcct').classList.add('on');
  if(acctMode!=='me') setTimeout(()=>{ const i=document.getElementById('au'); if(i) i.focus(); },60);
}
function closeAcct(){ document.getElementById('mAcct').classList.remove('on'); }
function switchAcct(m){ acctMode=m; renderAcct(); }

function renderAcct(){
  const t=document.getElementById('mTitle'), b=document.getElementById('mBody');
  if(!t||!b) return;
  if(acctMode==='me' && ACCT){
    t.textContent='Your account · 我的账号';
    const n=Object.keys(store.h).length;
    b.innerHTML=`
      <div class="who"><div class="av">${(ACCT.display||'?').charAt(0).toUpperCase()}</div>
        <div><div style="font-weight:700">${ACCT.display}</div>
        <div class="muted" style="font-size:12px">${n} records on this device ·
          ${SYNC==='on'?'synced':(SYNC==='err'?'last sync failed':'not synced yet')}<br>
          <span class="zhx">本机 ${n} 条记录 · ${SYNC==='on'?'已同步':(SYNC==='err'?'上次同步失败':'尚未同步')}</span></div></div></div>
      <button class="btn ghost" style="width:100%;margin-bottom:8px"
        onclick="syncNow().then(()=>{renderAcct();toast('Synced · 已同步');})">Sync now <span class="zhx">立即同步</span></button>
      <button class="btn ghost" style="width:100%;color:var(--red)" onclick="doLogout()">Sign out <span class="zhx">退出登录</span></button>
      <p class="mnote">Signing out ends this session but keeps the records on this device.
      Sign in on another device with the same username and the two sets are merged question by question.<br>
      <span class="zhx">退出只结束本次登录，本机记录保留；在另一台设备用同一账号登录后，两边的答题记录会按题目逐条合并。</span></p>`;
    return;
  }
  const up = acctMode==='up';
  t.textContent = up? 'Create an account · 注册' : 'Sign in · 登录';
  b.innerHTML=`
    <div class="mtabs">
      <button class="${up?'':'on'}" onclick="switchAcct('in')">Sign in <span class="zhx">登录</span></button>
      <button class="${up?'on':''}" onclick="switchAcct('up')">Create account <span class="zhx">注册</span></button>
    </div>
    <div class="fld"><label for="au">Username <span class="zhx">用户名</span></label>
      <input id="au" autocomplete="username" placeholder="3–24 characters, letters or digits"
        onkeydown="if(event.key==='Enter')submitAcct()"></div>
    <div class="fld"><label for="ap">Password <span class="zhx">密码</span></label>
      <input id="ap" type="password" autocomplete="${up?'new-password':'current-password'}"
        placeholder="${up?'at least 6 characters':'your password'}"
        onkeydown="if(event.key==='Enter')submitAcct()"></div>
    <div id="mErr"></div>
    <button class="btn pri" id="mGo" style="width:100%;margin-top:2px" onclick="submitAcct()">${up?'Create account':'Sign in'}
      <span class="zhx">${up?'注册':'登录'}</span></button>
    <p class="mnote">${up
      ? 'No email, no verification — a username and a password is all. The '
        +Object.keys(store.h).length+' records already on this device move into the new account.'
      : 'Progress kept in this browser is merged with whatever the account already holds; the newest answer wins per question.'}
      <br><span class="zhx">不需要邮箱验证；本机已有的记录会并入账号，同一道题以最新一次作答为准。</span></p>`;
}

function submitAcct(){
  const u=((document.getElementById('au')||{}).value||'').trim();
  const p=(document.getElementById('ap')||{}).value||'';
  const err=document.getElementById('mErr'), go=document.getElementById('mGo');
  const up = acctMode==='up';
  if(!err||!go) return;
  if(!u||!p){ err.innerHTML='<div class="merr">Fill in both fields.</div>'; return; }
  err.innerHTML=''; go.disabled=true; go.textContent= up?'Creating…':'Signing in…';
  api(up?'api/register':'api/login',{method:'POST',body:JSON.stringify({u:u,p:p})}).then(r=>{
    const reset=()=>{ go.disabled=false; go.textContent= up?'Create account':'Sign in'; };
    if(!r){ err.innerHTML='<div class="merr">No answer from the server. Check your connection.</div>'; reset(); return; }
    if(!r.ok){ err.innerHTML='<div class="merr">'+((r.d&&r.d.error)||'Something went wrong')+'</div>'; reset(); return; }
    ACCT=r.d.user; acctMode='me';
    return syncNow().then(()=>{
      closeAcct(); paintTop(); viewHome();
      toast(up? 'Account created — progress will follow you' : 'Signed in as '+ACCT.display);
    });
  });
}

function doLogout(){
  api('api/logout',{method:'POST'}).then(()=>{
    ACCT=null; setSync(CAN_API?'guest':'local');
    closeAcct(); paintTop(); viewHome(); toast('Signed out');
  });
}

/* ---------- stats ---------- */
function secStat(id){
  const s=SECMAP[id]; let done=0, ok=0;
  for(let i=s.from;i<=s.to;i++){ const r=store.h[i]; if(r){done++; if(r.ok) ok++;} }
  return {done, ok, n:s.n, acc: done? ok/done : 0};
}
function overall(){
  // graded items only: the originals deck is self-marked and must not dilute
  // the accuracy figure the engine steers by
  const ks=Object.keys(store.h).filter(k=>+k<1000); let ok=0;
  ks.forEach(k=>{ if(store.h[k].ok) ok++; });
  return {done:ks.length, ok, acc: ks.length? ok/ks.length : 0};
}
function pqStat(){
  let done=0, ok=0;
  PQ.forEach(p=>{ const r=store.h[p.id]; if(r){done++; if(r.ok) ok++;} });
  return {done, ok, acc: done? ok/done : 0};
}

/* ---------- smart engine ----------
   Round 1 walks every topic once (coverage). After that every topic is scored:
   open mistakes (dominant) + measured weakness + unseen material + forgetting,
   minus a penalty for the topic just served. Inside the winning topic the exact
   item you missed is re-tested before anything new is served. */
const SKIP_TTL = 12*3600*1000;

function skips(){
  const raw=store.skip||{}, now=Date.now(), out={q:{},s:{}};
  ['q','s'].forEach(k=>Object.keys(raw[k]||{}).forEach(key=>{
    if(now-(+raw[k][key]||0) < SKIP_TTL) out[k][key]=+raw[k][key];
  }));
  return out;
}
function addSkip(kind,key){
  store.skip=store.skip||{q:{},s:{}};
  store.skip[kind]=store.skip[kind]||{};
  store.skip[kind][key]=Date.now();
  save();
}
function clearSkips(){
  store.skip={q:{},s:{}}; save();
  toast('Skip list cleared · 跳过记录已清空');
  viewHome(); paintTop();
}
function cycleState(){
  if(!store.cyc || !store.cyc.seen) store.cyc={n:(store.cyc&&store.cyc.n)||1, seen:{}};
  return store.cyc;
}
function cycleInfo(){ const c=cycleState(); return {n:c.n||1, seen:Object.keys(c.seen).length, all:SECS.length}; }
function markCycle(sec){
  const c=cycleState();
  c.seen[sec]=1;
  if(Object.keys(c.seen).length>=SECS.length){ c.n=(c.n||1)+1; c.seen={}; return true; }
  return false;
}

/* one topic measured across both decks */
function diag(id){
  const all=ALLBYSEC[id];
  let done=0, ok=0, miss=0, unseen=0, last=Infinity;
  for(const i of all){
    const r=store.h[i];
    if(!r){ unseen++; continue; }
    done++; if(r.ok) ok++; else miss++;
    if((r.t||0)<last) last=r.t||0;
  }
  return {id, n:all.length, done, ok, miss, unseen,
          acc: done? ok/done : 0, cov: all.length? done/all.length : 0, last: last===Infinity?0:last};
}
function days(t){ return t? Math.min((Date.now()-t)/86400000, 30) : 30; }
function weakness(d){
  let s=0;
  s += 5.0*Math.min(d.miss,3);              // every open mistake outranks everything else
  s += 2.2*(1-d.acc)*Math.min(d.done,4);    // weakness, but only as far as evidence goes
  s += 1.5*(1-d.cov);                       // material never seen still needs covering
  s += 0.7*Math.min(days(d.last)/7,4);      // forgetting: 0-4 weeks
  if(store.lastSec===d.id) s -= 1.2;        // never the same topic twice in a row
  return s;
}
function pickFrom(d, sk){
  const all=ALLBYSEC[d.id], free=i=>!sk.q[i];
  const open=all.filter(i=>store.h[i] && !store.h[i].ok && free(i))
                .sort((a,b)=>(store.h[a].t||0)-(store.h[b].t||0));
  if(open.length) return {id:open[0], kind:'retry'};
  const fresh=all.filter(i=>!store.h[i] && free(i));
  if(fresh.length) return {id:fresh[0], kind:'new'};
  const rest=all.filter(free).sort((a,b)=>((store.h[a]||{}).t||0)-((store.h[b]||{}).t||0));
  return rest.length? {id:rest[0], kind:'stale'} : null;
}
function whyText(d,c){
  const n=d.miss;
  if(c.kind==='retry') return n+' open '+(n===1?'mistake':'mistakes')+' in this topic · 这类还有 '+n+' 道错题没订正';
  if(c.kind==='new') return d.unseen+' item'+(d.unseen===1?'':'s')+' never seen · 这类还有 '+d.unseen+' 道没做过';
  const dd=d.last? Math.max(1,Math.round(days(d.last))) : 0;
  return (dd? 'gone '+dd+' days' : 'not seen yet')+' without practice · 这类'+(dd? '已 '+dd+' 天没练':'还没练过');
}
function pickSmart(){
  const sk=skips();
  let pool=SECS.filter(s=>!sk.s[s.id]);
  if(!pool.length){ store.skip={q:{},s:{}}; save(true); pool=SECS.slice(); }
  const ds=pool.map(s=>diag(s.id));
  // phase 1 — one pass through every topic, syllabus order
  const un=ds.filter(d=>d.done===0);
  for(const d of un){
    const c=pickFrom(d,sk);
    if(c) return {id:c.id, why:whyText(d,c), phase:1, sec:d.id, kind:c.kind};
  }
  // phase 2 — everything ranked, mistakes first
  let best=null, bestSc=-9e9;
  for(const d of ds){
    if(d.done===0) continue;
    const c=pickFrom(d,sk); if(!c) continue;
    const sc=weakness(d);
    if(sc>bestSc){ bestSc=sc; best={d,c}; }
  }
  if(best) return {id:best.c.id, why:whyText(best.d,best.c), phase:2, sec:best.d.id, kind:best.c.kind};
  return null;
}
function untouchedSecs(){ return SECS.filter(s=>diag(s.id).done===0); }

function buildMock(n){
  const pool=[]; const per={};
  SECS.forEach(s=>per[s.id]=[]);
  ITEMS.forEach(q=>per[q.s].push(q.id));
  const ids=Object.keys(per);
  let i=0;
  while(pool.length<n && i<n*30){
    const s=ids[Math.floor(Math.random()*ids.length)];
    if(!per[s].length) { i++; continue; }
    const k=Math.floor(Math.random()*per[s].length);
    pool.push(per[s].splice(k,1)[0]); i++;
  }
  return pool;
}
function wrongQueue(){
  return Object.keys(store.h).filter(k=>!store.h[k].ok).map(Number)
    .sort((a,b)=>(store.h[a].t||0)-(store.h[b].t||0));
}

/* ---------- routing ---------- */
let round={list:[],i:0,mode:'smart',picked:null,done:false,t0:0};
function route(v,arg){ window.scrollTo(0,0);
  const HASHV={home:'#home', ref:'#ref', browse:'#bank', preview:'#preview', fav:'#fav'};
  try{ if(HASHV[v] && location.hash!==HASHV[v]) history.replaceState(null,'',HASHV[v]); }catch(e){}
  if(v==='home') viewHome(); else if(v==='quiz') viewQuiz();
  else if(v==='res') viewRes(); else if(v==='browse') viewBrowse(arg||'all');
  else if(v==='ref') viewRef(arg);
  else if(v==='preview') viewPreview();
  else if(v==='fav') viewFav();
  paintTop();
}
function start(mode){
  let list=[];
  if(mode==='smart'){
    let p=pickSmart();
    if(!p){ store.skip={q:{},s:{}}; save(true); p=pickSmart(); }
    if(!p){ toast('Everything is answered — clearing skips.'); return; }
    list=[p.id];
    store.lastSec=p.sec; save(true);
    round={list, i:0, mode, picked:null, done:false, t0:Date.now(), ok:0, ans:0,
           why:p.why, phase:p.phase, sec:p.sec};
    route('quiz'); return;
  }
  if(mode==='mock') list=buildMock(20);
  else if(mode==='wrong') list=wrongQueue();
  else if(mode==='pq'){ startPq(10); return; }
  if(!list.length){ toast('Nothing to review — all clear.'); return; }
  round={list, i:0, mode, picked:null, done:false, t0:Date.now(), ok:0, ans:0};
  route('quiz');
}
/* skip controls — smart round only. Both are remembered for 12 h so the same
   item or topic is not immediately handed back to you. */
function skipQ(){
  const id=round.list[round.i];
  addSkip('q', id);
  toast('Skipped · 已跳过这题');
  start('smart');
}
function skipSec(){
  const id=round.list[round.i], q=BYID[id], sec=q.s;
  addSkip('s', sec);
  const done=markCycle(sec); save();
  toast('Skipping '+(SECMAP[sec]? SECMAP[sec].en : sec)+' · 暂时跳过这类');
  if(done) toast('Round complete — mistakes go first · 本轮完成，错题优先');
  start('smart');
}
function startPq(n){
  // same weighting as the smart engine: weakest topic first, unseen item first
  const rank = SECS.map(s=>{ const st=secStat(s.id); return {id:s.id, gap: st.done? 1-st.acc : 1.45}; })
                   .filter(r=>PQBYSEC[r.id] && PQBYSEC[r.id].length)
                   .sort((a,b)=>b.gap-a.gap);
  const out=[];
  for(const r of rank){
    const pool = PQBYSEC[r.id].slice().sort((a,b)=> (store.h[a]?1:0)-(store.h[b]?1:0));
    for(const id of pool){ if(out.length<(n||10)) out.push(id); }
    if(out.length>=(n||10)) break;
  }
  if(!out.length){ toast('No originals left in this deck.'); return; }
  round={list:out, i:0, mode:'pq', picked:null, done:false, t0:Date.now()};
  route('quiz');
}
function startTopicPq(id){
  const list=(PQBYSEC[id]||[]).slice().sort((a,b)=>(store.h[a]?1:0)-(store.h[b]?1:0)).slice(0,12);
  if(!list.length){ toast('That topic was never served as a quiz item.'); return; }
  round={list, i:0, mode:'pq', picked:null, done:false, t0:Date.now()};
  route('quiz');
}
function startTopic(id){
  const s=SECMAP[id]; const list=[];
  for(let i=s.from;i<=s.to;i++) list.push(i);
  round={list, i:0, mode:'topic', picked:null, done:false, t0:Date.now(), ok:0, ans:0};
  route('quiz');
}
/* mastery row: the topic as measured — graded items first, then its originals */
function startTopicAll(id){
  const list=(ALLBYSEC[id]||[]).slice()
    .sort((a,b)=>(store.h[a]?1:0)-(store.h[b]?1:0) || (a-b));
  if(!list.length){ toast('Nothing in this topic.'); return; }
  round={list, i:0, mode:'topic', picked:null, done:false, t0:Date.now(), ok:0, ans:0};
  route('quiz');
}

    : (round.i+1) + '/' + round.list.length;

function pick(L){
  if(round.picked!==null) return;
  const q=BYID[round.list[round.i]];
  round.picked=L;
  const ok = L===q.a;
  store.h[q.id]={a:L, ok, t:Date.now()};
  if(ok){ store.streak++; if(store.streak>store.best) store.best=store.streak; }
  else store.streak=0;
  markCycle(q.s);
  save(); viewQuiz(); renderMath();
  const fb = document.querySelector('.fb');
  if(fb && fb.getBoundingClientRect().bottom > innerHeight - 8){
    fb.scrollIntoView({block:'nearest', behavior:'smooth'});
  }
}
function advance(){
  round.i++; round.picked=null;
  if(round.i>=round.list.length) return viewRes();
  viewQuiz(); renderMath();
}

function gradePq(ok){

function paintIdx(){
  const tEl=document.getElementById('idxType'), cEl=document.getElementById('idxCh');
  if(!tEl||!cEl) return;
  tEl.innerHTML=[['all','All <span class="zhx">全部</span> '+UNI.length],
                 ['q','Compiled <span class="zhx">精编</span> '+ITEMS.length],
                 ['p','Originals <span class="zhx">原题</span> '+PQ.length]]
    .map(([k,t])=>`<button class="${browseType===k?'on':''}" onclick="setType('${k}')">${t}</button>`).join('');
  cEl.innerHTML=['<button class="'+(browseCh==='all'?'on':'')+'" onclick="viewBrowse(\'all\')">All chapters <span class="zhx">全部章节</span></button>']
    .concat(CHS.map((c,i)=>`<button class="${browseCh==i?'on':''}" onclick="viewBrowse(${i})">Ch ${i+1}</button>`)).join('');

  const box=document.getElementById('idxQ');
  const raw=box? (box._v!==undefined? box._v : box.value) : '';
  const q=raw.trim().toLowerCase();
  const num=q.match(/^([qp]?)\s*0*(\d{1,3})$/);
  const list=UNI.filter(it=>{
    if(browseCh!=='all' && it.c!==browseCh) return false;
    if(browseType==='q' && it.p) return false;
    if(browseType==='p' && !it.p) return false;
    if(!q) return true;
    if(num){
      const pre=num[1], n=Number(num[2]);
      if(pre==='q' && it.p) return false;
      if(pre==='p' && !it.p) return false;
      return Number(it.lb.slice(1))===n;
    }
    return it.s.indexOf(q)===0;
  });

  let ok=0, seen=0;
  const cells=list.map(it=>{
    const r=store.h[it.id]; if(r){seen++; if(r.ok) ok++;}
    const st=r?(r.ok?'ok':'bad'):'new';
    const sec=SECMAP[it.s];
    return `<button class="idx-b ${st}${it.p?' p':''}${isFav(it.id)?' fav':''}" onclick="startSingle(${it.id})"
      title="${it.lb} · ${it.s}${sec? ' · '+sec.en+' · '+sec.zh : ''}"><b>${it.lb}</b><i>${it.s}</i>${r?(r.ok?'<u>✓</u>':'<u>✕</u>'):''}</button>`;
  }).join('');
  const meta=document.getElementById('idxMeta'), grid=document.getElementById('idxGrid');
  meta.textContent=list.length
    ? `${list.length} item${list.length===1?'':'s'} · ${seen} attempted · ${ok} correct ／ 共 ${list.length} 题，已做 ${seen}，正确 ${ok}`
    : 'Nothing matches that filter. ／ 没有匹配的题目。';
  grid.innerHTML=cells || '<p class="muted" style="padding:8px 0;grid-column:1/-1">No item in this slice.</p>';
}

/* ---------- preview / favourites board ----------
   Pure browsing: answers are shown immediately; nothing is answered or scored.
   viewFav reuses the same renderer with the data source limited to starred ids. */
let pvType='all', pvCh='all', pvQ='', pvPage=0, pvScope='all', pvMode='preview';
const PV_PER=6;
function pvEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;')
  .replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function pvMatch(it, q){
  if(!q) return true;
  const num=q.match(/^([qp]?)\s*0*(\d{1,3})$/);
  if(num){
    const pre=num[1], n=Number(num[2]);
    if(pre==='q' && it.p) return false;
    if(pre==='p' && !it.p) return false;
    return Number(it.lb.slice(1))===n;
  }
  if(it.s.indexOf(q)===0) return true;                     // topic id, e.g. 2.5
  const sec=SECMAP[it.s];
  if(sec && (sec.en.toLowerCase().indexOf(q)>=0 || sec.zh.indexOf(q)>=0)) return true;
  return it.lb.toLowerCase().indexOf(q)>=0;                // Q12 / P7 fallback
}
function pvList(){
  const q=(pvQ||'').trim().toLowerCase();
  return UNI.filter(it=>{
    if(pvCh!=='all' && it.c!==pvCh) return false;
    if(pvScope==='fav' && !isFav(it.id)) return false;
    if(pvType==='q' && it.p) return false;
    if(pvType==='p' && !it.p) return false;
    if(pvScope==='all' && pvType==='fav' && !isFav(it.id)) return false;
    return pvMatch(it, q);
  });
}
function pvSetType(k){ pvType=k; pvPage=0; renderPv(pvMode); }
function pvSetCh(c){ pvCh=c; pvPage=0; renderPv(pvMode); }

  const list=pvList(), idx=list.findIndex(x=>x.id===id);
  if(idx<0) return;
  pvPage=Math.floor(idx/PV_PER); pvPaint();

  const isP=q.pq===1;
  const badge=isP? 'P'+q.p : 'Q'+q.id;
  const done=rec? (rec.ok? '<span class="pv-done ok">✓ Done · 已做对</span>'
                        : '<span class="pv-done bad">✕ Missed · 做错过</span>')
                : '<span class="pv-done">Not tried · 未做</span>';
  let qimg, ans;
  if(isP){
    const p=String(q.p).padStart(3,'0');
    qimg=`<img src="pq/p${p}_q.jpg" alt="Question ${p}" loading="lazy">`;
    ans=`<div class="pv-note">Self-marked · 原题无标准选项，答案取自原卷打印行
        <span class="tz">printed answer, not a reconstructed letter · 答案取自原卷打印行，非反推的选项字母</span></div>
      <div class="pv-ans">Answer · 打印答案行 <span class="tz">答案以下图为准</span></div>
      <div class="pv-aimg"><a href="pq/p${p}_a.jpg" target="_blank" title="Open full size">
        <img src="pq/p${p}_a.jpg" alt="Printed answer" loading="lazy"></a></div>
      <details class="pv-det"><summary>Printed solution 打印解答 <span class="tz">展开查看</span></summary>
        <div class="pv-simg"><a href="pq/p${p}_s.jpg" target="_blank" title="Open full size">
          <img src="pq/p${p}_s.jpg" alt="Printed solution" loading="lazy"></a></div>
      </details>`;
  } else {
    const n=String(q.id).padStart(3,'0');
    qimg=`<img src="q/q${n}.png" alt="Question ${q.id}" loading="lazy">`;
    ans=`<div class="pv-ans">Answer: <b>${q.a}</b> <span class="tz">答案</span></div>
      <details class="pv-det"><summary>Solution 解析 <span class="tz">展开查看</span></summary>
        <div class="sol">
          <div class="col"><div class="lb">Solution</div>${q.en}</div>
          <div class="col zh"><div class="lb">中文解析</div>${q.zh}</div>
          ${q.focus? `<div class="col"><div class="lb">Focus 考点</div>${q.focus}</div>`:''}
          ${q.trap? `<div class="col"><div class="lb">Trap 易错点</div>${q.trap}</div>`:''}
        </div>
      </details>`;
  }
  return `<article class="pv-card" data-id="${id}" id="pv${id}">
    <div class="pv-hd">
      <span class="qno${isP?' pq':''}">${badge}</span>
      <span class="pv-sec" title="${q.s} · ${sec.en} · ${sec.zh}">${q.s} · ${sec.en}<span class="tz"> ${sec.zh}</span></span>
      ${starBtn(id)}
      ${done}
    </div>
    <div class="pv-img">${qimg}</div>
    ${ans}
    <div class="pv-ft">
      <button class="btn ghost" onclick="startSingle(${id})">Practice this <span class="zhx">做这题</span></button>
      ${favBtn(id)}
    </div>
  </article>`;
}

function pvPaint(){
  const g=document.getElementById('pvGrid'), c=document.getElementById('pvCards');
  if(!g||!c) return;
  const list=pvList();
  const pages=Math.max(1,Math.ceil(list.length/PV_PER));
  if(pvPage>=pages) pvPage=pages-1;
  if(pvPage<0) pvPage=0;
  const page=list.slice(pvPage*PV_PER,(pvPage+1)*PV_PER);
  g.innerHTML=list.map(it=>{
    const r=store.h[it.id], st=r?(r.ok?'ok':'bad'):'new';
    return `<button class="idx-b ${st}${it.p?' p':''}${isFav(it.id)?' fav':''}" onclick="pvGo(${it.id})"
      title="${it.lb} · ${it.s}"><b>${it.lb}</b><i>${it.s}</i>${r?(r.ok?'<u>✓</u>':'<u>✕</u>'):''}</button>`;
  }).join('') || '<p class="muted" style="grid-column:1/-1">No item in this slice.</p>';
  c.innerHTML=list.length? page.map(it=>previewCard(it.id)).join('')
    : `<div class="card pv-empty">
        <div style="font-size:30px">☆</div>
        <h3 style="margin:8px 0 4px">${pvScope==='fav'? 'No favourites yet' : 'Nothing matches'}</h3>
        <p class="muted">${pvScope==='fav'
          ? 'Tap the ★ on any question to keep it here — answers are shown straight away.'
          : 'Try another type, chapter or search term.'}</p>
        <p class="muted"><span class="zhx">${pvScope==='fav'
          ? '在任何题上点 ★ 即可加入收藏夹，这里会直接显示答案。' : '换个类型、章节或关键词试试。'}</span></p>
        <button class="btn ghost" style="margin-top:10px" onclick="route('browse')">Browse the bank <span class="zhx">去题库</span></button>
      </div>`;
  const meta=document.getElementById('pvMeta');
  if(meta) meta.textContent=list.length
    ? `${list.length} item${list.length===1?'':'s'} · page ${pvPage+1}/${pages} ／ 共 ${list.length} 题，第 ${pvPage+1}/${pages} 页`
    : '0 items ／ 共 0 题';
  const pager=document.getElementById('pvPager');
  if(pager) pager.innerHTML=`
    <button class="btn ghost" ${pvPage<=0?'disabled':''} onclick="pvPageGo(${pvPage-1})">&larr; Prev <span class="zhx">上一页</span></button>
    <span class="muted">Page ${pvPage+1} / ${pages}</span>
    <button class="btn ghost" ${pvPage>=pages-1?'disabled':''} onclick="pvPageGo(${pvPage+1})">Next <span class="zhx">下一页</span> &rarr;</button>`;
  renderMath();
}

function renderPv(mode){
  pvMode=mode; pvScope= mode==='fav'? 'fav':'all';
  if(pvScope==='fav' && pvType==='fav') pvType='all';
  const favOnly=pvScope==='fav';
  const types = favOnly
    ? [['all','All favourites <span class="zhx">全部收藏</span> '+favCount()],
       ['q','Compiled <span class="zhx">精编</span>'],
       ['p','Originals <span class="zhx">原题</span>']]
    : [['all','All <span class="zhx">全部</span> '+UNI.length],
       ['q','Compiled <span class="zhx">精编</span> '+ITEMS.length],
       ['p','Originals <span class="zhx">原题</span> '+PQ.length],
       ['fav','★ Favourites <span class="zhx">收藏</span> '+favCount()]];
  const typeHtml=types.map(([k,t])=>`<button class="${pvType===k?'on':''}" onclick="pvSetType('${k}')">${t}</button>`).join('');
  const chHtml=['<button class="'+(pvCh==='all'?'on':'')+'" onclick="pvSetCh(\'all\')">All chapters <span class="zhx">全部章节</span></button>']
    .concat(CHS.map((c,i)=>`<button class="${pvCh===i?'on':''}" onclick="pvSetCh(${i})">Ch ${i+1}</button>`)).join('');
  const tools = favOnly
    ? `<div class="pv-tools">
        <span class="chip">★ <b data-fav-count>${favCount()}</b> starred <span class="zhx">已收藏</span></span>
        ${favCount()? '<button class="btn ghost" onclick="clearFav()">Clear all <span class="zhx">清空</span></button>':''}
        <button class="btn ghost" onclick="route('preview')">Full preview <span class="zhx">题库速览</span></button>
      </div>`
    : '';
  document.getElementById('view').innerHTML=`
  <div class="wrap pv-wrap">
    <div class="pv-hd2">
      <h2>${favOnly? 'Favourites <span class="tz">收藏夹</span>' : 'Preview <span class="tz">题库速览</span>'}</h2>
      <span class="muted">${favOnly? 'Your starred items · 只看收藏题'
        : 'Answers shown immediately — no answering, no scoring'}</span>
    </div>
    <p class="pv-sub">Answers shown immediately — no answering, no scoring · 直接看题与答案，不记分</p>
    ${tools}
    <div class="card" style="padding:14px 16px">
      <div class="filter" id="pvType">${typeHtml}</div>
      <div class="filter" id="pvCh">${chHtml}</div>
      <div class="idxsearch"><input id="pvQ" value="${pvEsc(pvQ)}"
        placeholder="Find 12 / Q12 / P7 / 2.5 / a topic name · 搜题号、考点或名称"
        oninput="pvSetQ(this.value)"></div>
      <div class="pv-count" id="pvMeta"></div>
      <div class="idxgrid pv-grid" id="pvGrid"></div>
    </div>
    <div class="pv-cards" id="pvCards"></div>
    <div class="pv-pager" id="pvPager"></div>
    <div style="margin:6px 0 40px"><button class="btn ghost" onclick="route('home')">Back <span class="zhx">返回</span></button></div>
  </div>`;
  pvPaint();
  paintTop();
}

function viewPreview(){ pvPage=0; renderPv('preview'); }
function viewFav(){ pvPage=0; renderPv('fav'); }

/* math render */
function renderMath(){
  if(window.renderMathInElement){
    renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}],throwOnError:false,strict:false});
  }
}
const _route=route;
route=function(v,a){ _route(v,a); renderMath(); };

document.addEventListener('keydown',e=>{
  if(e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  const L=['a','b','c','d','e'], k=e.key.toLowerCase();
  if(k==='f'){
    const m=document.getElementById('mAcct');
    if(m && m.classList.contains('on')) return;
    const id=currentFavId();
    if(id!=null){ e.preventDefault(); toggleFav(id); }
    return;
  }
  const solo = round.mode==='smart' && round.list.length===1;
  if(L.includes(k)){ const b=[...document.querySelectorAll('.opt')][L.indexOf(k)];
    if(b&&!b.disabled) b.click(); }
  if(solo && k==='s'){ skipQ(); return; }
  if(solo && k==='t'){ skipSec(); return; }
  if(e.key==='Enter'){ const n=[...document.querySelectorAll('.btn.pri')].pop(); if(n) n.click(); }
});
/* Deep links survive a reload. replaceState never fires hashchange, so the
   listener below cannot recurse; quiz/res are deliberately not in the map. */
const HASHROUTE={'#home':'home','#ref':'ref','#bank':'browse','#preview':'preview','#fav':'fav'};
window.addEventListener('hashchange',()=>{ const v=HASHROUTE[location.hash]; if(v) route(v); });
paintTop(); viewHome(); renderMath();
if(location.hash==='#pq') start('pq');
else if(location.hash==='#ref') route('ref');
else if(location.hash==='#bank') route('browse');
else if(location.hash==='#preview') route('preview');
else if(location.hash==='#fav') route('fav');
bootAcct().then(()=>paintTop());
</script>
