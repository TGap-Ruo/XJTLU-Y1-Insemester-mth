<script>
/* ============================================================================
   MTH028 single page app.
   One unified data model: window.MTH028_BANK.items is the ONLY question array.
   `type` ("choice" | "fill" | "cloze") distinguishes the three kinds of item.
   Nothing here hardcodes a number of items / topics / chapters, nor an id range:
   adding questions or topics only requires editing bank.js.
   Works in a browser AND under a mock DOM in Node (for smoke tests).
   ========================================================================== */
(function(){
'use strict';

var G = (typeof window !== 'undefined') ? window : globalThis;
var HAS_DOM = (typeof document !== 'undefined' && !!document.getElementById);

/* ---------- small helpers ---------- */
function escHtml(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return escHtml(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function num(s){ var n=Number(s); return Number.isFinite(n)? n : null; }

/* ---------- bank normalisation (fully defensive) ---------- */
function defaultBank(){
  return {meta:{course:'MTH028',en:'Linear Algebra I',zh:'线性代数（一）',version:1},
          chapters:[],topics:[],items:[],glossary:{groups:[]}};
}
function normTopic(t,i){
  t=t||{};
  var id=String(t.id!=null? t.id : ('t'+i));
  var ch=t.ch;
  if(typeof ch!=='number'){
    var m=id.match(/^(\d+)/);
    ch=m? (parseInt(m[1],10)-1) : 0;
  }
  return {id:id, ch:ch, en:t.en||'', zh:t.zh||'',
    focus:t.focus||'', focus_zh:t.focus_zh||'',
    steps:Array.isArray(t.steps)? t.steps : [],
    note:t.note||'', trap:t.trap||'', trap_zh:t.trap_zh||'',
    slides:t.slides||null, has_slides:!!(t.has_slides||t.slides),
    question_hint:t.question_hint||''};
}
function normItem(it,i){
  it=it||{};
  var id=(typeof it.id==='number')? it.id : (1000+i+1);
  var type=(it.type==='choice'||it.type==='cloze'||it.type==='fill')? it.type : 'fill';
  var blanks=(type==='choice')? 0 : (typeof it.blanks==='number' && it.blanks>0? it.blanks : 1);
  var options=(type==='choice')
    ? (Array.isArray(it.options)&&it.options.length? it.options : ['A','B','C','D'])
    : undefined;
  return {
    id:id, label:String(it.label!=null? it.label : ('Q'+id)),
    qid:String(it.qid!=null? it.qid : id),
    quiz:(it.quiz==null? null : it.quiz), qno:(it.qno==null? null : it.qno),
    type:type, blanks:blanks,
    topic:(it.topic==null? null : String(it.topic)),
    chapter:(typeof it.chapter==='number'? it.chapter : null),
    img:it.img||'', answerImg:it.answerImg||null,
    key:(it.key==null? null : String(it.key).toUpperCase()),
    keyConfidence:it.keyConfidence||'none',
    answers:(Array.isArray(it.answers)? it.answers : null),
    answerText:(it.answerText==null? null : String(it.answerText)),
    answerSource:it.answerSource||'none',
    aiGenerated:!!it.aiGenerated,
    options:options, stem:it.stem||'', notes:it.notes||'',
    /* the template this record is a re-drawn copy of, or null for the
       template itself (see MAIN below) */
    variantOf:(it.variantOf==null? null : String(it.variantOf)),
    /* secondary index: "1.1.2" + the source label the number used to be */
    sub:(it.sub==null? null : String(it.sub)),
    src:(it.src==null? null : String(it.src))
  };
}
function normGlossGroup(g,i){
  g=g||{};
  var items=Array.isArray(g.items)? g.items.map(function(row){
    if(Array.isArray(row)) return [String(row[0]||''),String(row[1]||''),String(row[2]||'')];
    return [String(row||''),'',''];
  }) : [];
  return {id:String(g.id!=null? g.id : ('g'+i)), en:g.en||'', zh:g.zh||'', items:items};
}
function normaliseBank(b){
  b=b||{};
  var meta=Object.assign({course:'MTH028',en:'Linear Algebra I',zh:'线性代数（一）',version:1}, b.meta||{});
  var chapters=(Array.isArray(b.chapters)? b.chapters : []).map(function(c,i){
    c=c||{}; return {n:String(c.n!=null? c.n : (i+1)), en:c.en||'', zh:c.zh||''};
  });
  var topics=(Array.isArray(b.topics)? b.topics : []).map(normTopic);
  if(!chapters.length){
    var maxCh=-1; topics.forEach(function(t){ if(t.ch>maxCh) maxCh=t.ch; });
    for(var i=0;i<=maxCh;i++) chapters.push({n:String(i+1),en:'Chapter '+(i+1),zh:'第 '+(i+1)+' 章'});
  }
  var items=(Array.isArray(b.items)? b.items : []).map(normItem);
  /* the secondary index is data, not code: it must survive normalisation or
     every item's `sub` becomes an orphan id */
  var subtopics=(Array.isArray(b.subtopics)? b.subtopics : []).map(function(x,i){
    x=x||{}; return {id:String(x.id!=null? x.id : ('s'+i)), topic:String(x.topic!=null? x.topic : ''),
                     zh:x.zh||'', en:x.en||'', src:x.src||''};
  });
  var groups=((b.glossary && Array.isArray(b.glossary.groups))? b.glossary.groups : []).map(normGlossGroup);
  return {meta:meta, chapters:chapters, topics:topics, subtopics:subtopics,
          items:items, glossary:{groups:groups}};
}

var BANK   = normaliseBank(G.MTH028_BANK || defaultBank());
var META   = BANK.meta, CHAPTERS = BANK.chapters, TOPICS = BANK.topics;
var ITEMS  = BANK.items, GLOSS = BANK.glossary.groups;
var BYID={}, TOPICMAP={};
ITEMS.forEach(function(it){ BYID[it.id]=it; });
TOPICS.forEach(function(t){ TOPICMAP[t.id]=t; });
/* MAIN = one record per question template.  Moodle re-draws the numbers for
   every attempt, so the same question arrives many times with different
   values; those copies ship with `variantOf` pointing at the template's
   representative and are folded under it on the card.  Everything that counts,
   lists or schedules questions walks MAIN, so the bank is "285 questions"
   while 675 records stay practiceable. */
var MAIN = ITEMS.filter(function(it){ return !it.variantOf; });
var ISMAIN={}; MAIN.forEach(function(it){ ISMAIN[it.id]=1; });
var BYQID={}; ITEMS.forEach(function(it){ BYQID[it.qid]=it; });
var VARIANTS={}, REP_OF={};
MAIN.forEach(function(it){ VARIANTS[it.qid]=[]; });
ITEMS.forEach(function(it){
  if(it.variantOf && VARIANTS[it.variantOf]) VARIANTS[it.variantOf].push(it.id);
  if(it.variantOf && BYQID[it.variantOf]) REP_OF[it.id]=BYQID[it.variantOf];
});
/* ---------- secondary index (二级目录) ----------
   bank.subtopics comes from the midterm handout: 26 考点 nested under the 17
   textbook sections.  SUBSOF[topic] keeps them in handout order, BYSUB counts
   the questions each one holds (MAIN only — a variant is practice of the same
   cell, not another number in it). */
var SUBTOPICS = (BANK.subtopics || []);
var SUBMAP={}, SUBSOF={}, BYSUB={};
SUBTOPICS.forEach(function(x){
  SUBMAP[x.id]=x;
  (SUBSOF[x.topic]=SUBSOF[x.topic]||[]).push(x.id);
});
MAIN.forEach(function(it){ if(it.sub){ (BYSUB[it.sub]=BYSUB[it.sub]||[]).push(it.id); } });
/* One group per 二级考点.  This is the unit the smart round walks: a section
   with two sub-topics (1.1.1 / 1.1.2) therefore contributes two questions per
   round instead of one.  Empty sub-topics are dropped (nothing to pick). */
var SUBGROUPS = SUBTOPICS.filter(function(x){ return (BYSUB[x.id]||[]).length; })
  .map(function(x){
    var t=TOPICMAP[x.topic]||{};
    return {id:x.id, en:x.en||'', zh:x.zh||'', topic:x.topic, ch:t.ch, ids:BYSUB[x.id]};
  });
function subInfo(id){ return SUBMAP[id] || {id:id||'',zh:'',en:''}; }
function subsWithItems(topic){
  return (SUBSOF[topic]||[]).filter(function(id){ return (BYSUB[id]||[]).length; });
}
function subTagHtml(it,cls){
  if(!it || !it.sub) return '';
  var x=subInfo(it.sub);
  return '<span class="qsub'+(cls?' '+cls:'')+'" title="'+escAttr(x.id+' · '+(x.zh||'')+' · '+(x.en||''))+'">'
    +escHtml(x.id)+' '+escHtml(x.zh||x.en||'')+'</span>';
}
function topicInfo(id){
  if(id!=null && TOPICMAP[id]) return TOPICMAP[id];
  return {id:null,en:'Unsorted',zh:'未归类',ch:null,focus:'',steps:[],note:'',trap:''};
}
function itemChapter(it){
  if(typeof it.chapter==='number') return it.chapter;
  var t=it.topic? TOPICMAP[it.topic]:null;
  return t? t.ch : null;
}
function typeNameOf(it){
  return it.type==='choice'? 'Choice 选择题' : (it.type==='fill'? 'Fill 填空题':'Cloze 多空题');
}
/* ---------- BYTOPIC: the ONE source of truth for topic -> item ids ----------
   MTH028 ids are quiz*1000+qno: NOT contiguous, and items of one topic are not
   consecutive.  So there is deliberately NO from/to range model (MTH026 used
   `for(i=s.from;i<=s.to;i++)`).  Everything — secStat/diag, mastery bars,
   pickSmart, untouched topics — walks BYTOPIC[sectionId] instead.
   Every section id in bank.topics gets a bucket, including EMPTY ones (those
   must still be rendered on Home + Reference, never skipped).  Items whose
   topic is null / unknown go into a synthetic bucket so no item is unreachable.
   Chapters / topics / item counts are all derived from bank.js, never hardcoded. */
var BYTOPIC={};
TOPICS.forEach(function(t){ BYTOPIC[t.id]=[]; });
BYTOPIC['__untagged__']=[];
MAIN.forEach(function(it){
  var k=(it.topic!=null && BYTOPIC[it.topic])? it.topic : '__untagged__';
  BYTOPIC[k].push(it.id);
});
var GROUPS=TOPICS.map(function(t){
  return {id:t.id,en:t.en,zh:t.zh,ch:t.ch,ids:BYTOPIC[t.id],real:true};
}).concat([{id:'__untagged__',en:'Unsorted items',zh:'未归类题目',ch:null,
            ids:BYTOPIC['__untagged__'],real:false}]);
var GROUP_BY_ID={}; GROUPS.forEach(function(g){ GROUP_BY_ID[g.id]=g; });

/* ---------- answer normalisation + grading (pure, testable) ---------- */
/* Ignore spaces / case / fullwidth parens & minus / trailing punctuation;
   support numeric tolerance and simple fractions. */
function normAns(s){
  if(s==null) return '';
  var t=String(s);
  t=t.replace(/[\uFF01-\uFF5E]/g,function(ch){ return String.fromCharCode(ch.charCodeAt(0)-0xFEE0); });
  t=t.replace(/[\u2212\u2013\u2014]/g,'-');           // unicode minus / dashes
  t=t.replace(/[（）]/g,function(m){ return m==='（'?'(':')'; });
  t=t.replace(/[［］]/g,function(m){ return m==='［'?'[':']'; });
  t=t.replace(/[｛｝]/g,function(m){ return m==='｛'?'{':'}'; });
  t=t.toLowerCase();
  t=t.replace(/\s+/g,'');
  t=t.replace(/[.,;:!?。；，、]+$/g,'');
  t=t.replace(/^\+/,'');
  return t;
}
function fracVal(s){
  var m=s.match(/^\s*(-?\d+(?:\.\d+)?)\s*\/\s*(-?\d+(?:\.\d+)?)\s*$/);
  if(!m || (+m[2])===0) return null;
  return (+m[1])/(+m[2]);
}
function ansEqual(a,b){
  var x=normAns(a), y=normAns(b);
  if(x===y) return true;
  if(x===''||y==='') return false;
  var nx=parseFloat(x.replace(/,/g,'')), ny=parseFloat(y.replace(/,/g,''));
  if(Number.isFinite(nx)&&Number.isFinite(ny)){
    var tol=Math.max(1e-6, Math.abs(ny)*1e-4);
    if(Math.abs(nx-ny)<=tol) return true;
  }
  var fx=fracVal(x), fy=fracVal(y);
  if(fx!=null && fy!=null && Math.abs(fx-fy)<1e-6) return true;
  if(fx!=null && Number.isFinite(ny) && Math.abs(fx-ny)<1e-6) return true;
  if(fy!=null && Number.isFinite(nx) && Math.abs(fy-nx)<1e-6) return true;
  return false;
}
/* returns true when the item carries a reliable machine-gradable answer */
function autoGradeable(it){
  if(!it) return false;
  if(it.type==='choice') return it.key!=null && it.key!=='';
  return Array.isArray(it.answers) && it.answers.length>0;
}
function gradeChoice(it,picked){
  if(!autoGradeable(it)) return null;         // key===null -> self assessment
  var ok=(String(picked).toUpperCase()===(it.key||'').toUpperCase());
  return {ok:ok, per:[ok], nCorrect:ok?1:0, nTotal:1};
}
function gradeFill(it,val){
  if(!autoGradeable(it)) return null;
  var ok=ansEqual(val, it.answers[0]);
  return {ok:ok, per:[ok], nCorrect:ok?1:0, nTotal:1};
}
function gradeCloze(it,vals){
  if(!autoGradeable(it)) return null;
  var exps=it.answers||[], n=Math.min(exps.length, vals.length, it.blanks||exps.length);
  var per=[], nCorrect=0;
  for(var k=0;k<n;k++){ var good=ansEqual(vals[k],exps[k]); per.push(good); if(good)nCorrect++; }
  return {ok:(n>0 && per.every(Boolean)), per:per, nCorrect:nCorrect, nTotal:n};
}

/* ---------- persistence: two-layer store ---------- */
/* store.h[id]  = latest attempt (drives green/red + accuracy)
   store.miss[id] = append-only mistake archive (a wrong attempt writes a row;
   correcting only flips rep=true, it never deletes the row) */
var LS='mth028.en.v1';
var _memLS={};
var LS_DRIVER=(typeof localStorage!=='undefined')? localStorage : {
  getItem:function(k){ return (k in _memLS)? _memLS[k] : null; },
  setItem:function(k,v){ _memLS[k]=String(v); },
  removeItem:function(k){ delete _memLS[k]; }
};
function emptyStore(){ return {h:{}, fav:{}, miss:{}, streak:0, best:0}; }
function normFav(f){
  var out={};
  Object.keys(f||{}).forEach(function(k){
    var key=String(Number(k));
    if(!/^\d+$/.test(key) || !(+key>0)) return;
    var raw=f[k];
    if(typeof raw==='boolean'||raw==null) return;
    var v=+raw;
    if(!Number.isFinite(v)||v===0||Math.abs(v)>1e14) return;
    out[key]=v;
  });
  return out;
}
function normMiss(m){
  var out={};
  if(m && typeof m==='object'){
    Object.keys(m).forEach(function(k){
      var key=String(Number(k));
      if(!/^\d+$/.test(key)) return;
      var v=m[k]||{};
      out[key]={n:Math.max(0,Math.min(999,parseInt(v.n,10)||0)),
        first:+v.first||0, last:+v.last||0, rep:!!v.rep, repAt:+v.repAt||0};
    });
  }
  return out;
}
function backfillMiss(s){
  s.miss=s.miss||{};
  Object.keys(s.h||{}).forEach(function(k){
    var r=s.h[k]||{};
    if(!r.ok && !r.self && !s.miss[k]) s.miss[k]={n:1,first:r.t||0,last:r.t||0,rep:false,repAt:0};
  });
}
function loadBucket(key){
  var s=emptyStore();
  try{ var raw=LS_DRIVER.getItem(key); if(raw) s=Object.assign(s,JSON.parse(raw)); }catch(e){}
  s.fav=normFav(s.fav); s.miss=normMiss(s.miss); backfillMiss(s);
  return s;
}
function logMiss(id,ok){
  if(!store.miss) store.miss={};
  var now=Date.now();
  if(!ok){
    var m=store.miss[id]||{n:0,first:now,last:now,rep:false,repAt:0};
    m.n=(m.n||0)+1; m.last=now; m.rep=false;
    store.miss[id]=m;
  } else if(store.miss[id]){
    store.miss[id].rep=true; store.miss[id].repAt=now;
  }
}
var curOwner=null, curView='home';
function lsKey(){ return curOwner===null? LS : LS+'@'+curOwner; }
function hasRecords(s){ return Object.keys((s&&s.h)||{}).length>0 || Object.keys((s&&s.fav)||{}).length>0; }
var store=loadBucket(LS);
function save(quiet){
  try{ LS_DRIVER.setItem(lsKey(),JSON.stringify(store)); }catch(e){}
  if(!quiet) schedulePush();
}
/* "已订正 / repaired" is authoritative in the append-only archive (miss.rep);
   store.h.ok is the fallback that keeps older buckets consistent.  The live
   h record still decides the green/red colour and the accuracy figure. */
function repaired(id){
  var m=(store.miss||{})[id];
  if(m&&m.rep) return true;
  return !!(store.h[id]&&store.h[id].ok);
}
function mistakeBook(){
  var M=store.miss||{};
  return Object.keys(M).map(Number).filter(function(id){ return !!BYID[id]; }).sort(function(a,b){
    var oa=!repaired(a), ob=!repaired(b);
    if(oa!==ob) return oa? -1:1;                 // open first
    return (M[a].last||0)-(M[b].last||0);
  });
}
function overall(){
  var done=0,ok=0,selfDone=0;
  Object.keys(store.h).forEach(function(k){
    var r=store.h[k];
    if(!ISMAIN[k]) return;              /* variants are extras, not the track */
    if(r.self){ selfDone++; return; }
    done++; if(r.ok) ok++;
  });
  return {done:done,ok:ok,selfDone:selfDone,answered:done+selfDone,acc:done? ok/done:0};
}
function isFav(id){ return (+((store.fav||{})[id])||0)>0; }
function favCount(){ return Object.keys(store.fav||{}).filter(function(k){ return isFav(k); }).length; }

/* ---------- account + cloud sync (MTH028 progress is independent) ---------- */
var PROGRESS_API='api/progress28';
var CAN_API=(typeof location!=='undefined') && (location.protocol==='http:'||location.protocol==='https:');
var ACCT=null, SYNC=CAN_API?'guest':'local', acctMode='in', pushTimer=null;
function api(path,opts){
  opts=opts||{}; opts.credentials='same-origin';
  opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  return fetch(path,opts)
    .then(function(r){ return r.json().catch(function(){ return {}; })
      .then(function(d){ return {ok:r.ok,status:r.status,d:d||{}}; }); })
    .catch(function(){ return null; });
}
/* merge rule (identical to MTH026): h by newest t, fav by largest abs value,
   miss union keep the stronger row, streak/best by max. */
function mergeInto(dst,src){
  var h=(src&&src.h)||{};
  Object.keys(h).forEach(function(k){
    var a=dst.h[k], b=h[k]||{};
    if(!a || (+b.t||0)>=(+a.t||0)) dst.h[k]=b;
  });
  dst.fav=dst.fav||{};
  var f=(src&&src.fav)||{};
  Object.keys(f).forEach(function(k){
    var a=+(dst.fav[k])||0, b=+(f[k])||0;
    if(Math.abs(b)>=Math.abs(a)) dst.fav[k]=b;
  });
  dst.streak=Math.max(+dst.streak||0,+((src||{}).streak)||0);
  dst.best=Math.max(+dst.best||0,+((src||{}).best)||0);
  dst.miss=dst.miss||{};
  var sm=normMiss((src||{}).miss);
  Object.keys(sm).forEach(function(k){
    var a=dst.miss[k]||{}, b=sm[k];
    dst.miss[k]={n:Math.max(a.n||0,b.n||0),
      first:Math.min(a.first||b.first||0,b.first||0),
      last:Math.max(a.last||0,b.last||0),
      rep:!!(a.rep||b.rep), repAt:Math.max(a.repAt||0,b.repAt||0)};
  });
}
function switchOwner(name){
  if(pushTimer){ clearTimeout(pushTimer); pushTimer=null; }
  if(curOwner===name) return;
  if(curOwner===null){
    var guest=loadBucket(LS), acctKey=LS+'@'+name;
    if(hasRecords(guest)){
      var acct=loadBucket(acctKey); mergeInto(acct,guest);
      try{ LS_DRIVER.setItem(acctKey,JSON.stringify(acct)); }catch(e){}
      try{ LS_DRIVER.removeItem(LS); }catch(e){}
    }

/* ---------- smart engine ---------- */
var SKIP_TTL=12*3600*1000, REPAIR_RECALL_MS=2*86400000;
function days(t){ return t? Math.min((Date.now()-t)/86400000,30):30; }
function skips(){
  var raw=store.skip||{}, now=Date.now(), out={q:{},s:{}};
  ['q','s'].forEach(function(k){ Object.keys(raw[k]||{}).forEach(function(key){
    if(now-(+raw[k][key]||0)<SKIP_TTL) out[k][key]=+raw[k][key];
  }); });
  return out;
}
function addSkip(kind,key){
  store.skip=store.skip||{q:{},s:{}}; store.skip[kind]=store.skip[kind]||{};
  store.skip[kind][key]=Date.now(); save();
}
function clearSkips(){ store.skip={q:{},s:{}}; save(); viewHome(); paintTop(); }
function cycleState(){
  if(!store.cyc||!store.cyc.seen) store.cyc={n:(store.cyc&&store.cyc.n)||1,seen:{}};
  /* The round used to be keyed by section (1.1); it is keyed by 考点 (1.1.1)
     now.  Drop the stale one-dot keys, otherwise a returning user starts a
     25-group round already 12 groups "seen".  Idempotent: no flag needed, a
     sub-topic key always has three parts. */
  var stale=false;
  Object.keys(store.cyc.seen).forEach(function(k){ if(String(k).split('.').length<3) stale=true; });
  if(stale){
    var keep={};
    Object.keys(store.cyc.seen).forEach(function(k){ if(String(k).split('.').length>=3) keep[k]=1; });
    store.cyc.seen=keep;
  }
  return store.cyc;
}
function activeGroupCount(){
  // 25 sub-topics rather than 12 sections: a section split into two 考点 counts
  // twice, which is what makes one round cover the whole bank properly
  return Math.max(1, SUBGROUPS.length);
}
function cycleInfo(){ var c=cycleState(); return {n:c.n||1,seen:Object.keys(c.seen).length,all:Math.max(1,activeGroupCount())}; }
function markCycle(gid){
  var c=cycleState(); c.seen[gid]=1;
  if(Object.keys(c.seen).length>=Math.max(1,activeGroupCount())){ c.n=(c.n||1)+1; c.seen={}; return true; }
  return false;
}
function diag(gid){
  // gid is a section id (1.1) or a sub-topic id (1.1.1); the id spaces do not
  // overlap, so one lookup covers both
  var ids=BYTOPIC[gid]||BYSUB[gid]||[];
  var done=0,ok=0,miss=0,rep=0,unseen=0,last=Infinity, M=store.miss||{};
  ids.forEach(function(i){
    var r=store.h[i];
    if(!r){ unseen++; return; }
    done++; if(r.ok) ok++; else miss++;
    if(M[i]&&M[i].rep) rep++;
    if((r.t||0)<last) last=r.t||0;
  });
  return {id:gid, n:ids.length, ids:ids, done:done, ok:ok, miss:miss, rep:rep, unseen:unseen,
    acc:done? ok/done:0, cov:ids.length? done/ids.length:0, last:last===Infinity?0:last};
}
function weakness(d){
  var s=0;
  s+=5.0*Math.min(d.miss,3);               // open mistakes dominate
  s+=1.5*Math.min(d.rep,3);                // repaired mistakes still bias, gently
  s+=2.2*(1-d.acc)*Math.min(d.done,4);
  s+=1.5*(1-d.cov);
  s+=0.7*Math.min(days(d.last)/7,4);
  if(store.lastTopic===d.id) s-=1.2;       // never the same topic twice in a row
  return s;
}
/* Choose one item inside a topic.  rnd is injectable so tests can pin the draw.
   Priority: open mistakes > repaired mistakes due for recall > unseen > stale. */
function pickFrom(d,sk,rnd){
  rnd=rnd||Math.random; sk=sk||{q:{},s:{}};
  var all=d.ids||[], free=function(i){ return !sk.q[i]; };
  var one=function(a){ return a[Math.min(a.length-1,Math.max(0,Math.floor(rnd()*a.length)))]; };
  var M=store.miss||{}, now=Date.now();
  var open=all.filter(function(i){ return store.h[i] && !store.h[i].ok && free(i); });
  if(open.length) return {id:one(open),kind:'retry'};
  var dueRep=all.filter(function(i){ var m=M[i];
    return m&&m.rep&&free(i)&&(now-(m.repAt||0)>=REPAIR_RECALL_MS); });
  if(dueRep.length) return {id:one(dueRep),kind:'recall'};
  var fresh=all.filter(function(i){ return !store.h[i] && free(i); });
  if(fresh.length) return {id:one(fresh),kind:'new'};
  var rest=all.filter(free).sort(function(a,b){ return ((store.h[a]||{}).t||0)-((store.h[b]||{}).t||0); }).slice(0,3);
  return rest.length? {id:one(rest),kind:'stale'} : null;
}
function whyText(d,c){
  if(c.kind==='retry') return d.miss+' open '+(d.miss===1?'mistake':'mistakes')+' here · 这类还有 '+d.miss+' 道错题没订正';
  if(c.kind==='recall') return d.rep+' repaired mistake(s) — refreshing memory · 已订正 '+d.rep+' 道，回来复习防遗忘';
  if(c.kind==='new') return d.unseen+' item'+(d.unseen===1?'':'s')+' never seen · 这类还有 '+d.unseen+' 道没做过';
  var dd=d.last? Math.max(1,Math.round(days(d.last))):0;
  return (dd?'gone '+dd+' days':'not seen yet')+' without practice · 这类'+(dd?'已 '+dd+' 天没练':'还没练过');
}
function pickSmart(){
  var sk=skips();
  var pool=SUBGROUPS.filter(function(g){ return g.ids.length && !sk.s[g.id]; });
  if(!pool.length){ store.skip={q:{},s:{}}; save(true); pool=SUBGROUPS.filter(function(g){ return g.ids.length; }); }
  var ds=pool.map(function(g){ return diag(g.id); });
  var un=ds.filter(function(d){ return d.done===0; });          // phase 1: coverage
  for(var i=0;i<un.length;i++){ var c=pickFrom(un[i],sk); if(c) return {id:c.id,why:whyText(un[i],c),phase:1,sec:un[i].id,kind:c.kind}; }
  var best=null,bestSc=-9e9;                                     // phase 2: weakness
  for(var j=0;j<ds.length;j++){
    if(ds[j].done===0) continue;
    var c2=pickFrom(ds[j],sk); if(!c2) continue;
    var sc=weakness(ds[j]);
    if(sc>bestSc){ bestSc=sc; best={d:ds[j],c:c2}; }
  }
  if(best) return {id:best.c.id,why:whyText(best.d,best.c),phase:2,sec:best.d.id,kind:best.c.kind};
  return null;
}
function untouchedGroups(){ return SUBGROUPS.filter(function(g){ return g.ids.length && diag(g.id).done===0; }); }
function wrongQueue(){ return mistakeBook().filter(function(id){ return !repaired(id); }); }

/* ---------- round state ---------- */
var round={list:[],i:0,mode:'smart',picked:null,fills:null,shown:false,self:false,
  grade:null,marked:false,selfOk:null,done:false,t0:0,ok:0,ans:0,why:'',sec:null,phase:1};
function currentItem(){ return BYID[round.list[round.i]]||null; }
function start(mode,arg){
  var list=[];
  if(mode==='smart'){
    var p=pickSmart();
    if(!p){ store.skip={q:{},s:{}}; save(true); p=pickSmart(); }
    if(!p){ toast('Everything is answered — clearing skips.'); return; }
    list=[p.id]; store.lastTopic=p.sec; save(true);
    round={list:list,i:0,mode:mode,picked:null,fills:null,shown:false,self:false,grade:null,
      marked:false,selfOk:null,done:false,t0:Date.now(),ok:0,ans:0,why:p.why,sec:p.sec,phase:p.phase};
    route('quiz'); return;
  }
  if(mode==='topic'){ var g=GROUP_BY_ID[arg]; list=g? g.ids.slice() : []; }
  else if(mode==='sub'){ list=(BYSUB[arg]||[]).slice(); }
  else if(mode==='wrong'){ list=wrongQueue(); }
  else if(mode==='fav'){ list=Object.keys(store.fav||{}).filter(isFav).map(Number).filter(function(id){ return !!BYID[id]; }); }
  else if(mode==='single'){ list=[arg]; }
  if(!list.length){ toast('Nothing to review here.'); return; }
  round={list:list,i:0,mode:mode,picked:null,fills:null,shown:false,self:false,grade:null,
    marked:false,selfOk:null,done:false,t0:Date.now(),ok:0,ans:0,why:'',sec:null,phase:2};
  route('quiz');
}
function startSingle(id){ start('single',id); }
function startTopic(id){ start('topic',id); }
function startSub(id){ start('sub',id); }
function advance(){
  round.i++; round.picked=null; round.fills=null; round.shown=false; round.self=false;
  round.grade=null; round.marked=false; round.selfOk=null;
  if(round.i>=round.list.length){ round.done=true; return viewRes(); }
  viewQuiz();
}
function skipQ(){ addSkip('q',round.list[round.i]); toast('Skipped · 已跳过这题'); start('smart'); }
function skipTopic(){
  var it=currentItem();
  addSkip('s', it && (it.sub || it.topic) ? (it.sub || it.topic) : '__untagged__');
  if(round.sec) markCycle(round.sec); save();
  toast('Skipping this topic · 暂时跳过这类'); start('smart');
}
/* store.h[id] may only carry fields the backend clean_progress28() keeps:
   {a, ok, t, self?, resp}.  Choice answers go in `a` (letter); fill / cloze
   answers go in `resp` as a string / array of strings (NEVER a dict, and never
   a custom `v` field — those are silently dropped on cloud sync). */
function recordAttempt(it,ok,extra){
  var rec=Object.assign({ok:!!ok,t:Date.now()},extra||{});
  store.h[it.id]=rec; logMiss(it.id,ok);
  if(ok){ store.streak=(store.streak||0)+1; if(store.streak>store.best) store.best=store.streak; }
  else store.streak=0;
  if(round.mode==='smart'&&round.sec) markCycle(round.sec);
  save(); paintTop();
}
function pickChoice(L){
  if(round.shown) return;
  var it=currentItem(); if(!it) return;
  round.picked=L;
  if(!autoGradeable(it)){ revealSelf(); return; }        // key===null -> self assessment
  var g=gradeChoice(it,L);
  round.grade=g; round.shown=true; round.self=false;
  recordAttempt(it,g.ok,{a:L});
  viewQuiz(); scrollFb();
}
function submitAnswer(){
  var it=currentItem(); if(!it||round.shown) return;
  var n=(it.type==='cloze')? (it.blanks||1) : 1, vals=[];
  for(var k=0;k<n;k++){ var el=document.getElementById('ansIn'+k); vals.push(el? el.value : ''); }
  round.fills=vals;
  if(!autoGradeable(it)){ revealSelf(); return; }          // answers===null -> self assessment
  var g=(it.type==='cloze')? gradeCloze(it,vals) : gradeFill(it,vals[0]);
  round.grade=g; round.shown=true; round.self=false;
  recordAttempt(it,g.ok,{resp:(it.type==='cloze')? vals : vals[0]});
  viewQuiz(); scrollFb();
}
function revealSelf(){
  round.shown=true; round.self=true; round.grade=null; round.marked=false; round.selfOk=null;
  viewQuiz(); scrollFb();
}
function selfGrade(ok){
  var it=currentItem(); if(!it) return;
  var rec={ok:!!ok,t:Date.now(),self:1};
  if(round.picked!=null) rec.a=round.picked;
  if(round.fills) rec.resp=(it.type==='cloze')? round.fills : round.fills[0];
  store.h[it.id]=rec; logMiss(it.id,ok);
  if(ok){ store.streak=(store.streak||0)+1; if(store.streak>store.best) store.best=store.streak; }
  else store.streak=0;
  if(round.mode==='smart'&&round.sec) markCycle(round.sec);
  save(); round.marked=true; round.selfOk=ok;
  viewQuiz(); paintTop();
}

/* ---------- template variants ----------
   The same question, re-drawn with different numbers.  They are not in the
   main list (that would be 285 near-identical cards), but they are real
   practice, so every card offers them folded underneath, one click away. */
function variantsBlock(it){
  if(!it) return '';
  var rep = it.variantOf ? (BYQID[it.variantOf] || null) : it;
  if(!rep) return '';
  var sibs = (VARIANTS[rep.qid] || []).slice();
  var chips = [];
  if(it.variantOf) chips.push(rep.id);           /* a way back to the template */
  sibs.forEach(function(id){ if(id!==it.id) chips.push(id); });
  if(!chips.length) return '';
  /* on a template card every sibling is an extra draw; on a variant card the
     chips are the template plus the other siblings */
  var nMore = sibs.length;
  var title, sub;
  if(it.variantOf){
    title = '这一题还有 ' + nMore + ' 个版本';
    sub   = 'Another draw of ' + rep.label + ' · 同模板的另一组数字';
  } else {
    title = '同模板还有 ' + nMore + ' 组数字';
    sub   = nMore + ' more draw' + (nMore>1?'s':'') + ' of this question · 换个数字再练一遍';
  }
  var body = chips.map(function(id){
    var v=BYID[id]; if(!v) return '';
    var g=autoGradeable(v), rec=store.h[id];
    return '<button class="vchip'+(g?'':' self')+'" onclick="startSingle('+id+')" '
      +'title="'+escAttr(v.label+(g?'':' · 原卷未给答案，需自评'))+'">'
      +escHtml(v.label)+(g?'':'<i>自评</i>')
      +(rec?(rec.ok?'<u>✓</u>':'<u>✕</u>'):'')+'</button>';
  }).join('');
  return '<details class="vbox">'
    +'<summary><span class="vicon">&#10697;</span>'
    +'<span class="vtext"><b>'+escHtml(title)+'</b><span class="vsub">'+escHtml(sub)+'</span></span>'
    +'<span class="vcount">'+chips.length+'</span>'
    +'<span class="vhint">展开练习 <i>&#9662;</i></span></summary>'
    +'<div class="vchips">'+body+'</div></details>';
}

/* ---------- shared label search ---------- */
function labelMatch(it,q){
  if(!q) return true;
  var n=function(s){ return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,''); };
  var nq=n(q);
  if(!nq){
    /* a CJK query has no latin/digit characters left after stripping, so it
       must be matched against the raw text (考点名 / 二级考点名) */
    var sub=SUBMAP[it.sub]||{}, top=TOPICMAP[it.topic]||{};
    var hay=[it.label,it.qid,it.src,it.topic,it.sub,sub.zh,sub.en,top.zh,top.en]
      .join(' ').toLowerCase();
    return hay.indexOf(String(q).toLowerCase().trim())>=0;
  }
  if(n(it.label).indexOf(nq)>=0) return true;
  if(n(it.qid).indexOf(nq)>=0) return true;
  /* compare the source label with its dash kept: stripping punctuation turns
     "Q1-01" and "Q10-10" into "q101" / "q1010", and the shorter one then
     matches the longer one as a prefix */
  if(it.src && String(it.src).toLowerCase().indexOf(String(q).toLowerCase().trim())>=0) return true;
  if(it.topic && n(it.topic).indexOf(nq)>=0) return true;
  if(it.sub){
    if(n(it.sub).indexOf(nq)>=0) return true;
    var sx=SUBMAP[it.sub];
    if(sx && (n(sx.zh).indexOf(nq)>=0 || n(sx.en).indexOf(nq)>=0)) return true;
  }
  return false;
}

function paintBank(){

function pvMatch(it,q){

/* ---------- Glossary: groups + search ---------- */
var glossQ='';
function glossMatch(q){
  q=(q||'').trim().toLowerCase();
  var out=[];
  GLOSS.forEach(function(g){
    var items=g.items.filter(function(row){ return !q || row.some(function(c){ return String(c).toLowerCase().indexOf(q)>=0; }); });
    if(items.length) out.push({id:g.id,en:g.en,zh:g.zh,items:items});
  });
  return out;
}
function hl(s,q){
  var t=escHtml(s||''); if(!q) return t;
  var eq=escHtml(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  try{ return t.replace(new RegExp('('+eq+')','ig'),'<mark>$1</mark>'); }catch(e){ return t; }
}
function viewGlossary(){
  document.getElementById('view').innerHTML=
   '<div class="wrap"><div style="display:flex;align-items:baseline;gap:12px;margin:26px 0 14px;flex-wrap:wrap">'

   +'<span class="muted">English · 中文 · 释义, grouped by topic <span class="zhx">按考点分组，支持搜索</span></span></div>'

}

function paintGloss(){
  var body=document.getElementById('glossBody'); if(!body) return;
  var groups=glossMatch(glossQ), q=glossQ.trim(), count=0;
  var html=groups.map(function(g){
    count+=g.items.length;

      +'</table></div>';
  }).join('');
  body.innerHTML=html || '<div class="gloss-empty">No terms match · 没有匹配的术语</div>';
  var meta=document.getElementById('glossMeta');

   +'<span style="color:var(--green)">已订正 repaired</span> stay in the book forever and still bias smart '
   +'recommendations, but with a lower weight. '
   +'<span class="zhx">答错即写入错题留档 store.miss；订正只标记 rep=true 不删除，已订正题目仍留在错题本并继续给智能推荐加权（权重低于待订正）。</span></p>'
   +'<div class="tabs"><button class="on">All · '+all.length+'</button>'
   +'<button>Open · '+open.length+'</button><button>Repaired · '+rep.length+'</button></div>'
   +(open.length? '<button class="btn pri" onclick="start(\'wrong\')">Drill '+open.length+' open mistake'+(open.length>1?'s':'')+' <span class="zhx">重练未订正</span></button>':'')
   +'</div><div class="book-cols">'+col(open,'open','待订正 · Open')+col(rep,'rep','已订正 · Repaired')+'</div>'
   +'<div style="margin-top:14px"><button class="btn ghost" onclick="route(\'home\')">Back <span class="zhx">返回</span></button></div>'
   +'</div></div>';
  paintTop();
}

/* ---------- topbar / toast / routing ---------- */
function paintTop(){
  paintAcct();
  if(document.querySelectorAll){
    document.querySelectorAll('[data-fav-count]').forEach(function(el){ el.textContent=favCount(); });
    document.querySelectorAll('.nav-b[data-view]').forEach(function(b){
      if(b.classList&&b.classList.toggle&&b.getAttribute) b.classList.toggle('on',b.getAttribute('data-view')===curView);
    });
  }
}
function toast(m){
  var t=document.getElementById('toast'); if(!t) return;
  t.textContent=m; if(t.classList) t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(function(){ if(t.classList) t.classList.remove('on'); },1600);
}
var HASHV={home:'#home',ref:'#ref',bank:'#bank',preview:'#preview',fav:'#fav',mistakes:'#mistakes',glossary:'#glossary'};
var HASHROUTE={'#home':'home','#ref':'ref','#bank':'bank','#preview':'preview','#fav':'fav','#mistakes':'mistakes','#glossary':'glossary'};
function route(v,arg){
  curView=v;
  try{ if(typeof window!=='undefined'&&window.scrollTo) window.scrollTo(0,0); }catch(e){}
  var h=HASHV[v];
  try{ if(h&&typeof history!=='undefined'&&typeof location!=='undefined'&&location.hash!==h)
    history.replaceState(null,'',h); }catch(e){}
  if(v==='home') viewHome(); else if(v==='ref') viewRef(arg);
  else if(v==='bank') viewBank(arg); else if(v==='preview') viewPreview();
  else if(v==='fav') viewFav(); else if(v==='mistakes') viewMistakes();
  else if(v==='glossary') viewGlossary(); else if(v==='quiz') viewQuiz();
  else if(v==='res') viewRes(); else viewHome();
  paintTop();
}
function routeFromHash(){
  var h=(typeof location!=='undefined'&&location.hash)? location.hash : '#home';
  route(HASHROUTE[h]||'home');
}
function renderMath(){
  if(G.renderMathInElement && typeof document!=='undefined' && document.body){
    try{ G.renderMathInElement(document.body,{delimiters:[
      {left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
      throwOnError:false,strict:false}); }catch(e){}
  }
}
function currentCardId(){
  if(curView==='quiz'&&round.list.length) return round.list[round.i];
  if(document.querySelector){
    var el=document.querySelector('.pv-card[data-id]');
    if(el&&el.getAttribute) return +el.getAttribute('data-id');
  }
  return null;
}
function onKey(e){
  if(e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName||'')) return;
  var m=document.getElementById('mAcct');
  if(m&&m.classList&&m.classList.contains&&m.classList.contains('on')) return;
  var k=(e.key||'').toLowerCase();
  if(k==='f'){ var id=currentCardId(); if(id!=null){ if(e.preventDefault)e.preventDefault(); toggleFav(id); } return; }
  if(curView==='quiz'&&!round.shown&&document.querySelectorAll){
    var L=['a','b','c','d'];
    if(L.indexOf(k)>=0){ var it=currentItem();
      if(it&&it.type==='choice'){ var bs=document.querySelectorAll('.opt'); var b=bs[L.indexOf(k)];
        if(b&&!b.disabled&&b.click) b.click(); }
    }
  }
  if(e.key==='Enter'&&document.querySelectorAll){
    var pris=document.querySelectorAll('.btn.pri'); var p=pris[pris.length-1];
    if(p&&p.click) p.click();
  }
}
/* ---------- runtime answer overrides (admin panel) ---------- */
function applyOverrides28(ov){
  if(!ov) return;
  Object.keys(ov).forEach(function(id){
    var it=BYID[+id]; if(!it) return;
    var d=ov[id]; if(!d) return;
    if(d.key!=null && it.type==='choice'){
      it.key=String(d.key).toUpperCase();
      it.keyConfidence='admin';
    }
    if(Array.isArray(d.answers)){
      it.answers=d.answers.map(String);
      it.answerText=d.answers.join(', ');
    }
  });
}
function fetchOverrides28(){
  if(!CAN_API) return;
  fetch('api/overrides28',{credentials:'same-origin'})
    .then(function(r){return r.ok? r.json():null;})
    .then(function(d){ if(d&&d.overrides) applyOverrides28(d.overrides); })
    .catch(function(){});
}

function boot(){
  paintTop(); routeFromHash(); renderMath();
  fetchOverrides28();
  if(CAN_API) bootAcct();
}
if(typeof document!=='undefined'&&document.addEventListener) document.addEventListener('keydown',onKey);
if(typeof window!=='undefined'&&window.addEventListener)
  window.addEventListener('hashchange',function(){ var v=HASHROUTE[location.hash]; if(v) route(v); });

/* ---------- publish inline event handlers to the GLOBAL scope ----------
   The app is wrapped in an IIFE (so Node tests can require it), but the markup
   uses onclick="route('home')" / onclick="pickChoice('A')" / ... which are
   resolved in the GLOBAL scope, not the IIFE scope.  Without this block every
   button silently throws ReferenceError.  Publish exactly the handlers used by
   inline events.  (G === window in a browser, globalThis under Node.) */
var GLOBAL_HANDLERS={
  route:route, openAcct:openAcct, closeAcct:closeAcct, switchAcct:switchAcct,
  renderAcct:renderAcct, submitAcct:submitAcct, doLogout:doLogout,

  pvGo:pvGo, pvPageGo:pvPageGo, pvSetCh:pvSetCh, pvSetQ:pvSetQ,
  pvSetTopic:pvSetTopic, pvSetType:pvSetType
};
Object.keys(GLOBAL_HANDLERS).forEach(function(k){ G[k]=GLOBAL_HANDLERS[k]; });

G.MTH028_APP=API;
if(typeof module!=='undefined'&&module.exports) module.exports=API;

if(HAS_DOM && !G.__MTH028_NO_BOOT__) boot();
})();
