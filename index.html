t is $-1$.","zh":"$x\\to+\\infty$ 时分子 $\\approx2x$、分母 $\\approx-2x$，故为 $-1$。","focus":"Limits at infinity involving a square root: factor out the dominant power, remembering √(x²) = |x|.","trap":"Writing √(x²) = x when x → −∞."},{"id":142,"s":"3.3","c":2,"a":"D","en":"Multiply by the conjugate: $\\frac{(x^{2}-9)-(x^{2}+5x+3)}{\\sqrt{x^{2}-9}+\\sqrt{x^{2}+5x+3}}\\approx\\frac{-5x-12}{2x}\\to-\\frac52$.","zh":"乘共轭后分子为 $-5x-12$，分母 $\\approx2x$，故极限为 $-\\frac52$。根式差一律先乘共轭。","focus":"Difference of radicals at infinity: multiply by the conjugate to remove the ∞ − ∞ form.","trap":"Forgetting the conjugate on the denominator; sign errors for x → −∞."},{"id":143,"s":"3.3","c":2,"a":"B","en":"Conjugate: $\\frac{(9x^{2}-4x-5)-(9x^{2}-x+6)}{6x}=\\frac{-3x-11}{6x}\\to-\\frac12$.","zh":"乘共轭得分子 $-3x-11$，分母 $\\approx6x$，极限为 $-\\frac12$。","focus":"Difference of radicals at infinity: multiply by the conjugate to remove the ∞ − ∞ form.","trap":"Forgetting the conjugate on the denominator; sign errors for x → −∞."},{"id":144,"s":"3.3","c":2,"a":"B","en":"Conjugate gives $\\frac{(16x^{2}+4x+3)-(16x^{2}-3x-9)}{-8x}$ (note the sign for $x\\to-\\infty$), so $\\frac{7x+12}{-8x}\\to-\\frac78$.","zh":"乘共轭后分子 $7x+12$，而 $x\\to-\\infty$ 时分母为 $-8x$，故极限 $-\\frac78$。负无穷时根号引出的符号要单独处理。","focus":"Difference of radicals at infinity: multiply by the conjugate to remove the ∞ − ∞ form.","trap":"Forgetting the conjugate on the denominator; sign errors for x → −∞."},{"id":145,"s":"3.3","c":2,"a":"A","en":"Conjugate: numerator $3x+6$, denominator $8x$, so the limit is $\\frac38$ — not listed.","zh":"共轭后分子 $3x+6$、分母 $8x$，极限 $\\frac38$，选项中不存在，故选\\\"以上都不对\\\"。","focus":"Difference of radicals at infinity: multiply by the conjugate to remove the ∞ − ∞ form.","trap":"Forgetting the conjugate on the denominator; sign errors for x → −∞."},{"id":146,"s":"3.3","c":2,"a":"A","en":"Conjugate: numerator $(4x^{2}+x+2)-(4x^{2}-5x+2)=6x$, denominator $4x$, so the limit is $\\frac32$.","zh":"共轭后分子 $6x$、分母 $4x$，极限 $\\frac32$。","focus":"Difference of radicals at infinity: multiply by the conjugate to remove the ∞ − ∞ form.","trap":"Forgetting the conjugate on the denominator; sign errors for x → −∞."},{"id":147,"s":"3.4","c":2,"a":"E","en":"Divide by $n$: numerator $4/n-2\\to-2$, denominator $\\sqrt{9-9/n-3/n^{2}}\\to3$, so the limit is $-\\frac23$.","zh":"同除 $n$：分子趋于 $-2$，分母趋于 $3$，故极限 $-\\frac23$。数列极限与函数极限同一套做法。","focus":"Limits of sequences: same algebra as functions, but n is an integer tending to ∞.","trap":"Treating n as continuous in a way that changes the answer; missing the e-form."},{"id":148,"s":"3.4","c":2,"a":"C","en":"Divide by $n$: $\\frac{4/n-2}{3+3/n}\\to-\\frac23$.","zh":"同除 $n$ 得 $\\frac{4/n-2}{3+3/n}\\to-\\frac23$。","focus":"Limits of sequences: same algebra as functions, but n is an integer tending to ∞.","trap":"Treating n as continuous in a way that changes the answer; missing the e-form."},{"id":149,"s":"3.4","c":2,"a":"C","en":"Divide by $n$: $\\frac{2-2/n}{\\sqrt{25+9/n+1/n^{2}}}\\to\\frac25$.","zh":"同除 $n$：分子趋于 $2$、分母趋于 $5$，得 $\\frac25$。","focus":"Limits of sequences: same algebra as functions, but n is an integer tending to ∞.","trap":"Treating n as continuous in a way that changes the answer; missing the e-form."},{"id":150,"s":"3.4","c":2,"a":"B","en":"Divide by $n$: $\\frac{6+9/n}{\\sqrt{36+6/n+3/n^{2}}}\\to\\frac66=1$.","zh":"同除 $n$ 得 $\\frac{6}{6}=1$。","focus":"Limits of sequences: same algebra as functions, but n is an integer tending to ∞.","trap":"Treating n as continuous in a way that changes the answer; missing the e-form."},{"id":151,"s":"3.4","c":2,"a":"E","en":"Divide by $n$: $\\frac{5+6/n}{\\sqrt{36-3/n+7/n^{2}}}\\to\\frac56$.","zh":"同除 $n$ 得 $\\frac56$。","focus":"Limits of sequences: same algebra as functions, but n is an integer tending to ∞.","trap":"Treating n as continuous in a way that changes the answer; missing the e-form."},{"id":152,"s":"3.5","c":2,"a":"C","en":"Vertical: the denominator vanishes at $x=-\\frac45$ while the numerator does not. Horizontal: degree trick gives $y=\\frac{-4}{5}$.","zh":"垂直渐近线看分母零点 $x=-\\frac45$（分子在此不为零）；水平渐近线取首项系数之比 $-\\frac45$。","focus":"Find vertical asymptotes from the zeros of the denominator, horizontal ones from limits at ±∞.","trap":"Keeping a cancelled factor as an asymptote; reporting a point instead of a line."},{"id":153,"s":"3.5","c":2,"a":"E","en":"Denominator zero at $6-4x=0$, i.e. $x=\\frac32$; horizontal asymptote $y=\\frac{-5}{-4}=\\frac54$.","zh":"分母零点 $x=\\frac32$ 给出垂直渐近线；水平渐近线为首项系数比 $\\frac54$。","focus":"Find vertical asymptotes from the zeros of the denominator, horizontal ones from limits at ±∞.","trap":"Keeping a cancelled factor as an asymptote; reporting a point instead of a line."},{"id":154,"s":"3.5","c":2,"a":"E","en":"Denominator $5x=0$ gives $x=0$; horizontal asymptote $y=\\frac35$.","zh":"分母零点 $x=0$ 为垂直渐近线；水平渐近线 $y=\\frac35$。","focus":"Find vertical asymptotes from the zeros of the denominator, horizontal ones from limits at ±∞.","trap":"Keeping a cancelled factor as an asymptote; reporting a point instead of a line."},{"id":155,"s":"3.5","c":2,"a":"C","en":"The denominator vanishes at $x=-3$ and $x=-4$; since the numerator is only linear, the horizontal asymptote is $y=0$.","zh":"分母零点 $x=-3,-4$ 给出两条垂直渐近线；分子次数低于分母，水平渐近线为 $y=0$。","focus":"Find vertical asymptotes from the zeros of the denominator, horizontal ones from limits at ±∞.","trap":"Keeping a cancelled factor as an asymptote; reporting a point instead of a line."},{"id":156,"s":"3.5","c":2,"a":"C","en":"Vertical asymptotes at $x=-5$ and $x=-4$; horizontal $y=0$ because the numerator has lower degree.","zh":"垂直渐近线 $x=-5,-4$；分子次数低，水平渐近线 $y=0$。","focus":"Find vertical asymptotes from the zeros of the denominator, horizontal ones from limits at ±∞.","trap":"Keeping a cancelled factor as an asymptote; reporting a point instead of a line."},{"id":157,"s":"4.1","c":3,"a":"B","en":"$3x+5\\to+\\infty$, so $2^{3x+5}\\to+\\infty$.","zh":"指数 $3x+5\\to+\\infty$，底数 $2&gt;1$，故极限为 $+\\infty$。","focus":"Limits of exponential functions: substitute if continuous, otherwise rewrite to expose e.","trap":"Applying the e-limit when the base does not tend to 1."},{"id":158,"s":"4.1","c":3,"a":"E","en":"As $x\\to-\\infty$, $4x-6\\to-\\infty$, so $(1/2)^{4x-6}=(1/2)^{-\\infty}=2^{+\\infty}=+\\infty$.","zh":"$x\\to-\\infty$ 时 $4x-6\\to-\\infty$，而底数 $\\frac12&lt;1$，故 $(\\frac12)^{-\\infty}=2^{+\\infty}=+\\infty$。底数小于 $1$ 时方向反转。","focus":"Limits of exponential functions: substitute if continuous, otherwise rewrite to expose e.","trap":"Applying the e-limit when the base does not tend to 1."},{"id":159,"s":"4.1","c":3,"a":"B","en":"$2x-4\\to+\\infty$, hence $e^{2x-4}\\to+\\infty$ — not one of the listed choices.","zh":"$2x-4\\to+\\infty$，故 $e^{2x-4}\\to+\\infty$。选项只给了 $-\\infty$，故为\\\"以上都不对\\\"。","focus":"Limits of exponential functions: substitute if continuous, otherwise rewrite to expose e.","trap":"Applying the e-limit when the base does not tend to 1."},{"id":160,"s":"4.1","c":3,"a":"E","en":"Exponent $x-2\\to-2$, so $(1/2)^{-2}=4$.","zh":"指数 $x-2\\to-2$，故 $(\\frac12)^{-2}=4$。负指数就是取倒数再平方。","focus":"Limits of exponential functions: substitute if continuous, otherwise rewrite to expose e.","trap":"Applying the e-limit when the base does not tend to 1."},{"id":161,"s":"4.1","c":3,"a":"C","en":"$e^{-x}=1/e^{x}\\to0$.","zh":"$e^{-x}=\\frac{1}{e^{x}}\\to0$。","focus":"Limits of exponential functions: substitute if continuous, otherwise rewrite to expose e.","trap":"Applying the e-limit when the base does not tend to 1."},{"id":162,"s":"4.1","c":3,"a":"A","en":"Divide numerator and denominator by $e^{-x}$: $\\frac{1-3e^{x}}{5+e^{x}}\\to\\frac15$ as $x\\to-\\infty$.","zh":"分子分母同除 $e^{-x}$，得 $\\frac{1-3e^{x}}{5+e^{x}}$；$x\\to-\\infty$ 时 $e^x\\to0$，故极限 $\\frac15$。","focus":"Limits of exponential functions: substitute if continuous, otherwise rewrite to expose e.","trap":"Applying the e-limit when the base does not tend to 1."},{"id":163,"s":"4.1","c":3,"a":"C","en":"Same division: $\\frac{5-3e^{x}}{3+e^{x}}\\to\\frac53$.","zh":"同除 $e^{-x}$ 得 $\\frac{5-3e^x}{3+e^x}\\to\\frac53$。","focus":"Limits of exponential functions: substitute if continuous, otherwise rewrite to expose e.","trap":"Applying the e-limit when the base does not tend to 1."},{"id":164,"s":"4.1","c":3,"a":"D","en":"At $+\\infty$ the $e^{x}$ terms dominate: $\\frac{-2-6e^{-x}}{1+5e^{-x}}\\to-2$.","zh":"$x\\to+\\infty$ 时同除 $e^x$，得 $\\frac{-2-6e^{-x}}{1+5e^{-x}}\\to-2$。","focus":"Limits of exponential functions: substitute if continuous, otherwise rewrite to expose e.","trap":"Applying the e-limit when the base does not tend to 1."},{"id":165,"s":"4.1","c":3,"a":"A","en":"Division by $e^{x}$ gives $\\frac{-2+3e^{-x}}{1+2e^{-x}}\\to-2$.","zh":"同除 $e^x$ 得 $\\frac{-2+3e^{-x}}{1+2e^{-x}}\\to-2$。","focus":"Limits of exponential functions: substitute if continuous, otherwise rewrite to expose e.","trap":"Applying the e-limit when the base does not tend to 1."},{"id":166,"s":"4.2","c":3,"a":"C","en":"$8x\\to0^{+}$, so $\\ln(8x)\\to-\\infty$.","zh":"$8x\\to0^{+}$，故 $\\ln(8x)\\to-\\infty$。对数在 $0$ 右侧趋向负无穷。","focus":"Limits of logarithmic functions, including ln(1 + u)/u → 1.","trap":"Forgetting ln 1 = 0 introduces a 0/0 form that must be handled."},{"id":167,"s":"4.2","c":3,"a":"D","en":"At $x=1$ the argument is $3-3+e^{-2}=e^{-2}$, so the limit is $\\ln(e^{-2})=-2$.","zh":"$x=1$ 时真数为 $3-3+e^{-2}=e^{-2}$，故极限为 $\\ln e^{-2}=-2$。","focus":"Limits of logarithmic functions, including ln(1 + u)/u → 1.","trap":"Forgetting ln 1 = 0 introduces a 0/0 form that must be handled."},{"id":168,"s":"4.2","c":3,"a":"A","en":"$5x^{3}+1\\to+\\infty$, so the log tends to $+\\infty$.","zh":"真数 $\\to+\\infty$，对数也 $\\to+\\infty$。","focus":"Limits of logarithmic functions, including ln(1 + u)/u → 1.","trap":"Forgetting ln 1 = 0 introduces a 0/0 form that must be handled."},{"id":169,"s":"4.2","c":3,"a":"C","en":"$4x^{6}+1\\to+\\infty$, so $\\ln(\\cdot)\\to+\\infty$ — not listed.","zh":"真数 $\\to+\\infty$，极限为 $+\\infty$，选项中未给，故选\\\"以上都不对\\\"。","focus":"Limits of logarithmic functions, including ln(1 + u)/u → 1.","trap":"Forgetting ln 1 = 0 introduces a 0/0 form that must be handled."},{"id":170,"s":"4.2","c":3,"a":"B","en":"$4x^{5}\\to0^{+}$, so the log tends to $-\\infty$.","zh":"$4x^5\\to0^{+}$，故对数趋于 $-\\infty$。","focus":"Limits of logarithmic functions, including ln(1 + u)/u → 1.","trap":"Forgetting ln 1 = 0 introduces a 0/0 form that must be handled."},{"id":171,"s":"4.3","c":3,"a":"C","en":"Write $\\frac{\\ln x}{\\sqrt{(\\ln x)^{2}+4}}=\\frac{\\ln x}{|\\ln x|}\\cdot\\frac{1}{\\sqrt{1+4/(\\ln x)^{2}}}$; as $x\\to0^{+}$, $\\ln x&lt;0$ so the first factor is $-1$ and the second tends to $1$.","zh":"把分母写成 $|\\ln x|\\sqrt{1+4/(\\ln x)^2}$，于是原式 $=\\frac{\\ln x}{|\\ln x|}\\cdot\\frac{1}{\\sqrt{1+4/(\\ln x)^2}}$。$x\\to0^{+}$ 时 $\\ln x&lt;0$，第一因子为 $-1$，故极限为 $-1$。","focus":"Determine the sign of a logarithmic quotient near a boundary point.","trap":"Ignoring the domain restriction imposed by the logarithm."},{"id":172,"s":"4.4","c":3,"a":"B","en":"Base $=1+\\frac4x$ and exponent $\\approx4x$; $(1+\\frac4x)^{4x}\\to e^{16}$.","zh":"底数写成 $1+\\frac4x$，指数 $\\approx4x$；由 $(1+u)^{1/u}\\to e$ 得 $e^{4\\cdot4}=e^{16}$。","focus":"Indeterminate forms built from e: rewrite as e^{ln(...)} or use standard expansions.","trap":"Forgetting to exponentiate at the end."},{"id":173,"s":"4.4","c":3,"a":"A","en":"Base $=1-\\frac{1}{x-3}$, exponent $x$; the product (base$-$1)$\\cdot$exponent $\\to-1$, so the limit is $e^{-1}$.","zh":"底数写成 $1-\\frac{1}{x-3}$，指数 $x$；二者乘积（底数减一的差乘指数）趋于 $-1$，故极限 $e^{-1}$。","focus":"Indeterminate forms built from e: rewrite as e^{ln(...)} or use standard expansions.","trap":"Forgetting to exponentiate at the end."},{"id":174,"s":"4.4","c":3,"a":"C","en":"With $u=x-4$, base $=1+4u$ and exponent $=\\frac{5u+4}{u}=5+\\frac4u$; the decisive product is $4u\\cdot\\frac4u=16$, so the limit is $e^{16}$.","zh":"令 $u=x-4$，底数 $1+4u$，指数 $5+\\frac4u$。决定性乘积 $4u\\cdot\\frac4u=16$，故极限 $e^{16}$。常数项 $5$ 只贡献因子 $1$。","focus":"Indeterminate forms built from e: rewrite as e^{ln(...)} or use standard expansions.","trap":"Forgetting to exponentiate at the end."},{"id":175,"s":"4.4","c":3,"a":"A","en":"With $u=x-5$, base $=1-5u$ and exponent $=5-\\frac1u$; the product $(-5u)\\cdot(-\\frac1u)=5$ gives $e^{5}$.","zh":"令 $u=x-5$，底数 $1-5u$，指数 $5-\\frac1u$；乘积 $(-5u)(-\\frac1u)=5$，故极限 $e^{5}$。","focus":"Indeterminate forms built from e: rewrite as e^{ln(...)} or use standard expansions.","trap":"Forgetting to exponentiate at the end."},{"id":176,"s":"4.4","c":3,"a":"C","en":"Base $x=1+u$ and exponent $\\frac{6x-5}{x-1}=6+\\frac1u$; the governing product is $u\\cdot\\frac1u=1$, so the limit is $e$.","zh":"令 $u=x-1$，底数 $1+u$，指数 $6+\\frac1u$；关键乘积 $u\\cdot\\frac1u=1$，故极限为 $e$。","focus":"Indeterminate forms built from e: rewrite as e^{ln(...)} or use standard expansions.","trap":"Forgetting to exponentiate at the end."},{"id":177,"s":"4.5","c":3,"a":"C","en":"Near $x=-4$, $5x+21=1+5(x+4)$ so $\\ln(5x+21)\\approx5(x+4)$, and the denominator is $7(x+4)$; the limit is $\\frac57$.","zh":"$5x+21=1+5(x+4)$，用 $\\ln(1+u)\\sim u$ 得分子 $\\approx5(x+4)$；分母 $7(x+4)$，故极限 $\\frac57$。","focus":"The two standard limits (e^u − 1)/u → 1 and ln(1 + u)/u → 1 as u → 0.","trap":"Using them when u does not tend to 0."},{"id":178,"s":"4.5","c":3,"a":"A","en":"With $u=-x-4\\to0$, the expression is exactly $\\frac{e^{u}-1}{u}\\to1$ — not among the options.","zh":"令 $u=-x-4\\to0$，原式恰为 $\\frac{e^u-1}{u}\\to1$。选项中没有 $1$，故选\\\"以上都不对\\\"。","focus":"The two standard limits (e^u − 1)/u → 1 and ln(1 + u)/u → 1 as u → 0.","trap":"Using them when u does not tend to 0."},{"id":179,"s":"4.5","c":3,"a":"A","en":"$-3x-11=1-3(x+4)$, so the numerator is $\\approx-3(x+4)$ and the limit is $-\\frac35$.","zh":"$-3x-11=1-3(x+4)$，分子 $\\approx-3(x+4)$，除以 $5(x+4)$ 得 $-\\frac35$。","focus":"The two standard limits (e^u − 1)/u → 1 and ln(1 + u)/u → 1 as u → 0.","trap":"Using them when u does not tend to 0."},{"id":180,"s":"4.5","c":3,"a":"A","en":"With $u=-x-4$, the denominator is $6u$, so the limit is $\\frac16$ — not listed.","zh":"令 $u=-x-4$，分母为 $6u$，极限为 $\\frac16$，选项中未给。","focus":"The two standard limits (e^u − 1)/u → 1 and ln(1 + u)/u → 1 as u → 0.","trap":"Using them when u does not tend to 0."},{"id":181,"s":"4.5","c":3,"a":"E","en":"$7x+28=7(x+4)$, so numerator $\\approx7(x+4)$ over $-(x+4)$ gives $-7$.","zh":"$7x+28=7(x+4)$，分子 $\\approx7(x+4)$，分母 $-(x+4)$，故极限 $-7$。","focus":"The two standard limits (e^u − 1)/u → 1 and ln(1 + u)/u → 1 as u → 0.","trap":"Using them when u does not tend to 0."},{"id":182,"s":"4.6","c":3,"a":"B","en":"Monthly compounding: $A=P(1+\\frac{r}{12})^{12t}=4400(1+\\frac{1}{600})^{96}$.","zh":"按月复利 $A=P(1+\\frac{r}{12})^{12t}$，代入 $r=\\frac{1}{50}$、$t=8$ 得 $4400(1+\\frac{1}{600})^{96}$。$12t=96$ 别写成 $8$。","focus":"Continuous compounding: A = P e^{rt}; solve for whichever quantity is missing.","trap":"Using (1 + r/n)^{nt} when the question says continuously compounded."},{"id":183,"s":"4.6","c":3,"a":"B","en":"Continuous compounding doubles the money when $e^{rt}=2$, i.e. $t=\\frac{\\ln2}{r}=\\frac{100\\ln2}{7}$, which none of the options states.","zh":"连续复利下翻倍即 $e^{rt}=2$，解得 $t=\\frac{\\ln2}{r}=\\frac{100\\ln2}{7}$。选项 C 写成了 $\\frac{100}{7\\ln2}$，倒数关系不对，故选\\\"以上都不对\\\"。","focus":"Continuous compounding: A = P e^{rt}; solve for whichever quantity is missing.","trap":"Using (1 + r/n)^{nt} when the question says continuously compounded."},{"id":184,"s":"4.6","c":3,"a":"B","en":"$A=1500(1+\\frac{1}{240})^{84}$ since $\\frac{0.05}{12}=\\frac{1}{240}$ and $12\\cdot7=84$.","zh":"$\\frac{0.05}{12}=\\frac{1}{240}$，$12\\cdot7=84$，故 $A=1500(1+\\frac{1}{240})^{84}$。","focus":"Continuous compounding: A = P e^{rt}; solve for whichever quantity is missing.","trap":"Using (1 + r/n)^{nt} when the question says continuously compounded."},{"id":185,"s":"4.6","c":3,"a":"C","en":"Continuous: $A=3400e^{0.08\\cdot8}=3400e^{16/25}$.","zh":"连续复利 $A=Pe^{rt}=3400e^{0.64}=3400e^{16/25}$。指数是 $rt$ 的乘积，不是 $r+t$。","focus":"Continuous compounding: A = P e^{rt}; solve for whichever quantity is missing.","trap":"Using (1 + r/n)^{nt} when the question says continuously compounded."},{"id":186,"s":"4.6","c":3,"a":"A","en":"$4900(1+\\frac{7}{1200})^{36}$: monthly rate $\\frac{0.07}{12}=\\frac{7}{1200}$, and $12\\cdot3=36$.","zh":"月利率 $\\frac{0.07}{12}=\\frac{7}{1200}$，期数 $36$，故 $4900(1+\\frac{7}{1200})^{36}$。","focus":"Continuous compounding: A = P e^{rt}; solve for whichever quantity is missing.","trap":"Using (1 + r/n)^{nt} when the question says continuously compounded."},{"id":187,"s":"5.1","c":4,"a":"C","en":"Continuity needs $L=\\lim_{x\\to-2}\\frac{3x^{2}+4x-4}{x+2}$; the numerator is $(3x-2)(x+2)$, so $L=3(-2)-2=-8$.","zh":"连续要求 $L$ 等于该点极限。分子分解为 $(3x-2)(x+2)$，约分后代入得 $L=-8$。","focus":"Choose the constant L so that a piecewise function is continuous at the join.","trap":"Using the function value instead of a limit on one side."},{"id":188,"s":"5.1","c":4,"a":"B","en":"$\\frac{x^{2}+2x-8}{x+4}=(x-2)$, so $L=-4-2=-6$.","zh":"分子 $=(x+4)(x-2)$，约分后为 $x-2$，代入 $x=-4$ 得 $L=-6$。","focus":"Choose the constant L so that a piecewise function is continuous at the join.","trap":"Using the function value instead of a limit on one side."},{"id":189,"s":"5.1","c":4,"a":"D","en":"$\\frac{x^{2}-x-20}{x+4}=x-5$, so $L=-9$.","zh":"分子 $=(x-5)(x+4)$，约分后为 $x-5$，故 $L=-9$。","focus":"Choose the constant L so that a piecewise function is continuous at the join.","trap":"Using the function value instead of a limit on one side."},{"id":190,"s":"5.1","c":4,"a":"D","en":"Near $x=-2$ the quotient behaves like $\\frac{8(x+2)}{6(x+2)}=\\frac43$, so $L=\\frac43$.","zh":"$x\\to-2$ 时分子 $\\sin(8(x+2))\\sim8(x+2)$，分母 $6(x+2)$，故 $L=\\frac43$。用等价无穷小代替 $\\sin$。","focus":"Choose the constant L so that a piecewise function is continuous at the join.","trap":"Using the function value instead of a limit on one side."},{"id":191,"s":"5.1","c":4,"a":"C","en":"$3x^{2}+3x-6=3(x+2)(x-1)$, so $L=3(-3)=-9$.","zh":"分子 $=3(x+2)(x-1)$，约去 $x+2$ 后代入得 $L=-9$。","focus":"Choose the constant L so that a piecewise function is continuous at the join.","trap":"Using the function value instead of a limit on one side."},{"id":192,"s":"5.2","c":4,"a":"C","en":"Left limit $-(-3)-5=-2$, right limit $-3+1=-2$: continuous. Slopes are $-1$ and $1$, so there is a corner — continuous but not differentiable.","zh":"左右极限都是 $-2$，故连续；两侧斜率 $-1$ 与 $1$ 不等，故不可导，是尖点。","focus":"Classify discontinuities: removable, jump, infinite, or oscillatory.","trap":"Calling every discontinuity removable; missing a point where the function is undefined but the limit exists."},{"id":193,"s":"5.2","c":4,"a":"C","en":"Both branches give $-5$ at $x=-2$, and the one-sided slopes are $3$ and $-2x-1=3$ — equal, so $f$ is differentiable there.","zh":"两支在 $x=-2$ 都取 $-5$，且左右导数都是 $3$，故在该点可导。连续且左右导数相等才算可导。","focus":"Classify discontinuities: removable, jump, infinite, or oscillatory.","trap":"Calling every discontinuity removable; missing a point where the function is undefined but the limit exists."},{"id":194,"s":"5.2","c":4,"a":"C","en":"Both branches give $-3$, so it is continuous; the slopes $-1$ and $1$ differ, so it is not differentiable.","zh":"两支都取 $-3$，连续；但左右导数 $-1$ 与 $1$ 不等，故不可导。","focus":"Classify discontinuities: removable, jump, infinite, or oscillatory.","trap":"Calling every discontinuity removable; missing a point where the function is undefined but the limit exists."},{"id":195,"s":"5.2","c":4,"a":"E","en":"Left limit $-2$, right limit $2(-3)+4=-2$: continuous; slopes $-1$ versus $2$, so not differentiable.","zh":"左右极限同为 $-2$，连续；斜率分别为 $-1$ 与 $2$，故不可导。","focus":"Classify discontinuities: removable, jump, infinite, or oscillatory.","trap":"Calling every discontinuity removable; missing a point where the function is undefined but the limit exists."},{"id":196,"s":"5.2","c":4,"a":"B","en":"At $x=-3$ both branches give $-1$, so $f$ is continuous; but the one-sided slopes are $2$ and $-1$, so it is not differentiable.","zh":"两支在 $x=-3$ 都取 $-1$，连续；两侧斜率 $2$ 与 $-1$ 不等，故不可导。","focus":"Classify discontinuities: removable, jump, infinite, or oscillatory.","trap":"Calling every discontinuity removable; missing a point where the function is undefined but the limit exists."},{"id":197,"s":"5.2","c":4,"a":"D","en":"The numerator is $4(x-7)(x-2)$, so the factor $x-7$ cancels: the limit exists, hence a removable discontinuity at $x=7$.","zh":"分子 $=4(x-7)(x-2)$，$x-7$ 可约去，极限存在，故 $x=7$ 是可去间断点。","focus":"Classify discontinuities: removable, jump, infinite, or oscillatory.","trap":"Calling every discontinuity removable; missing a point where the function is undefined but the limit exists."},{"id":198,"s":"5.2","c":4,"a":"C","en":"Denominator $(x+6)(x+1)$; neither factor cancels with the constant numerator, so both discontinuities are non-removable (vertical asymptotes).","zh":"分母 $(x+6)(x+1)$，分子为常数无法约分，两个都是不可去间断点（垂直渐近线）。","focus":"Classify discontinuities: removable, jump, infinite, or oscillatory.","trap":"Calling every discontinuity removable; missing a point where the function is undefined but the limit exists."},{"id":199,"s":"5.2","c":4,"a":"B","en":"$\\frac{(x-5)(x-8)}{x(x-8)}$: the $x=8$ factor cancels (removable), $x=0$ remains as a vertical asymptote (non-removable).","zh":"约去 $x-8$ 后 $x=8$ 可去；$x=0$ 无法约去，是不可去的垂直渐近线。","focus":"Classify discontinuities: removable, jump, infinite, or oscillatory.","trap":"Calling every discontinuity removable; missing a point where the function is undefined but the limit exists."},{"id":200,"s":"5.2","c":4,"a":"E","en":"$\\frac{(x-7)(x+4)}{(x-1)(x-7)}$: $x=7$ cancels (removable), $x=1$ does not (non-removable).","zh":"分子分母都有 $x-7$，故 $x=7$ 可去；$x=1$ 不可约，属不可去间断。","focus":"Classify discontinuities: removable, jump, infinite, or oscillatory.","trap":"Calling every discontinuity removable; missing a point where the function is undefined but the limit exists."},{"id":201,"s":"5.2","c":4,"a":"D","en":"The numerator is $4(x+8)(x+6)$, so $x+8$ cancels and the only discontinuity at $x=-8$ is removable.","zh":"分子 $=4(x+8)(x+6)$，$x+8$ 可约，故 $x=-8$ 为可去间断点。","focus":"Classify discontinuities: removable, jump, infinite, or oscillatory.","trap":"Calling every discontinuity removable; missing a point where the function is undefined but the limit exists."},{"id":202,"s":"5.3","c":4,"a":"D","en":"Match the two branches at $x=-1$: $7(-1)+3=-4$ and $5(-1)+q=q-5$, so $q=1$.","zh":"令两支在 $x=-1$ 相等：左边 $-4$，右边 $q-5$，得 $q=1$。","focus":"Find parameters that make a piecewise function continuous everywhere.","trap":"Solving only one join when there are several."},{"id":203,"s":"5.3","c":4,"a":"E","en":"$9(1)-2=7$ and $6+q=7$, so $q=1$.","zh":"左支 $7$，右支 $6+q$，令其相等得 $q=1$。","focus":"Find parameters that make a piecewise function continuous everywhere.","trap":"Solving only one join when there are several."},{"id":204,"s":"5.3","c":4,"a":"E","en":"$4(2)-1=7$ and $2(2)+q=4+q$, so $q=3$.","zh":"左支 $7$、右支 $4+q$，得 $q=3$。","focus":"Find parameters that make a piecewise function continuous everywhere.","trap":"Solving only one join when there are several."},{"id":205,"s":"5.3","c":4,"a":"B","en":"$5(1)-1=4$ and $4+q=4$, so $q=0$.","zh":"左支 $4$、右支 $4+q$，故 $q=0$。","focus":"Find parameters that make a piecewise function continuous everywhere.","trap":"Solving only one join when there are several."},{"id":206,"s":"5.3","c":4,"a":"C","en":"At $x=1$: $2(1)-3=-1=u+v$. At $x=4$: $3(4)-10=2=4u+v$. Subtracting gives $3u=3$, so $u=1$, $v=-2$.","zh":"两个连接点各列一方程：$u+v=-1$ 与 $4u+v=2$；两式相减得 $u=1$，回代 $v=-2$。两个未知数需要两个条件。","focus":"Find parameters that make a piecewise function continuous everywhere.","trap":"Solving only one join when there are several."},{"id":207,"s":"5.4","c":4,"a":"A","en":"The one-sided limits are $-4$ and $4$: they differ, so the two-sided limit fails — a non-removable (jump) discontinuity.","zh":"左右极限 $-4$ 与 $4$ 不等，双侧极限不存在，属不可去的跳跃间断。","focus":"Distinguish continuity from the existence of a limit.","trap":"Assuming differentiability from continuity, or continuity from a limit."},{"id":208,"s":"5.4","c":4,"a":"E","en":"The limit exists ($4$) but differs from the function value ($5$), so the discontinuity is removable.","zh":"极限存在（$4$）但不等于函数值（$5$），故为可去间断。","focus":"Distinguish continuity from the existence of a limit.","trap":"Assuming differentiability from continuity, or continuity from a limit."},{"id":209,"s":"5.4","c":4,"a":"D","en":"Limit $-2$, value $-1$: they differ, hence a removable discontinuity.","zh":"极限 $-2$、函数值 $-1$，二者不等，是可去间断。","focus":"Distinguish continuity from the existence of a limit.","trap":"Assuming differentiability from continuity, or continuity from a limit."},{"id":210,"s":"5.4","c":4,"a":"E","en":"Limit $4$, value $5$: removable.","zh":"极限 $4$、函数值 $5$，为可去间断。","focus":"Distinguish continuity from the existence of a limit.","trap":"Assuming differentiability from continuity, or continuity from a limit."},{"id":211,"s":"5.4","c":4,"a":"D","en":"Left $-1$, right $1$: different, so the limit does not exist — non-removable.","zh":"左右极限 $-1$ 与 $1$ 不等，极限不存在，属不可去间断。","focus":"Distinguish continuity from the existence of a limit.","trap":"Assuming differentiability from continuity, or continuity from a limit."},{"id":212,"s":"5.5","c":4,"a":"C","en":"$f(1)=\\ln\\frac25&lt;0$ and $f(\\frac72)=\\ln\\frac75&gt;0$; $f$ is continuous on the interval, so by the Intermediate Value Theorem it has at least one zero.","zh":"端点值 $\\ln\\frac25&lt;0$ 与 $\\ln\\frac75&gt;0$ 异号，且 $\\ln$ 在区间上连续，由零点定理至少有一个零点。先验连续、再验异号。","focus":"Intermediate Value Theorem: a continuous function on [a, b] takes every value between f(a) and f(b).","trap":"Applying IVT on an interval where f is not continuous; claiming uniqueness without monotonicity."},{"id":213,"s":"5.5","c":4,"a":"B","en":"$f(0)=-1&lt;0$ and $f(2)=29&gt;0$, continuous → at least one root.","zh":"$f(0)=-1&lt;0$、$f(2)=29&gt;0$，连续，故由零点定理至少一根。","focus":"Intermediate Value Theorem: a continuous function on [a, b] takes every value between f(a) and f(b).","trap":"Applying IVT on an interval where f is not continuous; claiming uniqueness without monotonicity."},{"id":214,"s":"5.5","c":4,"a":"E","en":"$f$ jumps from $-3$ to $3$ at $x=0$, so it is not continuous on $[-3,3]$ and the theorem does not apply.","zh":"$f$ 在 $x=0$ 处从 $-3$ 跳到 $3$，在闭区间上不连续，零点定理的前提不满足，故不能应用。","focus":"Intermediate Value Theorem: a continuous function on [a, b] takes every value between f(a) and f(b).","trap":"Applying IVT on an interval where f is not continuous; claiming uniqueness without monotonicity."},{"id":215,"s":"5.5","c":4,"a":"A","en":"$f(0)=-2&lt;0$ and $f(2)=2(4)+4-2=10&gt;0$, continuous → at least one root.","zh":"$f(0)=-2&lt;0$、$f(2)=10&gt;0$，连续，故至少一根。","focus":"Intermediate Value Theorem: a continuous function on [a, b] takes every value between f(a) and f(b).","trap":"Applying IVT on an interval where f is not continuous; claiming uniqueness without monotonicity."},{"id":216,"s":"5.5","c":4,"a":"B","en":"The function has a vertical asymptote at $x=0$, so it is not continuous on $[-49,49]$; the theorem cannot be applied.","zh":"函数在 $x=0$ 处有垂直渐近线，在 $[-49,49]$ 上不连续，零点定理不适用。","focus":"Intermediate Value Theorem: a continuous function on [a, b] takes every value between f(a) and f(b).","trap":"Applying IVT on an interval where f is not continuous; claiming uniqueness without monotonicity."},{"id":217,"s":"6.1","c":5,"a":"C","en":"$f'(x)=2x+3$, so the slope at $x=-3$ is $2(-3)+3=-3$.","zh":"先求导 $f'(x)=2x+3$，代入 $x=-3$ 得斜率 $-3$。切线斜率就是该点导数。","focus":"The slope of the tangent at x = a is f′(a).","trap":"Substituting into f instead of f′."},{"id":218,"s":"6.1","c":5,"a":"A","en":"$f'(x)=-3x^{2}-8x-3$; at $x=-3$: $-27+24-3=-6$.","zh":"$f'(x)=-3x^2-8x-3$，代入 $x=-3$ 得 $-6$。三项分别计算，注意负号。","focus":"The slope of the tangent at x = a is f′(a).","trap":"Substituting into f instead of f′."},{"id":219,"s":"6.1","c":5,"a":"C","en":"$f'(x)=-3x^{2}-12x-4$, so the slope is $-27+36-4=5$, which is not among the choices.","zh":"$f'(x)=-3x^2-12x-4$，代入得 $5$。选项中没有 $5$，故选\\\"以上都不对\\\"。","focus":"The slope of the tangent at x = a is f′(a).","trap":"Substituting into f instead of f′."},{"id":220,"s":"6.1","c":5,"a":"D","en":"$f'(x)=-3x^{2}-8x+3$; at $-3$: $-27+24+3=0$, a horizontal tangent.","zh":"$f'(x)=-3x^2-8x+3$，代入得 $0$，即切线水平。导数为零不代表没有切线。","focus":"The slope of the tangent at x = a is f′(a).","trap":"Substituting into f instead of f′."},{"id":221,"s":"6.1","c":5,"a":"B","en":"$f'(x)=-3x^{2}-10x-3$; at $-3$: $-27+30-3=0$, not listed.","zh":"$f'(x)=-3x^2-10x-3$，代入得 $0$，选项中无此值，故选\\\"以上都不对\\\"。","focus":"The slope of the tangent at x = a is f′(a).","trap":"Substituting into f instead of f′."},{"id":222,"s":"6.2","c":5,"a":"E","en":"$f(x)=-4(3x)^{-1/2}$, so $f'(x)=6(3x)^{-3/2}$. At $x=27$, $3x=81$ and $81^{3/2}=729$, giving $\\frac{6}{729}=\\frac{2}{243}$.","zh":"写成 $f=-4(3x)^{-1/2}$，求导得 $6(3x)^{-3/2}$。$x=27$ 时 $3x=81$，$81^{3/2}=729$，故为 $\\frac{6}{729}=\\frac{2}{243}$。内层 $3x$ 的系数 $3$ 不能漏。","focus":"Evaluate the derivative at a specific point, including from the limit definition.","trap":"Algebra slips when expanding (a+h)ⁿ; forgetting to rationalise."},{"id":223,"s":"6.2","c":5,"a":"E","en":"$f=3\\sqrt2\\,x^{1/2}$, so $f'(x)=\\frac{3\\sqrt2}{2}x^{-1/2}$; at $x=2$ this is $\\frac{3\\sqrt2}{2\\sqrt2}=\\frac32$, which is not listed (only $-\\frac32$).","zh":"$f=3\\sqrt2\\,x^{1/2}$，$f'=\\frac{3\\sqrt2}{2\\sqrt2}=\\frac32$。选项只给了 $-\\frac32$，故选\\\"以上都不对\\\"。","focus":"Evaluate the derivative at a specific point, including from the limit definition.","trap":"Algebra slips when expanding (a+h)ⁿ; forgetting to rationalise."},{"id":224,"s":"6.2","c":5,"a":"E","en":"$f=2(7x)^{-1/2}\\Rightarrow f'=-7(7x)^{-3/2}$; at $x=28$, $7x=196$, $196^{3/2}=2744$, so $-\\frac{7}{2744}=-\\frac{1}{392}$.","zh":"$f=2(7x)^{-1/2}$，$f'=-7(7x)^{-3/2}$。$x=28$ 时 $7x=196$，$196^{3/2}=2744$，得 $-\\frac{1}{392}$。","focus":"Evaluate the derivative at a specific point, including from the limit definition.","trap":"Algebra slips when expanding (a+h)ⁿ; forgetting to rationalise."},{"id":225,"s":"6.2","c":5,"a":"B","en":"$f=-(5x)^{-1/2}\\Rightarrow f'=\\frac52(5x)^{-3/2}$; at $x=5$, $25^{3/2}=125$, so $\\frac{5/2}{125}=\\frac{1}{50}$.","zh":"$f=-(5x)^{-1/2}$，$f'=\\frac52(5x)^{-3/2}$；$25^{3/2}=125$，得 $\\frac{1}{50}$。","focus":"Evaluate the derivative at a specific point, including from the limit definition.","trap":"Algebra slips when expanding (a+h)ⁿ; forgetting to rationalise."},{"id":226,"s":"6.2","c":5,"a":"B","en":"$f=-4(6x)^{-1/2}\\Rightarrow f'=12(6x)^{-3/2}$; at $x=24$, $144^{3/2}=1728$, so $\\frac{12}{1728}=\\frac{1}{144}$.","zh":"$f=-4(6x)^{-1/2}$，$f'=12(6x)^{-3/2}$；$144^{3/2}=1728$，得 $\\frac{1}{144}$。","focus":"Evaluate the derivative at a specific point, including from the limit definition.","trap":"Algebra slips when expanding (a+h)ⁿ; forgetting to rationalise."},{"id":227,"s":"6.3","c":5,"a":"D","en":"$y'=-\\frac{12x}{(x^{2}+8)^{2}}$, so at $x=-1$ the slope is $\\frac{12}{81}=\\frac{4}{27}$. Then $y-\\frac23=\\frac{4}{27}(x+1)$ rearranges to $4x-27y+22=0$.","zh":"$y'=-\\frac{12x}{(x^2+8)^2}$，在 $x=-1$ 处斜率 $\\frac{4}{27}$。点斜式化简得 $4x-27y+22=0$。","focus":"Equation of the tangent line at a point: y − y₀ = f′(x₀)(x − x₀).","trap":"Using the normal-line slope; sign errors in rearranging."},{"id":228,"s":"6.3","c":5,"a":"D","en":"$y'=\\frac{6x}{(x^{2}+4)^{2}}$, slope at $-1$ is $-\\frac{6}{25}$, and $y+\\frac35=-\\frac{6}{25}(x+1)$ gives $6x+25y+21=0$.","zh":"$y'=\\frac{6x}{(x^2+4)^2}$，斜率 $-\\frac{6}{25}$；化简得 $6x+25y+21=0$。","focus":"Equation of the tangent line at a point: y − y₀ = f′(x₀)(x − x₀).","trap":"Using the normal-line slope; sign errors in rearranging."},{"id":229,"s":"6.3","c":5,"a":"A","en":"$y'=-\\frac{22x}{(x^{2}+10)^{2}}$, slope at $-1$ is $\\frac{2}{11}$; then $y-1=\\frac{2}{11}(x+1)$ gives $2x-11y+13=0$.","zh":"$y'=-\\frac{22x}{(x^2+10)^2}$，斜率 $\\frac{2}{11}$；整理得 $2x-11y+13=0$。","focus":"Equation of the tangent line at a point: y − y₀ = f′(x₀)(x − x₀).","trap":"Using the normal-line slope; sign errors in rearranging."},{"id":230,"s":"6.3","c":5,"a":"D","en":"$y'=\\frac{4x}{(x^{2}+1)^{2}}$, slope at $-1$ is $-1$; $y+1=-(x+1)$ gives $x+y+2=0$.","zh":"$y'=\\frac{4x}{(x^2+1)^2}$，斜率 $-1$；得 $x+y+2=0$。","focus":"Equation of the tangent line at a point: y − y₀ = f′(x₀)(x − x₀).","trap":"Using the normal-line slope; sign errors in rearranging."},{"id":231,"s":"6.3","c":5,"a":"E","en":"$y'=-\\frac{4x}{(x^{2}+1)^{2}}$, slope at $1$ is $-1$; $y-1=-(x-1)$ gives $x+y-2=0$.","zh":"$y'=-\\frac{4x}{(x^2+1)^2}$，$x=1$ 处斜率 $-1$；得 $x+y-2=0$。","focus":"Equation of the tangent line at a point: y − y₀ = f′(x₀)(x − x₀).","trap":"Using the normal-line slope; sign errors in rearranging."},{"id":232,"s":"6.4","c":5,"a":"D","en":"$(-7\\cos x)'=7\\sin x$.","zh":"$\\cos$ 的导数是 $-\\sin$，负负得正，故为 $7\\sin x$。","focus":"Basic differentiation: power, trigonometric and algebraic combinations.","trap":"Forgetting the chain factor; quotient-rule sign errors."},{"id":233,"s":"6.4","c":5,"a":"C","en":"$(10\\tan x)'=10\\sec^{2}x$.","zh":"$\\tan$ 的导数为 $\\sec^2$，系数保留，得 $10\\sec^2x$。","focus":"Basic differentiation: power, trigonometric and algebraic combinations.","trap":"Forgetting the chain factor; quotient-rule sign errors."},{"id":234,"s":"6.4","c":5,"a":"B","en":"$(-6\\sin x)'=-6\\cos x$.","zh":"$\\sin$ 的导数为 $\\cos$，系数与符号不变，得 $-6\\cos x$。","focus":"Basic differentiation: power, trigonometric and algebraic combinations.","trap":"Forgetting the chain factor; quotient-rule sign errors."},{"id":235,"s":"6.4","c":5,"a":"E","en":"$(\\csc x)'=-\\csc x\\cot x=-\\csc^{2}x\\cos x$, which matches none of the listed forms.","zh":"$\\csc x$ 的导数为 $-\\csc x\\cot x=-\\csc^2x\\cos x$。四个选项都不是这个式子，故选\\\"以上都不对\\\"。","focus":"Basic differentiation: power, trigonometric and algebraic combinations.","trap":"Forgetting the chain factor; quotient-rule sign errors."},{"id":236,"s":"6.4","c":5,"a":"E","en":"Product rule: $(-2x^{3})'\\tan x+(-2x^{3})(\\tan x)'=-6x^{2}\\tan x-2x^{3}\\sec^{2}x$.","zh":"用乘积法则：前导后不导 + 前不导后导，得 $-6x^2\\tan x-2x^3\\sec^2x$。","focus":"Basic differentiation: power, trigonometric and algebraic combinations.","trap":"Forgetting the chain factor; quotient-rule sign errors."},{"id":237,"s":"6.4","c":5,"a":"A","en":"$-\\sin x\\cos x=-\\frac12\\sin2x$, whose derivative is $-\\cos2x$.","zh":"先化积为和：$-\\sin x\\cos x=-\\frac12\\sin2x$，求导得 $-\\cos2x$。先化简再求导往往更快。","focus":"Basic differentiation: power, trigonometric and algebraic combinations.","trap":"Forgetting the chain factor; quotient-rule sign errors."},{"id":238,"s":"6.4","c":5,"a":"C","en":"$(-3x^{2})'\\tan x+(-3x^{2})(\\sec^{2}x)=-6x\\tan x-3x^{2}\\sec^{2}x$.","zh":"乘积法则得 $-6x\\tan x-3x^2\\sec^2x$。两项都要写全。","focus":"Basic differentiation: power, trigonometric and algebraic combinations.","trap":"Forgetting the chain factor; quotient-rule sign errors."},{"id":239,"s":"6.4","c":5,"a":"C","en":"Differentiate termwise: $3\\cos x+6\\sec x\\tan x+4\\csc^{2}x$ (the derivative of $-4\\cot x$ is $+4\\csc^{2}x$).","zh":"逐项求导：$-4\\cot x$ 的导数为 $+4\\csc^2x$，符号变化是本题唯一难点。","focus":"Basic differentiation: power, trigonometric and algebraic combinations.","trap":"Forgetting the chain factor; quotient-rule sign errors."},{"id":240,"s":"6.4","c":5,"a":"D","en":"$3\\sin^{4}x+2\\sin^{-4}x$ gives $12\\sin^{3}x\\cos x-8\\sin^{-5}x\\cos x$.","zh":"用链式法则：$\\frac{2}{\\sin^4x}=2\\sin^{-4}x$，求导得 $-8\\sin^{-5}x\\cos x$。负指数写法更省事。","focus":"Basic differentiation: power, trigonometric and algebraic combinations.","trap":"Forgetting the chain factor; quotient-rule sign errors."},{"id":241,"s":"6.4","c":5,"a":"E","en":"$-\\sin^{2}x+\\sin^{-2}x$ gives $-2\\sin x\\cos x-2\\cos x\\sin^{-3}x$; no option has $\\sin^{3}$ in the denominator, so “none of these”.","zh":"求导得 $-2\\sin x\\cos x-2\\cos x\\sin^{-3}x$，即分母为 $\\sin^3x$。选项 A、B 的幂次或符号都不对，故选\\\"以上都不对\\\"。","focus":"Basic differentiation: power, trigonometric and algebraic combinations.","trap":"Forgetting the chain factor; quotient-rule sign errors."},{"id":242,"s":"6.5","c":5,"a":"C","en":"$y=-4[F(x)]^{3}\\Rightarrow y'=-12[F(x)]^{2}F'(x)$.","zh":"外层三次、内层 $F$：$y'=-12[F(x)]^2F'(x)$。别忘最后乘 $F'(x)$。","focus":"Chain rule: differentiate the outer function, then multiply by the derivative of the inner.","trap":"Missing the innermost factor; treating a composite as a product."},{"id":243,"s":"6.5","c":5,"a":"E","en":"$2(3x^{2}-5)\\cdot6x=12x(3x^{2}-5)=6x(6x^{2}-10)$.","zh":"$2(3x^2-5)\\cdot6x=12x(3x^2-5)$，提出公因子写成 $6x(6x^2-10)$ 与选项一致。","focus":"Chain rule: differentiate the outer function, then multiply by the derivative of the inner.","trap":"Missing the innermost factor; treating a composite as a product."},{"id":244,"s":"6.5","c":5,"a":"C","en":"$(\\tan u)'=\\sec^{2}u\\cdot u'$ with $u=x^{2}+5$, giving $2x\\sec^{2}(x^{2}+5)=\\frac{2x}{\\cos^{2}(x^{2}+5)}$.","zh":"$\\tan$ 的导数是 $\\sec^2u\\cdot u'$，$u'=2x$；也可写成 $\\frac{2x}{\\cos^2(x^2+5)}$。","focus":"Chain rule: differentiate the outer function, then multiply by the derivative of the inner.","trap":"Missing the innermost factor; treating a composite as a product."},{"id":245,"s":"6.5","c":5,"a":"D","en":"$3(-3x^{2}-3)^{2}\\cdot(-6x)=-18x(-3x^{2}-3)^{2}$.","zh":"外层三次得 $3(\\cdot)^2$，内层导数 $-6x$，合并为 $-18x(-3x^2-3)^2$。","focus":"Chain rule: differentiate the outer function, then multiply by the derivative of the inner.","trap":"Missing the innermost factor; treating a composite as a product."},{"id":246,"s":"6.5","c":5,"a":"B","en":"$8F(x^{2})\\Rightarrow y'=8F'(x^{2})\\cdot2x=16xF'(x^{2})$.","zh":"$y'=8F'(x^2)\\cdot2x=16xF'(x^2)$。$F$ 只是符号，照常写 $F'$。","focus":"Chain rule: differentiate the outer function, then multiply by the derivative of the inner.","trap":"Missing the innermost factor; treating a composite as a product."},{"id":247,"s":"6.5","c":5,"a":"E","en":"$7F(x^{6})\\Rightarrow y'=7F'(x^{6})\\cdot6x^{5}=42x^{5}F'(x^{6})$.","zh":"内层导数 $6x^5$，乘系数 $7$ 得 $42x^5F'(x^6)$。","focus":"Chain rule: differentiate the outer function, then multiply by the derivative of the inner.","trap":"Missing the innermost factor; treating a composite as a product."},{"id":248,"s":"6.5","c":5,"a":"A","en":"$6F(x^{4})\\Rightarrow y'=6F'(x^{4})\\cdot4x^{3}=24x^{3}F'(x^{4})$.","zh":"$6\\cdot4x^3=24x^3$，得 $24x^3F'(x^4)$。","focus":"Chain rule: differentiate the outer function, then multiply by the derivative of the inner.","trap":"Missing the innermost factor; treating a composite as a product."},{"id":249,"s":"6.5","c":5,"a":"D","en":"$-9F(x^{2})\\Rightarrow y'=-9F'(x^{2})\\cdot2x=-18xF'(x^{2})$.","zh":"$y'=-9\\cdot2x\\,F'(x^2)=-18xF'(x^2)$。","focus":"Chain rule: differentiate the outer function, then multiply by the derivative of the inner.","trap":"Missing the innermost factor; treating a composite as a product."},{"id":250,"s":"6.5","c":5,"a":"C","en":"Outer cosine, then the square, then the inside: $-\\sin u\\cdot2(5x^{2}-6)\\cdot10x$ with $u=(5x^{2}-6)^{2}$, i.e. $-20x(5x^{2}-6)\\sin u=-10x(10x^{2}-12)\\sin u$.","zh":"三层复合：$\\cos\\to$ 平方 $\\to 5x^2-6$，逐层乘 $2(5x^2-6)$ 与 $10x$，得 $-10x(10x^2-12)\\sin((5x^2-6)^2)$。","focus":"Chain rule: differentiate the outer function, then multiply by the derivative of the inner.","trap":"Missing the innermost factor; treating a composite as a product."},{"id":251,"s":"6.5","c":5,"a":"B","en":"With $u=(-x-2)^{-4}$, $u'=-4(-x-2)^{-5}\\cdot(-1)=4(-x-2)^{-5}$, so $f'=4(-x-2)^{-5}\\cos\\bigl((-x-2)^{-4}\\bigr)$.","zh":"令 $u=(-x-2)^{-4}$，则 $u'=4(-x-2)^{-5}$，故 $f'=4(-x-2)^{-5}\\cos u$。负指数与内层负号要一起处理。","focus":"Chain rule: differentiate the outer function, then multiply by the derivative of the inner.","trap":"Missing the innermost factor; treating a composite as a product."},{"id":252,"s":"6.6","c":5,"a":"B","en":"$f'=-10x-5$, $f''=-10$.","zh":"一阶导 $-10x-5$，二阶导 $-10$。二次函数二阶导为常数。","focus":"Higher-order derivatives: differentiate repeatedly and evaluate as required.","trap":"Substituting the point too early; losing a factor when the pattern repeats."},{"id":253,"s":"6.6","c":5,"a":"D","en":"$f'=-10x-6$, so $f''=-10$.","zh":"$f'=-10x-6$，故 $f''=-10$。常数项求导即为零。","focus":"Higher-order derivatives: differentiate repeatedly and evaluate as required.","trap":"Substituting the point too early; losing a factor when the pattern repeats."},{"id":254,"s":"6.6","c":5,"a":"C","en":"$f'=-15x^{2}-12x-6$, $f''=-30x-12$; at $x=1$: $-42$.","zh":"两阶求导得 $-30x-12$，代入 $x=1$ 得 $-42$。","focus":"Higher-order derivatives: differentiate repeatedly and evaluate as required.","trap":"Substituting the point too early; losing a factor when the pattern repeats."},{"id":255,"s":"6.6","c":5,"a":"D","en":"Differentiate twice: $f''=-150x^{4}-120x^{3}-72x^{2}-36x-12$, which at $x=1$ is $-390$.","zh":"逐项求两次导，得 $-150x^4-120x^3-72x^2-36x-12$，代入 $x=1$ 得 $-390$。逐项算比套公式稳。","focus":"Higher-order derivatives: differentiate repeatedly and evaluate as required.","trap":"Substituting the point too early; losing a factor when the pattern repeats."},{"id":256,"s":"6.6","c":5,"a":"A","en":"The constant term does not affect second derivatives, so $f''(1)=-390$ again.","zh":"常数项求导为零，二阶导与上一题相同，$f''(1)=-390$。","focus":"Higher-order derivatives: differentiate repeatedly and evaluate as required.","trap":"Substituting the point too early; losing a factor when the pattern repeats."},{"id":257,"s":"6.6","c":5,"a":"A","en":"$f'=-16\\sin4x$, $f''=-64\\cos4x=-4\\cdot4^{2}\\cos4x$.","zh":"每次求导都多乘一个 $4$：$f''=-4\\cdot4^2\\cos4x=-64\\cos4x$。","focus":"Higher-order derivatives: differentiate repeatedly and evaluate as required.","trap":"Substituting the point too early; losing a factor when the pattern repeats."},{"id":258,"s":"6.6","c":5,"a":"C","en":"$f'=4\\cos x$, $f''=-4\\sin x$, $f'''=-4\\cos x$.","zh":"连续三次求导，$f'''=-4\\cos x$。$\\sin$ 的四阶导回到自身。","focus":"Higher-order derivatives: differentiate repeatedly and evaluate as required.","trap":"Substituting the point too early; losing a factor when the pattern repeats."},{"id":259,"s":"6.6","c":5,"a":"B","en":"$f'''=-125\\cos5x=-5^{3}\\cos5x$; the listed options all carry an extra factor $5$, so none matches.","zh":"$f'''=-125\\cos5x=-5^3\\cos5x$。选项都多乘了一个 $5$，故为\\\"以上都不对\\\"。","focus":"Higher-order derivatives: differentiate repeatedly and evaluate as required.","trap":"Substituting the point too early; losing a factor when the pattern repeats."},{"id":260,"s":"6.6","c":5,"a":"D","en":"The $n$-th derivative of $-\\cos6x$ is $-6^{n}\\cos(6x+\\frac{n\\pi}{2})$; for $n=10$ this is $-6^{10}\\cos(6x+5\\pi)=6^{10}\\cos6x$.","zh":"每次求导乘 $6$ 并加 $\\frac{\\pi}{2}$ 相位；$n=10$ 时相位移 $5\\pi$，余弦变号两次，得 $6^{10}\\cos6x$。","focus":"Higher-order derivatives: differentiate repeatedly and evaluate as required.","trap":"Substituting the point too early; losing a factor when the pattern repeats."},{"id":261,"s":"6.6","c":5,"a":"A","en":"The derivatives of $-5\\sin x$ cycle with period four; $11\\equiv3\\pmod 4$ gives $5\\cos x$, which is not listed.","zh":"$-5\\sin x$ 的导数以 $4$ 为周期循环，$11\\equiv3$，对应 $5\\cos x$。选项中没有，故选\\\"以上都不对\\\"。","focus":"Higher-order derivatives: differentiate repeatedly and evaluate as required.","trap":"Substituting the point too early; losing a factor when the pattern repeats."},{"id":262,"s":"6.7","c":5,"a":"E","en":"$s''=-10$, so the acceleration is constant $-10\\ \\mathrm{cm/s^{2}}$.","zh":"位置二次，二阶导为常数 $-10$，故加速度恒为 $-10$ cm/s²。","focus":"Kinematics: velocity is the derivative of position, acceleration the derivative of velocity.","trap":"Confusing the sign of velocity with speed; forgetting units."},{"id":263,"s":"6.7","c":5,"a":"B","en":"$v=s'=-10t-2$; at $t=5$: $-52$.","zh":"$v=s'=-10t-2$，代入 $t=5$ 得 $-52$ cm/s。负号表示向负方向运动。","focus":"Kinematics: velocity is the derivative of position, acceleration the derivative of velocity.","trap":"Confusing the sign of velocity with speed; forgetting units."},{"id":264,"s":"6.7","c":5,"a":"E","en":"$v=-10t-4$; at $t=2$: $-24$.","zh":"$v=-10t-4$，$t=2$ 时为 $-24$ m/s。","focus":"Kinematics: velocity is the derivative of position, acceleration the derivative of velocity.","trap":"Confusing the sign of velocity with speed; forgetting units."},{"id":265,"s":"6.7","c":5,"a":"E","en":"$v=-15t^{2}-12t-6$, $a=-30t-12$.","zh":"先求速度再求导得 $a=-30t-12$。题目要的是函数而非某点的值。","focus":"Kinematics: velocity is the derivative of position, acceleration the derivative of velocity.","trap":"Confusing the sign of velocity with speed; forgetting units."},{"id":266,"s":"6.7","c":5,"a":"B","en":"$v=-15t^{2}-12t-3$, $a=-30t-12$; at $t=1$: $-42$.","zh":"$a=-30t-12$，代入 $t=1$ 得 $-42$ cm/s²。","focus":"Kinematics: velocity is the derivative of position, acceleration the derivative of velocity.","trap":"Confusing the sign of velocity with speed; forgetting units."},{"id":267,"s":"7.1","c":6,"a":"E","en":"$\\ln\\sqrt{14x+15}=\\frac12\\ln(14x+15)$, so the derivative is $\\frac12\\cdot\\frac{14}{14x+15}=\\frac{7}{14x+15}=\\frac{14}{28x+30}$.","zh":"先化简：$\\ln\\sqrt{u}=\\frac12\\ln u$，求导得 $\\frac{7}{14x+15}$，通分后与选项 $\\frac{14}{28x+30}$ 相同。先化简能省一大半计算。","focus":"Differentiate exponential and logarithmic functions, including composite arguments.","trap":"Forgetting ln a for a general base; dropping u′."},{"id":268,"s":"7.1","c":6,"a":"D","en":"$\\frac{d}{dx}\\ln(10x^{3}-19x)=\\frac{30x^{2}-19}{10x^{3}-19x}$; no option keeps the denominator together with the correct numerator, so “none of these”.","zh":"对数求导公式给出 $\\frac{30x^2-19}{10x^3-19x}$。选项要么分子错、要么丢了分母，故选\\\"以上都不对\\\"。","focus":"Differentiate exponential and logarithmic functions, including composite arguments.","trap":"Forgetting ln a for a general base; dropping u′."},{"id":269,"s":"7.1","c":6,"a":"B","en":"$(\\ln u)'=\\frac{u'}{u}=\\frac{26x-19}{13x^{2}-19x}$.","zh":"$\\frac{u'}{u}=\\frac{26x-19}{13x^2-19x}$。分子是内层导数，别漏乘。","focus":"Differentiate exponential and logarithmic functions, including composite arguments.","trap":"Forgetting ln a for a general base; dropping u′."},{"id":270,"s":"7.1","c":6,"a":"D","en":"$\\frac12\\ln(7x-15)\\Rightarrow\\frac12\\cdot\\frac{7}{7x-15}=\\frac{7}{14x-30}$.","zh":"提 $\\frac12$ 后求导得 $\\frac{7}{14x-30}$。系数 $\\frac12$ 与 $7$ 相乘。","focus":"Differentiate exponential and logarithmic functions, including composite arguments.","trap":"Forgetting ln a for a general base; dropping u′."},{"id":271,"s":"7.1","c":6,"a":"A","en":"$\\frac{84x^{5}+13}{14x^{6}+13x}$.","zh":"内层导数 $84x^5+13$ 作分子，原式作分母。","focus":"Differentiate exponential and logarithmic functions, including composite arguments.","trap":"Forgetting ln a for a general base; dropping u′."},{"id":272,"s":"7.1","c":6,"a":"A","en":"$(e^{u})'=u'e^{u}$ with $u=8x^{2}+4x+6$, so $u'=16x+4$.","zh":"$u'=16x+4$ 乘上 $e^u$ 即为答案。指数函数求导只多一个内层导数。","focus":"Differentiate exponential and logarithmic functions, including composite arguments.","trap":"Forgetting ln a for a general base; dropping u′."},{"id":273,"s":"7.1","c":6,"a":"C","en":"$u=-11x^{2}-6x+4$, $u'=-22x-6$.","zh":"$u'=-22x-6$，与 $e^u$ 相乘。三项分别求导。","focus":"Differentiate exponential and logarithmic functions, including composite arguments.","trap":"Forgetting ln a for a general base; dropping u′."},{"id":274,"s":"7.1","c":6,"a":"A","en":"$u=-2x^{2}-7x+2$, $u'=-4x-7$.","zh":"$u'=-4x-7$，故 $f'=(-4x-7)e^{u}$。","focus":"Differentiate exponential and logarithmic functions, including composite arguments.","trap":"Forgetting ln a for a general base; dropping u′."},{"id":275,"s":"7.1","c":6,"a":"D","en":"$u=-2x^{2}-x+6$, $u'=-4x-1$, so $f'=(-4x-1)e^{u}$ — no option matches (A has the wrong sign).","zh":"$u'=-4x-1$，故 $f'=(-4x-1)e^u$。选项 A 符号相反、E 少了一项，故选\\\"以上都不对\\\"。","focus":"Differentiate exponential and logarithmic functions, including composite arguments.","trap":"Forgetting ln a for a general base; dropping u′."},{"id":276,"s":"7.1","c":6,"a":"E","en":"$u=-x^{2}+x+1$, $u'=1-2x$, so $f'=(1-2x)e^{-x^{2}+x+1}$.","zh":"$u'=1-2x$，得 $f'=(1-2x)e^{-x^2+x+1}$。","focus":"Differentiate exponential and logarithmic functions, including composite arguments.","trap":"Forgetting ln a for a general base; dropping u′."},{"id":277,"s":"7.1","c":6,"a":"D","en":"With $u=x^{4}\\ln(17x)$, $u'=4x^{3}\\ln(17x)+x^{4}\\cdot\\frac{1}{x}=x^{3}(4\\ln17x+1)$, so $f'=x^{3}(4\\ln(17x)+1)e^{u}$.","zh":"$u=x^4\\ln(17x)$，用乘积法则得 $u'=x^3(4\\ln17x+1)$（因为 $x^4\\cdot\\frac1x=x^3$），故 $f'=x^3(4\\ln17x+1)e^u$。","focus":"Differentiate exponential and logarithmic functions, including composite arguments.","trap":"Forgetting ln a for a general base; dropping u′."},{"id":278,"s":"7.1","c":6,"a":"D","en":"$u=-11x^{5}\\ln(12x)$, $u'=-55x^{4}\\ln(12x)-11x^{4}=-11x^{4}(5\\ln12x+1)$.","zh":"$u'=-11x^4(5\\ln12x+1)$，再乘 $e^u$。系数 $-11$ 要提出来。","focus":"Differentiate exponential and logarithmic functions, including composite arguments.","trap":"Forgetting ln a for a general base; dropping u′."},{"id":279,"s":"7.1","c":6,"a":"C","en":"$u=11x\\ln(7x)$, $u'=11\\ln(7x)+11$, so $f'=(11\\ln(7x)+11)e^{u}$.","zh":"$u'=11\\ln7x+11\\cdot\\frac{x}{x}=11(\\ln7x+1)$，故 $f'=11(\\ln7x+1)e^u$。","focus":"Differentiate exponential and logarithmic functions, including composite arguments.","trap":"Forgetting ln a for a general base; dropping u′."},{"id":280,"s":"7.1","c":6,"a":"C","en":"$u=-x^{6}\\ln(18x)$, $u'=-6x^{5}\\ln(18x)-x^{5}=-x^{5}(6\\ln18x+1)$.","zh":"$u'=-x^5(6\\ln18x+1)$，与 $e^u$ 相乘。","focus":"Differentiate exponential and logarithmic functions, including composite arguments.","trap":"Forgetting ln a for a general base; dropping u′."},{"id":281,"s":"7.1","c":6,"a":"B","en":"$u=-4x^{4}\\ln(17x)$, $u'=-16x^{3}\\ln(17x)-4x^{3}=-4x^{3}(4\\ln17x+1)$.","zh":"$u'=-4x^3(4\\ln17x+1)$，再乘 $e^u$。","focus":"Differentiate exponential and logarithmic functions, including composite arguments.","trap":"Forgetting ln a for a general base; dropping u′."},{"id":282,"s":"7.1","c":6,"a":"B","en":"The function reduces to $\\sqrt{361-400x^{2}}$ after simplification, so its derivative is the one shown.","zh":"化简后被开方式为 $361-400x^2$，答案即该根式本身。遇到复杂分式先化简再动笔。","focus":"Differentiate exponential and logarithmic functions, including composite arguments.","trap":"Forgetting ln a for a general base; dropping u′."},{"id":283,"s":"7.2","c":6,"a":"A","en":"$(f^{-1})'(b)=\\frac{1}{f'(a)}$ where $f(a)=b$. Here $f(-4)=-128-48-19=-195$, so $(f^{-1})'(-195)=\\frac{1}{f'(-4)}=\\frac{1}{6(-4)^{2}+12}$.","zh":"用公式 $(f^{-1})'(b)=\\frac{1}{f'(a)}$，其中 $f(a)=b$。由 $f(-4)=-195$ 得 $a=-4$，故为 $\\frac{1}{6(-4)^2+12}$。先找 $a$ 再求导。","focus":"Derivative of an inverse function: (f⁻¹)′(y) = 1 / f′(x) where y = f(x).","trap":"Evaluating f′ at y₀ instead of at x₀."},{"id":284,"s":"7.2","c":6,"a":"B","en":"$f(-1)=-9-10=-19$, so the answer is $\\frac{1}{f'(-1)}=\\frac{1}{27(-1)^{2}+10}$.","zh":"由 $f(-1)=-19$ 定出 $a=-1$，故为 $\\frac{1}{27(-1)^2+10}$。","focus":"Derivative of an inverse function: (f⁻¹)′(y) = 1 / f′(x) where y = f(x).","trap":"Evaluating f′ at y₀ instead of at x₀."},{"id":285,"s":"7.2","c":6,"a":"A","en":"$f(-4)=-384-36-4=-424$, hence $\\frac{1}{f'(-4)}=\\frac{1}{18(-4)^{2}+9}$.","zh":"$f(-4)=-424$，故 $a=-4$，答案为 $\\frac{1}{18(-4)^2+9}$。","focus":"Derivative of an inverse function: (f⁻¹)′(y) = 1 / f′(x) where y = f(x).","trap":"Evaluating f′ at y₀ instead of at x₀."},{"id":286,"s":"7.2","c":6,"a":"D","en":"$f(3)=324+6+18=348$, so the value is $\\frac{1}{f'(3)}=\\frac{1}{36\\cdot9+2}=\\frac{1}{326}$ — none of the options has this.","zh":"$f(3)=348$，故答案为 $\\frac{1}{36\\cdot3^2+2}=\\frac{1}{326}$。选项里分母都写错了（用了 $348$ 或 $4$），故选\\\"以上都不对\\\"。","focus":"Derivative of an inverse function: (f⁻¹)′(y) = 1 / f′(x) where y = f(x).","trap":"Evaluating f′ at y₀ instead of at x₀."},{"id":287,"s":"7.2","c":6,"a":"C","en":"$f(2)=40+12-19=33$, so $\\frac{1}{f'(2)}=\\frac{1}{15(2)^{2}+6}$.","zh":"$f(2)=33$，故 $a=2$，答案为 $\\frac{1}{15(2)^2+6}$。","focus":"Derivative of an inverse function: (f⁻¹)′(y) = 1 / f′(x) where y = f(x).","trap":"Evaluating f′ at y₀ instead of at x₀."},{"id":288,"s":"7.3","c":6,"a":"E","en":"$\\frac{d}{dx}\\arccos(e^{-68x})=-\\frac{1}{\\sqrt{1-(e^{-68x})^{2}}}\\cdot(-68e^{-68x})=\\frac{68e^{-68x}}{\\sqrt{1-e^{-136x}}}$.","zh":"$\\arccos$ 的导数是 $-\\frac{1}{\\sqrt{1-u^2}}$，内层导数 $-68e^{-68x}$，两个负号相消，得 $\\frac{68e^{-68x}}{\\sqrt{1-e^{-136x}}}$。","focus":"Standard derivatives of arcsin, arccos and arctan, with the chain rule.","trap":"Mixing up the arccos sign; forgetting u′."},{"id":289,"s":"7.3","c":6,"a":"C","en":"$\\arctan u$ with $u=8\\ln(10x)-1$: $u'=\\frac{8}{x}$, so the derivative is $\\frac{8}{x\\,(1+(8\\ln(10x)-1)^{2})}$.","zh":"内层 $u=8\\ln10x-1$ 的导数为 $\\frac8x$；套 $\\frac{u'}{1+u^2}$，得 $\\frac{8}{x(1+(8\\ln10x-1)^2)}$。","focus":"Standard derivatives of arcsin, arccos and arctan, with the chain rule.","trap":"Mixing up the arccos sign; forgetting u′."},{"id":290,"s":"7.3","c":6,"a":"A","en":"$\\arcsin(75x^{3})$: derivative $\\frac{225x^{2}}{\\sqrt{1-(75x^{3})^{2}}}$.","zh":"内层导数 $225x^2$，套 $\\frac{u'}{\\sqrt{1-u^2}}$，得 $\\frac{225x^2}{\\sqrt{1-(75x^3)^2}}$。","focus":"Standard derivatives of arcsin, arccos and arctan, with the chain rule.","trap":"Mixing up the arccos sign; forgetting u′."},{"id":291,"s":"7.3","c":6,"a":"A","en":"Same pattern with $u=e^{-28x}$: $\\frac{28e^{-28x}}{\\sqrt{1-e^{-56x}}}$.","zh":"$u'=-28e^{-28x}$，与 $\\arccos$ 的负号相消，得 $\\frac{28e^{-28x}}{\\sqrt{1-e^{-56x}}}$。","focus":"Standard derivatives of arcsin, arccos and arctan, with the chain rule.","trap":"Mixing up the arccos sign; forgetting u′."},{"id":292,"s":"7.3","c":6,"a":"D","en":"$\\frac{70e^{-70x}}{\\sqrt{1-e^{-140x}}}$.","zh":"内层导数 $-70e^{-70x}$ 消掉外层负号，得 $\\frac{70e^{-70x}}{\\sqrt{1-e^{-140x}}}$。","focus":"Standard derivatives of arcsin, arccos and arctan, with the chain rule.","trap":"Mixing up the arccos sign; forgetting u′."},{"id":293,"s":"7.4","c":6,"a":"B","en":"Write $y=(\\sin19x+14)^{\\ln19x}$ and take logs: $\\ln y=\\ln19x\\cdot\\ln(\\sin19x+14)$. Then $\\frac{y'}{y}=\\frac{19\\ln(\\sin19x+14)}{19x}+\\ln(19x)\\cdot\\frac{19\\cos19x}{\\sin19x+14}$.","zh":"幂指函数先取对数：$\\ln y=\\ln19x\\cdot\\ln(\\sin19x+14)$，两边对 $x$ 求导后乘回 $y$。两项分别来自 $19x$ 与 $\\sin$ 的求导。","focus":"Logarithmic differentiation for y = f(x)^{g(x)}.","trap":"Differentiating f^g as if the exponent were constant."},{"id":294,"s":"7.4","c":6,"a":"B","en":"Logs: $\\ln y=\\sin9x\\ln(9x^{8}+17)$, so $\\frac{y'}{y}=9\\cos9x\\ln(9x^{8}+17)+\\frac{72x^{7}\\sin9x}{9x^{8}+17}$.","zh":"$\\ln y=\\sin9x\\ln(9x^8+17)$，求导时乘积法则给出两项：$9\\cos9x\\ln(\\cdot)$ 与 $\\frac{72x^7\\sin9x}{9x^8+17}$。","focus":"Logarithmic differentiation for y = f(x)^{g(x)}.","trap":"Differentiating f^g as if the exponent were constant."},{"id":295,"s":"7.4","c":6,"a":"B","en":"$\\ln y=\\sin2x\\ln(6x^{2}+18)$, so $\\frac{y'}{y}=2\\cos2x\\ln(6x^{2}+18)+\\frac{12x\\sin2x}{6x^{2}+18}$.","zh":"取对数后求导，得 $2\\cos2x\\ln(\\cdot)+\\frac{12x\\sin2x}{6x^2+18}$，再乘 $y$。","focus":"Logarithmic differentiation for y = f(x)^{g(x)}.","trap":"Differentiating f^g as if the exponent were constant."},{"id":296,"s":"7.4","c":6,"a":"B","en":"Here $\\ln y=\\sin7x\\ln(7x^{4}+3)$. At $x=\\frac{\\pi}{7}$ we have $\\sin7x=0$ and $\\cos7x=-1$, so $y'=y\\cdot7(-1)\\ln(7x^{4}+3)=-7\\ln\\bigl(7(\\frac{\\pi}{7})^{4}+3\\bigr)$.","zh":"在 $x=\\frac{\\pi}{7}$ 处 $\\sin7x=0$、$\\cos7x=-1$，故 $y'=-7\\ln(7(\\frac{\\pi}{7})^4+3)$。利用 $\\sin=0$ 可直接消掉一整项。","focus":"Logarithmic differentiation for y = f(x)^{g(x)}.","trap":"Differentiating f^g as if the exponent were constant."},{"id":297,"s":"7.5","c":6,"a":"C","en":"Differentiate $9x^{4}+9xy=10y^{2}$: $36x^{3}+9y+9xy'=20yy'$. At $(-2,3)$: $-288+27-18y'=60y'$, so $y'=-\\frac{87}{26}$.","zh":"两边求导得 $36x^3+9y+9xy'=20yy'$，代入 $(-2,3)$ 解出 $y'=-\\frac{87}{26}$。含 $y$ 的项要乘 $y'$。","focus":"Implicit differentiation: differentiate both sides with respect to x, treating y as a function of x.","trap":"Forgetting y′ on y-terms; treating y as a constant."},{"id":298,"s":"7.5","c":6,"a":"A","en":"$6x^{6}+2xy^{2}=5y^{3}$ gives $36x^{5}+2y^{2}+4xyy'=15y^{2}y'$, hence $y'=\\frac{36x^{5}+2y^{2}}{15y^{2}-4xy}$ with the sign convention of the option.","zh":"求导得 $36x^5+2y^2+4xyy'=15y^2y'$，整理出 $y'$。$2xy^2$ 要用乘积法则。","focus":"Implicit differentiation: differentiate both sides with respect to x, treating y as a function of x.","trap":"Forgetting y′ on y-terms; treating y as a constant."},{"id":299,"s":"7.5","c":6,"a":"E","en":"$18y^{2}-27y=2x^{5}$ gives $(36y-27)y'=10x^{4}$. At $(3,6)$: $y'=\\frac{10\\cdot81}{216-27}=\\frac{810}{189}=\\frac{30}{7}$.","zh":"求导得 $(36y-27)y'=10x^4$，代入 $(3,6)$ 得 $\\frac{810}{189}=\\frac{30}{7}$。","focus":"Implicit differentiation: differentiate both sides with respect to x, treating y as a function of x.","trap":"Forgetting y′ on y-terms; treating y as a constant."},{"id":300,"s":"7.5","c":6,"a":"A","en":"$8x^{2}+18xy=-9y^{2}$ gives $16x+18y+18xy'=-18yy'$. At $(-3,2)$: $-48+36-54y'=-36y'$, so $y'=-\\frac23$.","zh":"求导后代 $(-3,2)$ 解出 $y'=-\\frac23$。左右两边都要把 $y$ 当函数处理。","focus":"Implicit differentiation: differentiate both sides with respect to x, treating y as a function of x.","trap":"Forgetting y′ on y-terms; treating y as a constant."},{"id":301,"s":"7.5","c":6,"a":"D","en":"$13x^{5}+17xy^{3}=-29y^{4}$ gives $65x^{4}+17y^{3}+51xy^{2}y'=-116y^{3}y'$, so $y'=-\\frac{65x^{4}+17y^{3}}{51xy^{2}+116y^{3}}$.","zh":"逐项求导后把含 $y'$ 的项归到一边，得 $y'=-\\frac{65x^4+17y^3}{51xy^2+116y^3}$。","focus":"Implicit differentiation: differentiate both sides with respect to x, treating y as a function of x.","trap":"Forgetting y′ on y-terms; treating y as a constant."},{"id":302,"s":"7.6","c":6,"a":"C","en":"$5\\sqrt y+4xy^{4}=5$: $\\frac{5}{2\\sqrt y}y'+4y^{4}+16xy^{3}y'=0$. At $(0,1)$: $\\frac52y'+4=0$, so $y'=-\\frac85$ and $y=1-\\frac85x$.","zh":"隐函数求导后代 $(0,1)$ 得 $y'=-\\frac85$，切线为 $y=1-\\frac85x$。","focus":"Tangent line to an implicitly defined curve at a given point.","trap":"Substituting the point before solving for y′; using the wrong point."},{"id":303,"s":"7.6","c":6,"a":"E","en":"$5\\sqrt y+6xy^{3}=5$: at $(0,1)$, $\\frac52y'+6=0$, so $y'=-\\frac{12}{5}$ and the tangent is $y=1-\\frac{12x}{5}$ — not listed.","zh":"在 $(0,1)$ 处 $y'=-\\frac{12}{5}$，切线为 $y=1-\\frac{12x}{5}$。选项 B 的斜率符号相反、D 缺常数项，故选\\\"以上都不对\\\"。","focus":"Tangent line to an implicitly defined curve at a given point.","trap":"Substituting the point before solving for y′; using the wrong point."},{"id":304,"s":"7.6","c":6,"a":"B","en":"$9\\sqrt y+8xy^{2}=9$: at $(0,1)$, $\\frac92y'+8=0$, so $y=1-\\frac{16x}{9}$ — none of the options states it.","zh":"在 $(0,1)$ 处 $y'=-\\frac{16}{9}$，切线 $y=1-\\frac{16x}{9}$，四个选项都不对。","focus":"Tangent line to an implicitly defined curve at a given point.","trap":"Substituting the point before solving for y′; using the wrong point."},{"id":305,"s":"7.6","c":6,"a":"E","en":"$4\\sqrt y+xy=0$: $\\frac{2}{\\sqrt y}y'+y+xy'=0$. At $(-2,4)$: $y'+4-2y'=0$, so $y'=4$ and $y=4x+12$.","zh":"在 $(-2,4)$ 处解出 $y'=4$，切线为 $y-4=4(x+2)$，即 $y=4x+12$。","focus":"Tangent line to an implicitly defined curve at a given point.","trap":"Substituting the point before solving for y′; using the wrong point."},{"id":306,"s":"7.6","c":6,"a":"C","en":"$8\\sqrt y+5xy=-2$: $\\frac{4}{\\sqrt y}y'+5y+5xy'=0$. At $(-2,1)$: $4y'+5-10y'=0$, so $y'=\\frac56$ and $y=\\frac{5x}{6}+\\frac83$.","zh":"在 $(-2,1)$ 处 $y'=\\frac56$，由点斜式得 $y=\\frac{5x}{6}+\\frac83$。","focus":"Tangent line to an implicitly defined curve at a given point.","trap":"Substituting the point before solving for y′; using the wrong point."},{"id":307,"s":"8.1","c":7,"a":"D","en":"$D^{2}=100^{2}+h^{2}$ gives $2DD'=2hh'$, so $D'=\\frac{h}{D}h'=\\frac{120\\cdot3}{\\sqrt{100^{2}+120^{2}}}$; that exact form is not among the options.","zh":"由 $D^2=100^2+h^2$ 求导得 $D'=\\frac{h}{D}h'=\\frac{120\\cdot3}{\\sqrt{100^2+120^2}}$。选项 A 把 $120$ 写成了 $100$，故选\\\"以上都不对\\\"。","focus":"Related rates with a right triangle: differentiate the geometric relation with respect to time.","trap":"Substituting the numbers before differentiating; forgetting a factor of 2 from differentiating squares."},{"id":308,"s":"8.1","c":7,"a":"C","en":"$D'=\\frac{130\\cdot6}{\\sqrt{170^{2}+130^{2}}}$.","zh":"同一模型：$D'=\\frac{h}{D}h'=\\frac{130\\cdot6}{\\sqrt{170^2+130^2}}$。先列关系式再对 $t$ 求导。","focus":"Related rates with a right triangle: differentiate the geometric relation with respect to time.","trap":"Substituting the numbers before differentiating; forgetting a factor of 2 from differentiating squares."},{"id":309,"s":"8.2","c":7,"a":"A","en":"$r=\\frac{7}{25}h$ so $V=\\frac{\\pi}{3}\\cdot\\frac{49}{625}h^{3}$, and $V'=\\frac{49\\pi}{625}h^{2}h'$. At $h=10$: $h'=\\frac{27\\cdot625}{49\\pi\\cdot100}$, which differs from every option by a factor $3$.","zh":"相似三角形给 $r=\\frac7{25}h$，故 $V=\\frac{\\pi}{3}\\cdot\\frac{49}{625}h^3$，求导得 $h'=\\frac{27\\cdot625}{49\\pi\\cdot100}$。选项 C 多了一个 $3$，故选\\\"以上都不对\\\"。","focus":"Related rates with similar triangles (conical tank).","trap":"Treating r as constant; using the full cone volume formula with a fixed radius."},{"id":310,"s":"8.2","c":7,"a":"D","en":"The same cone model: $h'=\\frac{23}{\\pi(8/21)^{2}h^{2}}$ with $h=17$, i.e. $\\frac{23\\cdot21^{2}}{\\pi\\cdot8^{2}\\cdot17^{2}}$.","zh":"同一模型代入：$h'=\\frac{23\\cdot21^2}{\\pi\\cdot8^2\\cdot17^2}$。相似比 $\\frac{8}{21}$ 要先平方。","focus":"Related rates with similar triangles (conical tank).","trap":"Treating r as constant; using the full cone volume formula with a fixed radius."},{"id":311,"s":"8.3","c":7,"a":"B","en":"$\\tan\\theta=\\frac{x}{190}$ gives $\\sec^{2}\\theta\\,\\theta'=\\frac{x'}{190}$, so $\\theta'=\\frac{15\\cdot190}{190^{2}+310^{2}}$ with a minus sign because the angle shrinks.","zh":"$\\tan\\theta=\\frac{x}{190}$ 求导得 $\\theta'=\\frac{190x'}{190^2+x^2}$；$x'=-15$（船在靠近），故结果为 $-\\frac{15\\cdot190}{190^2+310^2}$。","focus":"Related rates with an angle: differentiate a trigonometric relation.","trap":"Forgetting to convert the angle to radians when a rate in degrees is given."},{"id":312,"s":"9.1","c":8,"a":"A","en":"$f'=-3(x+2)^{2}$ vanishes at $x=-2$, a stationary point. The derivative exists everywhere, so there are no singular points.","zh":"$f'=-3(x+2)^2$ 在 $x=-2$ 为零，是驻点；导数处处存在，无奇点。驻点看 $f'=0$，奇点看 $f'$ 不存在。","focus":"Critical points where f′ = 0 and singular points where f′ does not exist.","trap":"Only reporting f′ = 0; including points outside the domain."},{"id":313,"s":"9.1","c":8,"a":"D","en":"$f'=6(x+2)^{2}=0$ at $x=-2$, and the derivative exists on $[-4,0]$, so no singular points.","zh":"$f'=6(x+2)^2$ 在 $x=-2$ 为零；区间内导数处处存在，故只有驻点。","focus":"Critical points where f′ = 0 and singular points where f′ does not exist.","trap":"Only reporting f′ = 0; including points outside the domain."},{"id":314,"s":"9.1","c":8,"a":"D","en":"$f'=3(x+1)^{2}$ vanishes at $x=-1$; no point where the derivative fails to exist.","zh":"$f'=3(x+1)^2$ 在 $x=-1$ 为零，无奇点。","focus":"Critical points where f′ = 0 and singular points where f′ does not exist.","trap":"Only reporting f′ = 0; including points outside the domain."},{"id":315,"s":"9.1","c":8,"a":"C","en":"$f=-(x+1)^{2/3}$ has $f'=-\\frac{2}{3}(x+1)^{-1/3}$, which is never zero but fails to exist at $x=-1$: a singular point, no stationary point.","zh":"$f'=-\\frac23(x+1)^{-1/3}$ 永不为零，但在 $x=-1$ 处不存在，故只有奇点没有驻点。分数幂在端点处常出奇点。","focus":"Critical points where f′ = 0 and singular points where f′ does not exist.","trap":"Only reporting f′ = 0; including points outside the domain."},{"id":316,"s":"9.1","c":8,"a":"D","en":"$f=-2\\sqrt{x+7}+3$ has $f'=-\\frac{1}{\\sqrt{x+7}}$, never zero and defined on the whole interval $[-6,2]$ except the endpoint behaviour, so neither type occurs.","zh":"$f'=-\\frac{1}{\\sqrt{x+7}}$ 在 $(-6,2]$ 内不为零且处处存在，故既无驻点也无奇点。","focus":"Critical points where f′ = 0 and singular points where f′ does not exist.","trap":"Only reporting f′ = 0; including points outside the domain."},{"id":317,"s":"9.2","c":8,"a":"A","en":"$f'=-\\frac43(x+2)^{-1/3}$ never vanishes but is undefined at $x=-2$; so the candidates are the endpoints $-3,0$ and the critical point $-2$.","zh":"$f'$ 在 $x=-2$ 不存在，端点为 $-3$ 与 $0$，故候选点为 $-3,-2,0$。闭区间最值必须同时考虑端点与内部临界点。","focus":"Absolute extrema on a closed interval: check critical points and both endpoints.","trap":"Forgetting the endpoints; using the first-derivative test instead of comparing values."},{"id":318,"s":"9.2","c":8,"a":"B","en":"Write $u=x+2$; then $f'=-\\frac{u^{1/3}(u+12)}{3(u+5)^{2}}$, which vanishes and is undefined at the same point $u=0$. So the only interior candidate is $x=-2$, and with the endpoints the list is $-4,-2,4$.","zh":"令 $u=x+2$，求导得 $f'=-\\frac{u^{1/3}(u+12)}{3(u+5)^2}$，零点与不可导点重合于 $u=0$。故内部候选点只有 $x=-2$，加上端点即 $-4,-2,4$。","focus":"Absolute extrema on a closed interval: check critical points and both endpoints.","trap":"Forgetting the endpoints; using the first-derivative test instead of comparing values."},{"id":319,"s":"9.2","c":8,"a":"C","en":"$f'=-\\frac{1}{\\sqrt{x+7}}$ is never zero and is defined on $(-6,2)$, so only the endpoints matter: $-6$ and $2$.","zh":"导数在区间内恒不为零且处处存在，故只需比较端点 $-6$ 与 $2$。没有临界点时端点就是全部候选。","focus":"Absolute extrema on a closed interval: check critical points and both endpoints.","trap":"Forgetting the endpoints; using the first-derivative test instead of comparing values."},{"id":320,"s":"9.2","c":8,"a":"B","en":"The radical forces $x\\ge-2$, and on that domain $f=-(x+2)+10$ is linear with slope $-1$, so there is no interior stationary point; the candidates are the interval ends and the edge of the domain, $-3$, $-2$, $0$.","zh":"根号要求 $x\\ge-2$，在该段上 $f=-(x+2)+10$ 是斜率为 $-1$ 的直线，内部无驻点；候选点为两个端点与定义域边界，即 $-3,-2,0$。","focus":"Absolute extrema on a closed interval: check critical points and both endpoints.","trap":"Forgetting the endpoints; using the first-derivative test instead of comparing values."},{"id":321,"s":"9.2","c":8,"a":"A","en":"$f'=e^{-x-2}(x+1)$ vanishes at $x=-1$; together with the endpoints $-2,2$ the candidates are $-2,-1,2$, a set no option lists.","zh":"$f'=e^{-x-2}(x+1)$ 在 $x=-1$ 为零，加上端点得 $-2,-1,2$。选项都没有这三个点，故选\\\"以上都不对\\\"。","focus":"Absolute extrema on a closed interval: check critical points and both endpoints.","trap":"Forgetting the endpoints; using the first-derivative test instead of comparing values."},{"id":322,"s":"9.2","c":8,"a":"B","en":"$f=(x+1)^{2}(4x-14)$ has $f'=2(x+1)(4x-14)+4(x+1)^{2}=6(x+1)(2x-4)$, zero at $x=-1$ and $x=2$. Comparing with the endpoints, the maximum is at $x=5$ and the minimum at $x=-\\frac52$ and $x=2$.","zh":"求导得 $6(x+1)(2x-4)$，临界点 $x=-1,2$。与端点比较：最大值在 $x=5$，最小值在 $x=-\\frac52$ 与 $x=2$。","focus":"Absolute extrema on a closed interval: check critical points and both endpoints.","trap":"Forgetting the endpoints; using the first-derivative test instead of comparing values."},{"id":323,"s":"9.2","c":8,"a":"B","en":"$f=(x+1)^{2/3}$ is decreasing to $x=-1$ then increasing, so the maximum is at the left endpoint $-9$ and the minimum at $x=-1$.","zh":"$f$ 在 $x=-1$ 左侧递减、右侧递增，故最大值在左端点 $-9$，最小值在 $x=-1$。","focus":"Absolute extrema on a closed interval: check critical points and both endpoints.","trap":"Forgetting the endpoints; using the first-derivative test instead of comparing values."},{"id":324,"s":"9.2","c":8,"a":"E","en":"$f=-2(x-2)^{2/3}$ peaks at $x=2$ and decreases away from it, so the maximum is at $x=2$ and the minimum at the farther endpoint $x=-6$.","zh":"$f$ 在 $x=2$ 取最大值，向两侧递减；端点 $-6$ 比 $4$ 更远，故最小值在 $x=-6$。","focus":"Absolute extrema on a closed interval: check critical points and both endpoints.","trap":"Forgetting the endpoints; using the first-derivative test instead of comparing values."},{"id":325,"s":"9.2","c":8,"a":"A","en":"$f=(x-1)^{2}(2x-5)$ has critical points $x=1$ and $x=2$; evaluating at endpoints and these gives maximum at $x=3$, minimum at $x=\\frac12$ and $x=2$.","zh":"展开求导得临界点 $x=1,2$，与端点比较得最大值在 $x=3$、最小值在 $x=\\frac12$ 与 $x=2$。","focus":"Absolute extrema on a closed interval: check critical points and both endpoints.","trap":"Forgetting the endpoints; using the first-derivative test instead of comparing values."},{"id":326,"s":"9.2","c":8,"a":"D","en":"$f=-2(x+1)^{2/3}$ peaks at $x=-1$; the endpoints $-9$ and $7$ tie for the minimum.","zh":"$f$ 在 $x=-1$ 取最大值；两端点 $-9$ 与 $7$ 对称，最小值同时取到。","focus":"Absolute extrema on a closed interval: check critical points and both endpoints.","trap":"Forgetting the endpoints; using the first-derivative test instead of comparing values."},{"id":327,"s":"9.2","c":8,"a":"D","en":"$f=3\\frac{(x-2)^{4/3}}{x+1}$ on $[0,8]$: the maximum is $3\\cdot\\frac{6^{4/3}}{9}=6\\sqrt[3]{2}$ (at $x=8$) and the minimum is $0$ (at $x=2$).","zh":"在 $[0,8]$ 上比较端点与临界点：$x=8$ 处取最大值 $6\\sqrt[3]2$，$x=2$ 处函数值为 $0$ 即最小值。","focus":"Absolute extrema on a closed interval: check critical points and both endpoints.","trap":"Forgetting the endpoints; using the first-derivative test instead of comparing values."},{"id":328,"s":"9.2","c":8,"a":"C","en":"$f=3(x+1)^{2/3}$ on $[-2,1]$: values are $3$ at $x=-2$, $0$ at $x=-1$, $3\\sqrt[3]{4}$ at $x=1$. The maximum is $3\\sqrt[3]{4}\\approx4.76$ and the minimum $0$, a pair no option states.","zh":"三点取值：$f(-2)=3$、$f(-1)=0$、$f(1)=3\\sqrt[3]4\\approx4.76$。最大 $3\\sqrt[3]4$、最小 $0$，选项都没有这一对，故选\\\"以上都不对\\\"。","focus":"Absolute extrema on a closed interval: check critical points and both endpoints.","trap":"Forgetting the endpoints; using the first-derivative test instead of comparing values."},{"id":329,"s":"9.2","c":8,"a":"D","en":"$f=-\\sqrt{x+7}$ is decreasing, so the maximum is at $x=-6$ ($-1$) and the minimum at $x=2$ ($-3$).","zh":"$f$ 单调递减，最大值在左端点 $-6$ 处为 $-1$，最小值在右端点 $2$ 处为 $-3$。","focus":"Absolute extrema on a closed interval: check critical points and both endpoints.","trap":"Forgetting the endpoints; using the first-derivative test instead of comparing values."},{"id":330,"s":"9.2","c":8,"a":"A","en":"The critical point $x=0$ gives $7$; at $x=-2$ the value is $4\\sqrt[3]{2}+7\\approx12.04$ and at $x=6$ it is $\\frac{4\\sqrt[3]{6}}{3}+7\\approx9.4$. The true pair (max $4\\sqrt[3]2+7$, min $7$) appears in no option.","zh":"临界点 $x=0$ 处为 $7$；$x=-2$ 处 $4\\sqrt[3]2+7\\approx12.04$，$x=6$ 处约 $9.4$。真正的最值对（最大 $4\\sqrt[3]2+7$、最小 $7$）不在选项中。","focus":"Absolute extrema on a closed interval: check critical points and both endpoints.","trap":"Forgetting the endpoints; using the first-derivative test instead of comparing values."},{"id":331,"s":"9.2","c":8,"a":"C","en":"$f=-2\\frac{(x-1)^{4/3}}{x+2}$ on $[-1,7]$: at $x=1$ the value is $0$ (maximum) and at $x=7$ it is $-\\frac{2\\cdot6^{4/3}}{9}=-4\\sqrt[3]2$ (minimum).","zh":"$x=1$ 处函数值为 $0$ 是最大值；$x=7$ 处为 $-4\\sqrt[3]2$ 是最小值。分子在 $x=1$ 为零是关键。","focus":"Absolute extrema on a closed interval: check critical points and both endpoints.","trap":"Forgetting the endpoints; using the first-derivative test instead of comparing values."},{"id":332,"s":"9.3","c":8,"a":"D","en":"$f'=-3x^{2}\\le0$ everywhere and is zero only at a single point, so $f$ is decreasing on $\\mathbb{R}$ and increasing nowhere.","zh":"$f'=-3x^2\\le0$ 恒成立，仅在一点为零，故函数在 $\\mathbb{R}$ 上单调递减，没有递增区间。导数偶尔为零不改变单调性。","focus":"Intervals of increase and decrease from the sign of f′.","trap":"Writing closed intervals where f′ = 0 at an endpoint; ignoring the domain."},{"id":333,"s":"9.3","c":8,"a":"D","en":"With $u=x+1$, $f'=\\frac{u(8-4u^{2})}{4}$: sign $+$ on $(-\\infty,-3]$ and $[-1,1]$, $-$ elsewhere, so $f$ increases there and decreases on $[-3,-1]$ and $[1,\\infty)$.","zh":"令 $u=x+1$，$f'=\\frac{u(8-4u^2)}{4}$。符号在 $(-\\infty,-3]$、$[-1,1]$ 为正，其余为负，故这些区间递增，$[-3,-1]$ 与 $[1,\\infty)$ 递减。","focus":"Intervals of increase and decrease from the sign of f′.","trap":"Writing closed intervals where f′ = 0 at an endpoint; ignoring the domain."},{"id":334,"s":"9.3","c":8,"a":"B","en":"With $u=x-2$, $f'=\\frac{u(u^{2}-4)}{2}$, positive on $[0,2]$ and $[4,\\infty)$, negative on $(-\\infty,0]$ and $[2,4]$.","zh":"令 $u=x-2$，$f'=\\frac{u(u^2-4)}{2}$。$[0,2]$、$[4,\\infty)$ 上为正（递增），$(-\\infty,0]$、$[2,4]$ 上为负（递减）。","focus":"Intervals of increase and decrease from the sign of f′.","trap":"Writing closed intervals where f′ = 0 at an endpoint; ignoring the domain."},{"id":335,"s":"9.3","c":8,"a":"C","en":"$f'=2x(x^{2}-4)$, so the critical points are $x=-2,0,2$. The sign pattern $-,+,-,+$ gives increasing on $[-2,0]$ and $[2,\\infty)$, decreasing on $(-\\infty,-2]$ and $[0,2]$.","zh":"$f'=2x(x^2-4)$，临界点 $-2,0,2$。符号依次为 $-,+,-,+$，故 $[-2,0]$ 与 $[2,\\infty)$ 递增，$(-\\infty,-2]$ 与 $[0,2]$ 递减。","focus":"Intervals of increase and decrease from the sign of f′.","trap":"Writing closed intervals where f′ = 0 at an endpoint; ignoring the domain."},{"id":336,"s":"9.3","c":8,"a":"E","en":"$f=2|x-1|$ has slope $-2$ for $x&lt;1$ and $+2$ for $x&gt;1$: increasing on $[1,\\infty)$, decreasing on $(-\\infty,1]$.","zh":"$f=2|x-1|$ 在 $x&lt;1$ 斜率为 $-2$、$x&gt;1$ 为 $+2$，故在 $[1,\\infty)$ 递增、$(-\\infty,1]$ 递减。","focus":"Intervals of increase and decrease from the sign of f′.","trap":"Writing closed intervals where f′ = 0 at an endpoint; ignoring the domain."},{"id":337,"s":"9.4","c":8,"a":"C","en":"$f=-\\ln(|x-2|+1)+3$ has $f''=\\frac{1}{(|x-2|+1)^{2}}$ on each side of $x=2$, always positive, so the maximal open intervals of upward concavity are $(-\\infty,2)$ and $(2,\\infty)$ — the single interval $(-\\infty,\\infty)$ is not a valid answer because $f$ is not differentiable at $2$, and no option states the split, hence “none of these”.","zh":"$f''=\\frac{1}{(|x-2|+1)^2}&gt;0$ 恒成立，但 $x=2$ 处不可导，故凹向上的最大开区间是 $(-\\infty,2)$ 与 $(2,\\infty)$ 两段，而非 $(-\\infty,\\infty)$。选项都没写这个拆分，故选\\\"以上都不对\\\"。","focus":"Concavity and inflection points from the sign of f″.","trap":"Calling every f″ = 0 point an inflection point without a sign change."},{"id":338,"s":"9.4","c":8,"a":"A","en":"$f=-\\frac{1}{3\\sqrt{x-1}}+3$ has $f''$ that changes sign at $x=1$: the graph is concave up on $(-\\infty,1)$ and concave down on $(1,\\infty)$ within the domain.","zh":"二阶导在 $x=1$ 两侧变号：$(-\\infty,1)$ 上凹向上，$(1,\\infty)$ 上凹向下。拐点与定义域边界要分开看。","focus":"Concavity and inflection points from the sign of f″.","trap":"Calling every f″ = 0 point an inflection point without a sign change."},{"id":339,"s":"9.4","c":8,"a":"C","en":"With $u=x-1$, $\\sin^{2}u=\\frac{1-\\cos2u}{2}$ gives $f''=-2(6+2\\cos2u)=-12-4\\cos2u\\le-8&lt;0$ everywhere. Hence $f$ is concave down on $\\mathbb{R}$ and never concave up.","zh":"令 $u=x-1$，用 $\\sin^2u=\\frac{1-\\cos2u}{2}$ 得 $f''=-12-4\\cos2u\\le-8&lt;0$ 恒成立，故函数处处凹向下，没有凹向上的区间。","focus":"Concavity and inflection points from the sign of f″.","trap":"Calling every f″ = 0 point an inflection point without a sign change."},{"id":340,"s":"9.4","c":8,"a":"B","en":"$f=e^{(x+2)^{2}}$ has $f''=2e^{(x+2)^{2}}(1+2(x+2)^{2})&gt;0$, so it is concave up on $(-\\infty,\\infty)$ and never concave down.","zh":"$f''=2e^{(x+2)^2}(1+2(x+2)^2)&gt;0$ 恒成立，故在整个 $\\mathbb{R}$ 上凹向上，没有凹向下区间。","focus":"Concavity and inflection points from the sign of f″.","trap":"Calling every f″ = 0 point an inflection point without a sign change."},{"id":341,"s":"9.4","c":8,"a":"A","en":"With $u=x+2$, $f''=\\frac{4u(u^{2}-12)}{(u^{2}+4)^{3}}$, which changes sign at $u=0$ and $u=\\pm2\\sqrt3$. The sign is $+$ on $(-2\\sqrt3,0)$ and on $(2\\sqrt3,\\infty)$, so $f$ is concave up on $(-2\\sqrt3-2,-2)$ and on $(-2+2\\sqrt3,\\infty)$.","zh":"令 $u=x+2$，$f''=\\frac{4u(u^2-12)}{(u^2+4)^3}$，变号点在 $u=0,\\pm2\\sqrt3$。符号在 $(-2\\sqrt3,0)$ 与 $(2\\sqrt3,\\infty)$ 为正，故凹向上区间为 $(-2\\sqrt3-2,-2)$ 与 $(-2+2\\sqrt3,\\infty)$。","focus":"Concavity and inflection points from the sign of f″.","trap":"Calling every f″ = 0 point an inflection point without a sign change."},{"id":342,"s":"9.4","c":8,"a":"C","en":"$f=(x-2)e^{(x-2)^{2}}+2$ has $f''=e^{u^{2}}\\cdot2u(3+2u^{2})$ with $u=x-2$, zero at $u=0$ and changing sign there: the only inflection point is $(2,2)$.","zh":"令 $u=x-2$，$f''\\propto u(3+2u^2)$ 只在 $u=0$ 变号，故唯一拐点为 $(2,2)$。拐点要求二阶导变号，仅为零不够。","focus":"Concavity and inflection points from the sign of f″.","trap":"Calling every f″ = 0 point an inflection point without a sign change."},{"id":343,"s":"9.4","c":8,"a":"B","en":"$f=(x+1)^{4}+7$ has $f''=12(x+1)^{2}\\ge0$, never changing sign, so there are no inflection points.","zh":"$f''=12(x+1)^2\\ge0$ 不变号，故没有拐点。四阶多项式的二阶导常只为零而不变号。","focus":"Concavity and inflection points from the sign of f″.","trap":"Calling every f″ = 0 point an inflection point without a sign change."},{"id":344,"s":"9.4","c":8,"a":"D","en":"$f=2\\sqrt[3]{x+2}+2$ has $f''$ changing sign at $x=-2$, so the inflection point is $(-2,2)$.","zh":"二阶导在 $x=-2$ 两侧变号，故拐点为 $(-2,2)$。立方根类函数常在内部点出拐点。","focus":"Concavity and inflection points from the sign of f″.","trap":"Calling every f″ = 0 point an inflection point without a sign change."},{"id":345,"s":"9.4","c":8,"a":"B","en":"$f=2\\frac{x}{x^{2}+9}+2$ has $f''$ zero at $x=0$ and $x=\\pm3\\sqrt3$, all sign-changing, giving three inflection points.","zh":"$f''$ 在 $x=0$ 与 $x=\\pm3\\sqrt3$ 处变号，故有三个拐点。奇函数结构常给出对称的三个。","focus":"Concavity and inflection points from the sign of f″.","trap":"Calling every f″ = 0 point an inflection point without a sign change."},{"id":346,"s":"9.4","c":8,"a":"B","en":"$f=\\sqrt[3]{x-2}+2$ has $f''$ changing sign only at $x=2$, so one inflection point at $(2,2)$.","zh":"二阶导只在 $x=2$ 变号，拐点为 $(2,2)$。","focus":"Concavity and inflection points from the sign of f″.","trap":"Calling every f″ = 0 point an inflection point without a sign change."},{"id":347,"s":"9.5","c":8,"a":"C","en":"$f'=3x^{2}+2&gt;0$, so $f$ is strictly increasing and has exactly one root; $f(1)=-5&lt;0$ and $f(2)=10&gt;0$ locate it in $(1,2)$.","zh":"$f'=3x^2+2&gt;0$，函数严格递增，故恰有一个实根；$f(1)&lt;0$、$f(2)&gt;0$ 把它定位在 $(1,2)$。单调性定个数，介值定理定位置。","focus":"Number of real roots of an equation, counted via monotonicity and sign changes.","trap":"Counting roots without checking the behaviour at ±∞; missing a double root."},{"id":348,"s":"9.5","c":8,"a":"C","en":"$f'=3x^{2}+2&gt;0$ gives exactly one root; $f(-1)=-2&lt;0$ and $f(0)=1&gt;0$, so it lies in $(-1,0)$.","zh":"导数恒正故只有一根；$f(-1)&lt;0$、$f(0)&gt;0$，根在 $(-1,0)$。","focus":"Number of real roots of an equation, counted via monotonicity and sign changes.","trap":"Counting roots without checking the behaviour at ±∞; missing a double root."},{"id":349,"s":"9.5","c":8,"a":"B","en":"$f'=3x^{2}+4&gt;0$: exactly one root, and $f(1)=-2&lt;0$, $f(2)=9&gt;0$ place it in $(1,2)$.","zh":"导数恒正，唯一根；$f(1)&lt;0$、$f(2)&gt;0$ 得根在 $(1,2)$。","focus":"Number of real roots of an equation, counted via monotonicity and sign changes.","trap":"Counting roots without checking the behaviour at ±∞; missing a double root."},{"id":350,"s":"9.5","c":8,"a":"A","en":"$f'=3x^{2}+1&gt;0$: one root; $f(-1)=-1&lt;0$ and $f(0)=1&gt;0$ put it in $(-1,0)$.","zh":"$f'&gt;0$，唯一根；端点异号说明根在 $(-1,0)$。","focus":"Number of real roots of an equation, counted via monotonicity and sign changes.","trap":"Counting roots without checking the behaviour at ±∞; missing a double root."},{"id":351,"s":"9.5","c":8,"a":"D","en":"$f'=3x^{2}+4&gt;0$, so exactly one real root; $f(-3)=-27-12+20=-19&lt;0$ and $f(-2)=-8-8+20=4&gt;0$ place it in $(-3,-2)$.","zh":"导数恒正，故只有一根；$f(-3)&lt;0$、$f(-2)&gt;0$，根落在 $(-3,-2)$。","focus":"Number of real roots of an equation, counted via monotonicity and sign changes.","trap":"Counting roots without checking the behaviour at ±∞; missing a double root."}],"sections":[{"id":"1.1","en":"Natural Domain of a Logarithmic Function","zh":"对数函数的自然定义域","n":10,"ch":0,"from":1,"to":10},{"id":"1.2","en":"Evaluating Composite Functions","zh":"复合函数求值","n":10,"ch":0,"from":11,"to":20},{"id":"1.3","en":"Inverse Function and Its Domain","zh":"反函数及其定义域","n":5,"ch":0,"from":21,"to":25},{"id":"1.4a","en":"Principal Values of Inverse Trig (same function)","zh":"反三角化主值（同函数）","n":15,"ch":0,"from":26,"to":40},{"id":"1.4b","en":"Converting Between Inverse Trig Functions","zh":"反三角互化（异函数）","n":5,"ch":0,"from":41,"to":45},{"id":"1.4c","en":"Nested Inverse Trigonometric Evaluation","zh":"反三角嵌套代数求值","n":5,"ch":0,"from":46,"to":50},{"id":"2.1","en":"Limit of a Piecewise Function at a Point","zh":"分段函数在某点的极限","n":5,"ch":1,"from":51,"to":55},{"id":"2.2","en":"One-Sided Limits of Piecewise Functions","zh":"分段函数的左右极限","n":5,"ch":1,"from":56,"to":60},{"id":"2.3","en":"Limits Involving Absolute Value","zh":"含绝对值的极限","n":5,"ch":1,"from":61,"to":65},{"id":"2.4","en":"Oscillation and Non-Existent Limits","zh":"振荡函数与极限不存在","n":5,"ch":1,"from":66,"to":70},{"id":"2.5","en":"0/0 Form: Factoring and Cancelling","zh":"0/0 型：因式分解约简","n":10,"ch":1,"from":71,"to":80},{"id":"2.6","en":"Direct Substitution for Continuous Functions","zh":"连续函数直接代入","n":5,"ch":1
